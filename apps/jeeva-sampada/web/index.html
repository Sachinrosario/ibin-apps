<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Inventory of Biological Resources of India</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ui/icon.png">
<meta name="theme-color" content="#0a246a">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1024px;height:768px;transform-origin:0 0;background:#fff;overflow:hidden;user-select:none;-webkit-user-select:none;font-family:Tahoma,Verdana,Arial,sans-serif}
.lst::-webkit-scrollbar{width:16px;background:#e8e6e0}
.lst::-webkit-scrollbar-thumb{background:#d4d0c8;border:2px outset #fff}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
</style></head>
<body>
<script src="classic.js"></script>
<script src="links.js"></script>
<script>
"use strict";
const {stage, el, img, hot, win, list, combo, label} = CL;
img('ui/main.png', 0, 0);
// the scrolling line under the window, as in the original
const TICK = '   *  Provides data on 42,000 species   *  Comprises 98,00,000 records   *  Digitized data forms with multi-relational links   *  User friendly query based data retrieval   *  Diverse datasets in independent databases   *  Option for pooling all databases into inter-communicable layers   *  Compiled by 400 scientists from over 150 centres across the country   *  Database size - 12.0 GB   *  Fully indigenous software ';
const tk = el('div', 'position:absolute;left:0;top:734px;width:1024px;height:34px;overflow:hidden;background:#fff;');
const tr = el('div', 'position:absolute;left:0;top:5px;white-space:pre;font:18px Arial,Helvetica,sans-serif;color:#008000;animation:tick 70s linear infinite;', tk);
tr.textContent = TICK + TICK;
// the programs the main menu starts (each was a separate program in the same folder)
const PROGRAMS = {
  amr: 'amr/index.html', birds: 'birds/index.html', insects: 'insects/index.html', croppest: 'croppest/index.html', domestic: 'domestic/index.html', fish: 'fish/index.html', labanimal: 'labanimal/index.html', silk: 'silkworm/index.html',
  plants: 'sasya/index.html', marine: 'marine/index.html', microbial: 'microbial/index.html'
};
function run(key, q) {
  const p = PROGRAMS[key];
  if (p) { location.href = p + (q || ''); return; }
  msg('Jeeva Sampada', 'This database is being rebuilt and will open here in a later update.');
}
function msg(title, text) {
  const w = 380, h = 120, d = el('div', `position:absolute;left:${(1024 - w) / 2}px;top:${(768 - h) / 2}px;width:${w}px;height:${h}px;background:#d4d0c8;border:2px outset #fff;box-shadow:1px 1px 0 #404040;z-index:200000;font:11px Tahoma,Verdana,Arial,sans-serif;`);
  el('div', 'height:18px;margin:1px;background:linear-gradient(90deg,#0a246a,#a6caf0);color:#fff;font-weight:bold;line-height:18px;padding-left:4px;', d).textContent = title;
  el('div', 'padding:16px 14px;', d).textContent = text;
  const b = el('div', 'position:absolute;left:155px;top:84px;width:70px;height:22px;border:2px outset #fff;text-align:center;line-height:20px;box-sizing:border-box;cursor:default;', d);
  b.textContent = 'OK'; b.onclick = () => d.remove();
}
// ---- menu bar ----
let menu = null;
function closeMenu() { if (menu) { menu.remove(); menu = null; } }
addEventListener('click', closeMenu);
hot(10, 19, 103, 18, stage, () => {
  if (menu) return closeMenu();
  menu = el('div', 'position:absolute;left:0;top:20px;width:240px;height:152px;z-index:99999;');
  img('ui/menu_animal.png', 0, 0, menu);
  const items = [['amr', 'Amphibia, Reptilia & Mammals'], ['birds', 'Birds'], ['insects', 'Insects'], ['croppest', 'Crop Pests,Natural Enemies & Pollinators'], ['domestic', 'Domestic Animals'], ['fish', 'Freshwater Fin fishes & Shell fishes'], ['labanimal', 'Laboratory Animals'], ['silk', 'Silk Worms']];
  items.forEach(([k, t], i) => {
    const r = el('div', `position:absolute;left:3px;top:${21 + i * 16}px;width:234px;height:16px;font:11px Tahoma,Verdana,Arial,sans-serif;line-height:16px;padding-left:20px;box-sizing:border-box;color:transparent;white-space:nowrap;`, menu);
    r.textContent = t;
    r.addEventListener('mouseenter', () => { r.style.background = '#0a246a'; r.style.color = '#fff'; });
    r.addEventListener('mouseleave', () => { r.style.background = ''; r.style.color = 'transparent'; });
    r.addEventListener('click', e => { e.stopPropagation(); closeMenu(); run(k); });
  });
});
hot(121, 19, 94, 18, stage, () => { closeMenu(); run('plants'); });
hot(223, 19, 103, 18, stage, () => { closeMenu(); run('marine'); });
hot(334, 19, 113, 18, stage, () => { closeMenu(); run('microbial'); });
hot(454, 19, 39, 18, stage, () => { closeMenu(); openLinks(); });
// ---- Links ----
let links = null;
function openLinks() {
  if (links) return;
  const d = win('ui/links.png', 2, 40, 749, 582, {onclose: () => { links = null; }}); links = d;
  const F = '11px Tahoma,Verdana,Arial,sans-serif';
  const states = [...new Set(LK.dat.map(r => r[0]))];
  let st = '', ds = '', grp = '', spp = [], pick = '';
  const cSp = combo(d, 355, 278, 329, 23, [], F, '#000', v => { pick = v; }, {rows: 12, lh: 15});
  const lst = list(d, 29, 168, 285, 384, [], F, '#000', (i, it) => {
    grp = it; pick = '';
    spp = (LK.sp[grp] || {})[st + '|' + (ds || 'None')] || [];
    cSp.set(spp.map(s => s.join(' ').trim()));
  }, {lh: 1.25});
  function groups() {
    const rows = LK.dat.filter(r => r[0] === st && (!ds || r[1] === ds));
    const on = LK.cols.filter((c, i) => rows.some(r => r[2][i] === '1'));
    lst.set(on); cSp.set([]); grp = ''; pick = '';
  }
  const cDs = combo(d, 419, 70, 265, 23, [], F, '#000', v => { ds = v; groups(); }, {rows: 12, lh: 15});
  combo(d, 59, 70, 249, 23, states, F, '#000', v => {
    st = v; ds = '';
    cDs.set([...new Set(LK.dat.filter(r => r[0] === st && r[1] !== 'None').map(r => r[1]))]);
    groups();
  }, {rows: 12, lh: 15});
  const APP = {Amphibia: 'amr', Mammals: 'amr', Lizards: 'amr', Snakes: 'amr', 'Turtles Tortoises': 'amr', Birds: 'birds', 'Domestic Animals': 'domestic', Finfishes: 'fish', Crabs: 'fish', Mollusc: 'fish', Prawns: 'fish', Microbes: 'microbial', Plant: 'plants', Pest: 'croppest', Vectors: 'croppest', SilkWorms: 'silk'};
  hot(467, 318, 88, 32, d, () => {
    if (!grp) return;
    const [g, s] = (spp.find(x => x.join(' ').trim() === pick) || []);
    run(APP[grp], g ? `?g=${encodeURIComponent(g)}&s=${encodeURIComponent(s || '')}` : '');
  });
}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script></body></html>
