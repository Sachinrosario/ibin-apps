<Center><b><u>
<font color="#A52A2A" size=5> Actinomycetes</font></u></b></center>
<br>
<!--
Microorganisms are the majority and  the most important components of biodiversity of the planet EARTH. Bacteria and archaea have been living on earth for more than 3 Billion years and shaped the enviornment for evolution of other life forms.
<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
They have global cycles of C,O,N,P. They compost and mineralize,thus keeping the enviornment clean. They are, therefore, important for the health of planet. They are a rich source of health supporting chemicals. pencillin, Stretomycin, Cyclorporin,Streptokinase and many other therapentic agents are derived from microbes. A large number of foods ( Curd,Cheese etc.) rely on their activities.Only a few of them are really nasty pathogen to human, animals and plants.
<br><br>
<center><u><b>
<font color="#A52A2A" size=5> WHAT ARE MICROBES ?</font></u></b></center>
<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
These are the organisms too small (less than one tenth of millimeter)to be seen by naked eye. One has to use a microscope to see them. These include both prokaryotic (genetic materia, DNA is not organised innucleus and no organelle)archaea ansd bacteria as well as eukaryotic(DNA is organised as chromosomes in nucleus) organisms like fungi, yeasts, protozoa, micro algae etc. Viruses are much smaller than bacteria and they are active only when they are inside a host organism.
<br><br>
<Center><b><u>
<font color="#A52A2A" size=5> WHERE DO WE FIND THEM ? </font></u></b></center>
<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
Microbes, specially bacteria are present every where - in the air, in water, soil,in extreme habitats like icy continent,hydrotherma vents(temperature may be above 100 C), sea sediments. They are present on and in other living organisms. For example, one gram of soil contains about a million bacteria, human skin has approximately a thousand per sqaure inch and colon has about 10 trillion. Microbes present in enviornment are mostly members of archaea group. Fungi are also present everywhere but not in extreme enviornments. Tropical rain forests are rich habitats for a large number of fungi. Algae are found in moist places and in aquatic bodies.Many microbes live in association with other organisms, sometimes deriving mutual benefit (symbiotic) or as parasites. Microbes are the unseen majority on this planet.
