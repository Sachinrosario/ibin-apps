function showDist() {

  } else {
    const cols = R.cols || rows[0].map((_, i) => i);
    rows.forEach(r => { h += `<tr${R.sep ? ' class="sep"' : ''}><td style="text-align:center">${++n}</td>${cols.map((c, j) => `<td${j === 0 && k === 'hatch' ? ' style="font-weight:bold"' : ''}>${e(r[c])}</td>`).join('')}</tr>`; });
  }
  page.innerHTML = h + '</table>';
  tree.innerHTML = '<div>⊟ ·· How to maintain runni</div>' + groups.map(g => `<div style="padding-left:14px">·· ${CL.esc(g)}</div>`).join('');
  label(v, 80, 26, 46, 14, '1 of 1+', '9px Tahoma,Verdana,Arial,sans-serif', '#000', 'center');
  label(v, 392, 26, 70, 14, 'Total:' + n, '9px Tahoma,Verdana,Arial,sans-serif', '#000', 'center');
  label(v, 462, 26, 40, 14, '100%', '9px Tahoma,Verdana,Arial,sans-serif', '#000', 'center');
  label(v, 512, 26, 80, 14, `${n} of ${n}`, '9px Tahoma,Verdana,Arial,sans-serif', '#000', 'center');
  hot(214, 21, 22, 22, v, () => window.print(), 'Print');
}
