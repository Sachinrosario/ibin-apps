<style>
@font-face{font-family:"VUI";src:local("Arial"),url(fonts/arimo-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:"VUI";src:local("Arial Bold"),url(fonts/arimo-latin-700-normal.woff2) format("woff2");font-weight:700}
@font-face{font-family:"VSerif";src:local("Times New Roman"),url(fonts/tinos-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:"VDeva";src:local("Nirmala UI"),local("Mangal"),url(fonts/noto-sans-devanagari-400.woff2) format("woff2");font-weight:400}
@font-face{font-family:"VDeva";src:local("Nirmala UI Bold"),url(fonts/noto-sans-devanagari-700.woff2) format("woff2");font-weight:700}

:root{--bg:#f6f0e3;--card:#fffaf0;--ink:#2a2118;--mute:#6b5d4d;--line:#dccfb8;--acc:#1f6b4a;--acc2:#154d35;--acc-ink:#fff;--mar:#7a1f2b;--hl:#fff1b8;--warn:#9a5b00;--chip:#efe5d0;
  --ui:"VUI",Arial,sans-serif;--ser:"VSerif",Georgia,"Times New Roman",serif;--deva:"VDeva","VKan","Nirmala UI",Mangal,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130f;--card:#201a14;--ink:#f1e8d8;--mute:#b3a58f;--line:#3a3025;--acc:#5fc08f;--acc2:#8ad9b0;--acc-ink:#0d1f16;--mar:#f0a0a8;--hl:#4a3f10;--warn:#e0a84a;--chip:#2c241b}}
:root[data-theme="dark"]{--bg:#17130f;--card:#201a14;--ink:#f1e8d8;--mute:#b3a58f;--line:#3a3025;--acc:#5fc08f;--acc2:#8ad9b0;--acc-ink:#0d1f16;--mar:#f0a0a8;--hl:#4a3f10;--warn:#e0a84a;--chip:#2c241b}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--ui)}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding:10px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font:700 20px/1 var(--ser);text-decoration:none!important}
.brand img{width:34px;height:34px;border-radius:8px}
.brand small{display:block;font:400 11px/1.2 var(--ui);color:var(--mute);letter-spacing:.04em}
.sbox{flex:1 1 280px;position:relative;min-width:200px}
.sbox input{width:100%;font:17px var(--ui);padding:11px 14px 11px 42px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.sbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:19px;height:19px;stroke:var(--mute);fill:none;stroke-width:2}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
nav.tabs a{padding:7px 14px;border-radius:999px;color:var(--mute);white-space:nowrap;font-size:15px}
nav.tabs a.on{background:var(--acc);color:var(--acc-ink);text-decoration:none}
main{padding:20px 0 70px;min-height:70vh}
h1,h2,h3{font-family:var(--ser);line-height:1.2;margin:0 0 .5em}
h1{font-size:30px}h2{font-size:23px;margin-top:1.5em}h3{font-size:18px}
.eyebrow{font:700 11.5px var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:0 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.tile{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--ink);text-decoration:none!important}
.tile:hover{border-color:var(--acc)}
.tile b{font:700 17px var(--ser);display:block}
.tile span{color:var(--mute);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:14px;color:var(--ink);text-decoration:none!important;display:inline-block}
a.chip:hover{border-color:var(--acc)}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.sa{font:400 22px/1.7 var(--deva);color:var(--mar)}
.verse-sa{font:400 24px/1.85 var(--deva);white-space:pre-wrap;color:var(--ink)}
.it{font-style:italic}
.latin{font-style:italic;font-family:var(--ser)}
.old{color:var(--mute);font-size:.8em;font-style:italic;font-family:var(--ser);font-weight:400}
.badge{display:inline-block;font:700 11px var(--ui);padding:2px 8px;border-radius:999px;background:var(--hl);color:var(--ink);border:1px solid var(--warn);vertical-align:middle;letter-spacing:.03em}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:10px;padding:9px 16px;font-weight:700;text-decoration:none!important;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.btn[disabled]{opacity:.4;cursor:default}
.res{display:block;padding:12px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none!important}
.res:hover{background:var(--card)}
.res .t{font:700 17px var(--ser)}.res .s{color:var(--mute);font-size:14px}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.kind{font:700 10.5px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin-right:8px}
table.t{border-collapse:collapse;width:100%;font-size:15px}
table.t th{text-align:left;font:700 12px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);border-bottom:2px solid var(--line);padding:6px 8px}
table.t td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.thumbs button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:4px;text-align:center}
.thumbs img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:7px;background:#fff;display:block}
.thumbs small{display:block;font-size:11.5px;line-height:1.25;color:var(--mute);margin-top:3px;overflow-wrap:anywhere}
.lb{position:fixed;inset:0;background:rgba(10,8,5,.92);z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px}
.lb img{max-width:100%;max-height:78vh;background:#fff;border-radius:6px}
.lb p{color:#eee;margin:10px 0 0;text-align:center;font-size:14px}
.lb .x,.lb .n{position:absolute;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:50%;width:46px;height:46px;font-size:24px}
.lb .x{top:12px;right:12px}.lb .n.p{left:10px;top:50%}.lb .n.nx{right:10px;top:50%}
.player{display:flex;align-items:center;gap:12px;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.player button{width:42px;height:42px;border-radius:50%;border:0;background:var(--acc);color:var(--acc-ink);font-size:18px;flex:none}
.player input[type=range]{flex:1;accent-color:var(--acc)}
.player select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px}
.pg{display:flex;justify-content:space-between;gap:10px;margin-top:24px}
.crumbs{font-size:14px;color:var(--mute);margin-bottom:10px}
.mapwrap{position:relative;max-width:460px}
.mapwrap svg{width:100%;height:auto;display:block}
.mapwrap path{stroke:var(--bg);stroke-width:.5;cursor:pointer}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:3px 8px;border-radius:6px;transform:translate(-50%,-130%);white-space:nowrap}
.empty{color:var(--mute);font-style:italic}
details.card summary{cursor:pointer;font-weight:700}
footer{border-top:1px solid var(--line);padding:18px 0 40px;color:var(--mute);font-size:13.5px}
@media (max-width:640px){h1{font-size:25px}.verse-sa{font-size:21px}}
@media print{header.top,footer,.pg,.player,.noprint{display:none!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="bar">
    <a class="brand" href="#/"><img src="img/ui/icon.png" alt=""><span>Vrikshayurveda<small>VERSION 3 · UPDATED 2026</small></span></a>

</div></header>
<main><div class="wrap" id="app"></div></main>
<footer><div class="wrap">Proprietary right holder – Dr. K.N. Ganeshaiah · Updated in 2026 by Dr. Sachin A. Rosario · Version <span id="ver"></span> · <a href="#/about">About, sources and names</a></div></footer>
<div id="lbHost"></div>

<script src="data/vrk3.js"></script>
<script src="data/map.js"></script>
<script>
"use strict";
const D = window.VRK3, MAPD = window.MAP_DATA;
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
$('#ver').textContent = D.version;
const BOOKS = D.books, SP = D.species, V = D.verses, SAN = D.sanskrit;
const BSHORT = ['Brihat Samhita', 'Krishi Parashara', 'Lokopakaram', 'Surapala Vrikshayurveda', 'Upavanavinoda'];
const BPRE = ['bs2-', 'kp-', 'lok-', 'sv-', 'uv-'];
const BABBR = { bs: 0, brihat: 0, bri: 0, kp: 1, krishi: 1, lok: 2, lokopakaram: 2, sv: 3, surapala: 3, sur: 3, uv: 4, upavanavinoda: 4, upa: 4 };
const BINFO = [
  'A classical Sanskrit text on astronomy and general science; its chapter on tree care (Vrikshayurveda) is one of the earliest on plant science.',
  'A text on agriculture and weather, with rules for sowing, tilling and harvest.',
  'A text on plant care and garden practice.',
  'A dedicated treatise of plant science: planting, soil, watering, disease and seed treatment.',
  'A treatise on garden making, with planting, watering, treating diseases and plant selection.'];
const verseIndex = new Map(V.map((v, i) => [v[0] + '/' + v[1], i]));
const vkey = (b, n) => b + '/' + n;
/* ---------- text helpers ---------- */
const fold = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const rom = s => fold(s).replace(/sh/g, 's').replace(/aa/g, 'a').replace(/ee/g, 'i').replace(/oo/g, 'u').replace(/[^a-z0-9ऀ-ॿಀ-೿ ]/g, ' ').replace(/\s+/g, ' ').trim();
const hl = (txt, toks) => { let s = esc(txt); for (const t of toks) { if (t.length < 2) continue; const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'); s = s.replace(re, (m, a, off, all) => /&[a-z#0-9]*$/i.test(all.slice(0, off)) ? m : '<mark>' + m + '</mark>'); } return s; };
const plural = (n, a, b) => n + ' ' + (n === 1 ? a : b);
/* ---------- media (pictures and recitations; on the web page they come from Version 1's folder when not bundled) ---------- */
const SHARED = '../vrikshayurveda/';
const imgSrc = (id, t) => `img/${t ? 't/' : ''}${id}.webp`;
document.addEventListener('error', e => { const el = e.target; if (el.tagName === 'IMG' && !el.dataset.fb && /^img\//.test(el.getAttribute('src') || '')) { el.dataset.fb = 1; el.src = SHARED + el.getAttribute('src'); } }, true);
/* ---------- indexes ---------- */
const sanByPlant = new Map(); SAN.forEach((s, i) => s.sp.forEach(p => { if (!sanByPlant.has(p)) sanByPlant.set(p, []); sanByPlant.get(p).push(i); }));
const verseByPlant = SP.map(() => []); V.forEach((v, i) => v[7].forEach(p => verseByPlant[p].push(i)));
const subjects = new Map(); V.forEach((v, i) => { const s = v[2] || ''; if (!s) return; if (!subjects.has(s)) subjects.set(s, []); subjects.get(s).push(i); });
const kwMap = new Map(); V.forEach((v, i) => v[3].forEach(k => { const f = fold(k); if (!kwMap.has(f)) kwMap.set(f, { k, v: [] }); kwMap.get(f).v.push(i); }));
const kwCat = new Map(D.keywords.map(k => [fold(k[0]), k[1]]));
const plantText = SP.map((s, i) => rom([s.n, s.sug, ...s.o, s.f, s.en, ...s.cn.map(c => c[1]), ...(sanByPlant.get(i) || []).flatMap(j => [SAN[j].t, SAN[j].en])].filter(Boolean).join(' ')));
const plantDeva = SP.map((s, i) => (sanByPlant.get(i) || []).map(j => SAN[j].d).join(' ') + ' ' + s.sa.join(' '));
const sanText = SAN.map(s => rom([s.t, s.en, s.ot].join(' ')));
const verseText = V.map(v => rom([BOOKS[v[0]], v[2], v[3].join(' '), v[5], v[6]].join(' ')));
const verseDeva = V.map(v => v[4]);
/* ---------- routing ---------- */
const TABS = [['#/', 'Home'], ['#/plants', 'Plants'], ['#/sanskrit', 'Sanskrit names'], ['#/books', 'Books and verses'], ['#/subjects', 'Subjects'], ['#/keywords', 'Keywords'], ['#/about', 'About']];
function drawTabs(h) { $('#tabs').innerHTML = TABS.map(([u, t]) => `<a href="${u}" class="${(u === '#/' ? h === '#/' || h === '' : h.startsWith(u) || (u === '#/books' && /^#\/(book|verse)/.test(h)) || (u === '#/plants' && h.startsWith('#/plant')) || (u === '#/subjects' && h.startsWith('#/subject')) || (u === '#/keywords' && h.startsWith('#/keyword'))) ? 'on' : ''}">${t}</a>`).join(''); }
function route() {
  stopAudio(); closeLb();
  const h = location.hash || '#/'; const p = h.slice(2).split('/').map(decodeURIComponent);
  drawTabs(h); let html = ''; if (p[0] !== 'search') $('#q').value = '';
  try {
    switch (p[0]) {
      case '': html = home(); break;
      case 'search': html = search(p.slice(1).join('/')); break;
      case 'plants': html = plantsPage(p[1]); break;
      case 'plant': html = plantPage(+p[1]); break;
      case 'sanskrit': html = sanskritPage(); break;
      case 'books': html = booksPage(); break;
      case 'book': html = bookPage(+p[1]); break;
      case 'verse': html = versePage(+p[1], +p[2]); break;
      case 'subjects': html = subjectsPage(); break;
      case 'subject': html = subjectPage(p.slice(1).join('/')); break;
      case 'keywords': html = keywordsPage(p[1]); break;
      case 'keyword': html = keywordPage(p.slice(1).join('/')); break;
      case 'about': html = aboutPage(); break;
      default: html = '<h1>Not found</h1><p><a href="#/">Go to the home page</a></p>';
    }
  } catch (e) { html = `<h1>Something went wrong</h1><p class="empty">${esc(e.message)}</p><p><a href="#/">Home</a></p>`; console.error(e); }
  $('#app').innerHTML = html; window.scrollTo(0, 0); bind(p[0]);
  document.title = ($('#app h1')?.textContent || 'Vrikshayurveda') + ' – Vrikshayurveda 3';
}
addEventListener('hashchange', route);
/* ---------- search ---------- */
let qt = 0;
$('#q').addEventListener('input', e => { clearTimeout(qt); const v = e.target.value.trim(); qt = setTimeout(() => { location.hash = v ? '#/search/' + encodeURIComponent(v) : '#/'; }, 220); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(qt); const v = e.target.value.trim(); location.hash = v ? '#/search/' + encodeURIComponent(v) : '#/'; } });
function search(q) {
  const raw = q.trim(); if ($('#q').value !== raw) $('#q').value = raw;
  const toks = rom(raw).split(' ').filter(Boolean); const deva = raw.match(/[ऀ-ॿ]+/g) || [];
  // "Surapala 12" / "sv 12" / "krishi parashara 40"
  let jump = '';
  const m = raw.toLowerCase().match(/^([a-z ]+?)\s*(?:verse|v|no\.?|#|:)?\s*(\d{1,3})$/);
  if (m) { const key = m[1].trim().split(' ')[0]; if (key in BABBR) { const b = BABBR[key], n = +m[2]; if (verseIndex.has(vkey(b, n))) jump = `<a class="res" href="#/verse/${b}/${n}"><span class="kind">Go to verse</span><span class="t">${esc(BOOKS[b])}, verse ${n}</span></a>`; } }
  if (!toks.length && !deva.length) return home();
  const all = (txt, dv) => toks.every(t => txt.includes(t)) && deva.every(d => dv.includes(d));
  const score = (txt, t0) => { let s = 0; for (const t of toks) { if (txt.startsWith(t)) s += 3; else if (txt.includes(' ' + t)) s += 2; else s += 1; } return s; };
  const pl = SP.map((s, i) => [i, plantText[i], plantDeva[i]]).filter(([i, t, d]) => all(t, d)).map(([i, t]) => [i, score(t) + (rom(SP[i].n).startsWith(toks[0] || '') ? 4 : 0) + (toks.every(t => rom(SP[i].en).split(' ').includes(t)) ? 6 : 0)]).sort((a, b) => b[1] - a[1]);
  const sn = SAN.map((s, i) => [i, sanText[i], s.d]).filter(([i, t, d]) => all(t, d)).slice(0, 60);
  const vv = V.map((v, i) => [i, verseText[i], verseDeva[i]]).filter(([i, t, d]) => all(t, d));
  const kw = [...kwMap.values()].filter(k => toks.every(t => rom(k.k).includes(t)) && !deva.length).slice(0, 12);
  const sb = [...subjects.keys()].filter(s => toks.every(t => rom(s).includes(t)) && !deva.length).slice(0, 12);
  const total = pl.length + sn.length + vv.length;
  const snip = i => { const v = V[i]; const src = v[5] || v[6] || ''; const idx = Math.max(0, fold(src).indexOf(toks[0] || '')); return esc(src.slice(Math.max(0, idx - 40), idx + 140)); };
  let h = `<h1>Search</h1><p class="empty">“${esc(raw)}” – ${plural(total, 'result', 'results')}</p>${jump}`;
  if (pl.length) h += `<h2>Plants (${pl.length})</h2>` + pl.slice(0, 40).map(([i]) => plantRow(i, toks)).join('') + (pl.length > 40 ? `<p class="empty">and ${pl.length - 40} more plants – make the search more specific.</p>` : '');
  if (sn.length) h += `<h2>Sanskrit plant names (${sn.length})</h2>` + sn.map(([i]) => sanRow(i, toks)).join('');
  if (kw.length || sb.length) h += `<h2>Subjects and keywords</h2><div class="chips">${sb.map(s => `<a class="chip" href="#/subject/${encodeURIComponent(s)}">${esc(s)}</a>`).join('')}${kw.map(k => `<a class="chip" href="#/keyword/${encodeURIComponent(k.k)}">${esc(k.k)} · ${k.v.length}</a>`).join('')}</div>`;
  if (vv.length) h += `<h2>Verses (${vv.length})</h2>` + vv.slice(0, 60).map(([i]) => verseRow(i, toks, snip(i))).join('') + (vv.length > 60 ? `<p class="empty">and ${vv.length - 60} more verses – make the search more specific.</p>` : '');
  if (!total && !kw.length && !sb.length && !jump) h += `<div class="card"><p>Nothing found. Try the common name (neem), the Sanskrit name in English letters (ariṣṭa or arishta), an old or new scientific name, or a subject (watering, seeds, soil).</p></div>`;
  return h;
}
const plantRow = (i, toks = []) => { const s = SP[i]; return `<a class="res" href="#/plant/${i}"><span class="kind">Plant</span><span class="t latin">${hl(s.n, toks)}</span>${s.o.length ? ` <span class="old">(${esc(s.o.join('; '))})</span>` : ''}<div class="s">${esc([s.f, s.en].filter(Boolean).join(' · '))}${s.v.length ? ' · ' + plural(s.v.length, 'verse', 'verses') : ''}</div></a>`; };
const sanRow = (i, toks = []) => { const s = SAN[i]; return `<a class="res" href="#/sanskrit/${i}" data-san="${i}"><span class="kind">Sanskrit name</span><span class="sa" style="font-size:20px">${esc(s.d)}</span> <b>${hl(s.t, toks)}</b><div class="s">${esc(s.en)}${s.sp.length ? ' · ' + s.sp.map(p => SP[p].n).join(', ') : ''} · ${plural(s.v.length, 'verse', 'verses')}</div></a>`; };
const verseRow = (i, toks = [], sn = '') => { const v = V[i]; return `<a class="res" href="#/verse/${v[0]}/${v[1]}"><span class="kind">Verse</span><span class="t">${esc(BOOKS[v[0]])} · ${v[1]}</span>${v[2] ? ` <span class="s">– ${hl(v[2], toks)}</span>` : ''}<div class="s">${hl(sn || (v[5] || '').slice(0, 160), toks)}</div></a>`; };
/* ---------- home ---------- */
function home() {
  const withText = V.filter(v => v[5] || v[4]).length;

    seek.oninput = () => { if (audio.duration) audio.currentTime = seek.value / 1000 * audio.duration; };
    $('#rate').onchange = () => audio.playbackRate = +$('#rate').value;
    $('#cite').onclick = () => { const t = `${BOOKS[v[0]]}, verse ${v[1]}. Vrikshayurveda 3 (IBIN Apps), ${location.href.split('#')[0]}#/verse/${v[0]}/${v[1]}`; (navigator.clipboard?.writeText(t) || Promise.reject()).then(() => { $('#cite').textContent = 'Copied'; setTimeout(() => $('#cite').textContent = 'Copy citation', 1500); }).catch(() => prompt('Copy this citation', t)); };
  }
  if (kind === 'plant') {
    const th = $('#thumbs'); if (th) { drawThumbs(th, th.dataset.c); $$('#catChips [data-cat]').forEach(b => b.onclick = () => { $$('#catChips .chip').forEach(x => x.classList.toggle('on', x === b)); drawThumbs(th, b.dataset.cat); }); }
    $$('.mapwrap path').forEach(p => { p.onclick = () => { const d = $(`details[data-st="${p.dataset.n}"]`); if (d) { d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'center' }); } }; });
  }
}
const CAPT = { H: 'Herbarium sheet', L: 'Line diagram', P: 'Painting', F: 'Photograph' };
function drawThumbs(th, c) {
  const s = SP[+th.dataset.p]; const list = s.im[c]; th.dataset.c = c;
  th.innerHTML = list.map((im, k) => `<button type="button" data-k="${k}" aria-label="Open picture ${k + 1}">${im[4] ? `<img loading="lazy" src="${imgSrc(im[0], 1)}" alt="">` : `<div style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:12px">not available</div>`}<small>${esc(im[1] ? im[1] + ' · ' : '')}${esc(im[2].replace(s.o[0] || s.n, '').replace(/^[_ ]+/, '') || CAPT[c])}</small></button>`).join('');
  th.onclick = e => { const b = e.target.closest('button[data-k]'); if (b) openLb(s, c, +b.dataset.k); };
}
let lbState = null;
function openLb(s, c, k) {
  const list = s.im[c].filter(x => x[4]); const cur = s.im[c][k]; let j = list.indexOf(cur); if (j < 0) return; lbState = { s, c, list, j };
  drawLb();
}
function drawLb() {
  const { s, c, list, j } = lbState, im = list[j];
  $('#lbHost').innerHTML = `<div class="lb" role="dialog" aria-modal="true" aria-label="Picture"><button class="x" aria-label="Close">✕</button>${list.length > 1 ? '<button class="n p" aria-label="Previous">‹</button><button class="n nx" aria-label="Next">›</button>' : ''}<img src="${imgSrc(im[0])}" alt="${esc(s.n)}"><p><i>${esc(s.n)}</i> – ${CAPT[c]}${im[1] ? ' · ' + esc(im[1]) : ''}${im[3] ? ' · WesternGhat Team' : ''} · ${j + 1} of ${list.length}</p></div>`;
  const h = $('#lbHost'); $('.x', h).onclick = closeLb; if ($('.p', h)) { $('.p', h).onclick = () => { lbState.j = (j + list.length - 1) % list.length; drawLb(); }; $('.nx', h).onclick = () => { lbState.j = (j + 1) % list.length; drawLb(); }; }
  $('.lb', h).onclick = e => { if (e.target.classList.contains('lb')) closeLb(); };
}
function closeLb() { $('#lbHost').innerHTML = ''; lbState = null; }
addEventListener('keydown', e => { if (!lbState) return; if (e.key === 'Escape') closeLb(); else if (e.key === 'ArrowRight') $('#lbHost .nx')?.click(); else if (e.key === 'ArrowLeft') $('#lbHost .p')?.click(); });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
route();
</script>
