<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sahyadri Pathanga</title>

<style>
/* Sahyadri Pathanga (Butterflies of Western Ghats) - Version 1, faithful web rebuild.
   The screens and pictures are the original program's own; its lists, counts, maps and tables are filled from the original database. */
:root{--arial:Arial,"Liberation Sans",Helvetica,sans-serif}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:var(--arial)}
#stage{position:absolute;width:1024px;height:768px;transform-origin:0 0;overflow:hidden;user-select:none;-webkit-user-select:none;background:#007f00}
#stage img{-webkit-user-drag:none}
.scr{position:absolute;inset:0;display:none;background-repeat:no-repeat}
.scr.on{display:block}
.abs{position:absolute}
.hot{position:absolute;cursor:pointer}
.lb{position:absolute;border:2px solid #808080;border-right-color:#fff;border-bottom-color:#fff;background:#fff;font:12px/15px var(--arial);color:#0000a0;padding:0;margin:0;outline:none;box-sizing:border-box;overflow-y:auto;overflow-x:hidden;cursor:default}
.lb .row{position:absolute;left:0;right:0;height:15px;padding:0 2px;white-space:nowrap;overflow:hidden}
.lb .row.sel{background:#000080;color:#fff}
.lb.it .row{font-style:italic}
.pt{position:absolute;font:12px var(--arial);color:#0000a0;text-align:center}
.pb{position:absolute;font:11px var(--arial);text-align:center;line-height:19px;color:#808080;cursor:default}
.pb.on{color:#000;cursor:pointer}
.sel1{position:absolute;font:12px var(--arial);height:22px;box-sizing:border-box;border:2px inset #fff;background:#fff;color:#00007a}
.cmb{position:absolute;box-sizing:border-box;font:12px var(--arial);cursor:pointer}
.tb{position:absolute;font:bold 12px var(--arial);color:#ffff00;text-align:right}
.gbtn{position:absolute;font:bold 12px var(--arial);background:#d4d0c8;border:2px outset #fff;text-align:center;cursor:pointer;box-sizing:border-box}
.gbtn.dis{color:#808080;cursor:default;font-weight:bold}
#busy{position:absolute;inset:0;display:none;z-index:900;cursor:wait}
#busy div{position:absolute;left:412px;top:360px;width:200px;padding:10px;background:#ffffe1;border:1px solid #000;font:12px var(--arial);text-align:center}
#quit{position:fixed;inset:0;z-index:100000;background:#000;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;font:20px var(--arial)}
.bar{position:absolute;left:0;height:19px;background:linear-gradient(90deg,#0a246a,#a6caf0);color:#fff;font:bold 11px/19px var(--arial);padding-left:3px;box-sizing:border-box}
.dtitle{position:absolute;left:100px;top:19px;width:640px;text-align:center;font:19px var(--arial);color:#1a1ac8;white-space:nowrap}
table.dd{border-collapse:collapse;table-layout:fixed;font:11px var(--arial);color:#000}
table.dd th{background:#000080;color:#fff;text-align:left;height:33px;padding:0 3px;font-weight:bold;border:1px solid #808080}
table.dd td{border:1px solid #808080;padding:0 3px;vertical-align:middle;height:32px}
table.dd td.a{background:#c0c0c0}table.dd td.w{background:#fff}
.tree{position:absolute;background:#fff;border:2px inset #fff;overflow:auto;font:italic bold 15px var(--arial)}
.tree div{white-space:nowrap;height:31px;line-height:31px}
.sr div{white-space:nowrap;height:21px;line-height:21px;font:bold 11px/21px var(--arial);color:#000}
</style>
<style id="phonefix">html,body{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;margin:0}</style>
</head>
<body>
<div id="stage">
  <div class="scr on" id="open" style="background-image:url(img/ui/open.jpg)">
    <div class="abs" style="left:150px;top:520px;width:790px;text-align:center;font:bold 14px/20px var(--arial);color:#fff">
      <div>Proprietary right holder - Dr. K.N. Ganeshaiah</div><div>Updated in 2026 by Dr. Sachin A. Rosario &middot; <span id="ver"></span></div></div>
    <div class="hot" style="left:845px;top:590px;width:110px;height:28px" id="bTeam" title="Team"></div>
    <div class="hot" style="left:845px;top:635px;width:110px;height:34px" onclick="go('mods')" title="Data"></div>

  </div>
  <div class="scr" id="mods" style="background-image:url(img/ui/modules.jpg)">
    <div class="hot" style="left:212px;top:215px;width:120px;height:120px" onclick="openPolitical()" title="Political Boundary"></div>
    <div class="hot" style="left:437px;top:215px;width:120px;height:120px" onclick="openVeg()" title="Vegetation"></div>
    <div class="hot" style="left:677px;top:215px;width:120px;height:120px" onclick="openGrid()" title="Gridwise"></div>
    <div class="hot" style="left:212px;top:460px;width:120px;height:120px" onclick="openThem()" title="Thematic Maps"></div>
    <div class="hot" style="left:437px;top:460px;width:120px;height:120px" onclick="openImgs()" title="Images"></div>
    <div class="hot" style="left:677px;top:445px;width:120px;height:30px" onclick="openText()" title="Common Name Search"></div>
    <div class="hot" style="left:677px;top:482px;width:120px;height:28px" onclick="openText()" title="Talukwise Search"></div>
    <div class="hot" style="left:677px;top:518px;width:120px;height:28px" onclick="openText()" title="Scientific Name Search"></div>
    <div class="hot" style="left:677px;top:555px;width:120px;height:30px" onclick="openText()" title="Host Plant Search"></div>
    <div class="hot" style="left:122px;top:622px;width:40px;height:30px" onclick="go('open')" title="Back"></div>
  </div>
  <div class="scr" id="pol" style="background-image:url(img/ui/pol.jpg)">
    <img class="abs" id="polHi" alt="" style="left:0;top:2px;width:517px;height:776px;pointer-events:none;display:none">
    <div class="hot" id="polMap" style="left:0;top:0;width:512px;height:745px;cursor:crosshair"></div>
  </div>
  <div class="scr" id="veg" style="background-image:url(img/ui/veg.jpg)"></div>
  <div class="scr" id="grid" style="background-image:url(img/ui/grid.jpg)"></div>
  <div class="scr" id="them" style="background-image:url(img/ui/them.jpg)"></div>
  <div class="scr" id="imgs" style="background-image:url(img/ui/imgs.jpg)"></div>
  <div class="scr" id="txt" style="background-image:url(img/ui/text.jpg)"></div>
  <div class="scr" id="det" style="background:#d4d0c8">
    <div id="dBody" class="abs" style="left:0;top:75px;width:1024px;height:693px;overflow:hidden"></div>
    <div id="dTop" class="abs" style="left:0;top:0;width:1024px;height:76px;background-repeat:no-repeat"></div>
    <div class="dtitle" id="dTitle"></div>
    <div class="hot" style="left:978px;top:18px;width:46px;height:28px" onclick="detBack()" title="Back"></div>
    <div id="dTabs"></div>
  </div>
  <div id="busy"><div>Please wait&hellip;</div></div>
</div>
<div id="quit"><div>Sahyadri Pathanga is closed. You can close this window.</div><div class="gbtn" style="position:static;padding:4px 16px" onclick="location.reload()">Open it again</div></div>
<script>
'use strict';
const VERSION = '1.0.0';
const REMOTE = 'https://sachinrosario.github.io/ibin-apps/sahyadri-pathanga/';
const SW = 1024, SH = 768, stage = document.getElementById('stage');
const $ = id => document.getElementById(id);
function fit() { const s = Math.min(innerWidth / SW, innerHeight / SH); stage.style.transform = `scale(${s})`; stage.style.left = Math.max(0, (innerWidth - SW * s) / 2) + 'px'; stage.style.top = Math.max(0, (innerHeight - SH * s) / 2) + 'px'; }
addEventListener('resize', fit); fit();
$('ver').textContent = 'Version ' + VERSION;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'})[c]);
const el = (tag, attrs, html) => { const e = document.createElement(tag); if (attrs) for (const k in attrs) { if (k === 'style') Object.assign(e.style, attrs.style); else if (k.startsWith('on')) e[k] = attrs[k]; else e.setAttribute(k, attrs[k]); } if (html != null) e.innerHTML = html; return e; };
const pos = (e, l, t, w, h) => { e.style.left = l + 'px'; e.style.top = t + 'px'; if (w != null) e.style.width = w + 'px'; if (h != null) e.style.height = h + 'px'; return e; };
function busy(on) { $('busy').style.display = on ? 'block' : 'none'; }
let CUR = 'open';
function go(id) { document.querySelectorAll('.scr').forEach(s => s.classList.toggle('on', s.id === id)); CUR = id; }
function quitApp() { try { window.close(); } catch (e) {} setTimeout(() => { $('quit').style.display = 'flex'; }, 250); }
const say = m => { try { alert(m); } catch (e) {} };

// ---------- data: a file in this folder first, the IBIN Apps web copy when it is not there (small installers) ----------
const loaded = {};
const WEBCOPY = /github\.io$/.test(location.hostname) && !new URL('.', location.href).href.startsWith(REMOTE);
function loadJs(rel) {
  if (loaded[rel]) return loaded[rel];
  return loaded[rel] = new Promise((ok, bad) => {
    const s = document.createElement('script'); s.src = rel; s.onload = () => ok();
    s.onerror = () => { s.remove(); const r = document.createElement('script'); r.src = REMOTE + rel; r.onload = () => ok(); r.onerror = () => { delete loaded[rel]; bad(new Error(rel)); }; document.head.appendChild(r); };
    document.head.appendChild(s);
  });
}
function photo(img, file, dir) { const d = (dir || 'img/photos/'); img.onerror = () => { img.onerror = null; img.src = REMOTE + d + encodeURIComponent(file); }; img.src = d + encodeURIComponent(file); }
let READY = null;
function ensureData() { return READY || (READY = Promise.all([loadJs('data/core.js'), loadJs('data/grid.js'), loadJs('data/maps.js')]).then(initData)); }

// ---------- indexes ----------
let BYID, SPN, CMN, GRSP;
const unpack = s => { const o = []; let p = 0; if (s) for (const d of s.split('.')) { p += parseInt(d, 16); o.push(p); } return o; };
const SN = id => { const r = BYID.get(+id); return r[2] + ' ' + r[3]; };
const STN = { Gujarat: 'Gujarat', Karnataka: 'Karnataka', Kerala: 'Kerala', Goa: 'Goa', Maharastra: 'Maharastra', Tamilnadu: 'Tamilnadu', 'Dadra & Nagarhaveli': 'Dadra & Nagarhaveli' };
const POLNAME = { gujarat: 'Gujarat', maharashtra: 'Maharashtra', karnataka: 'Karnataka', kerala: 'Kerala', goa: 'Goa', 'tamil nadu': 'Tamil Nadu' };
function initData() {
  BYID = new Map(); for (const r of SB.sp) BYID.set(r[0], r);
  CMN = {}; for (const [id, v] of Object.entries(SB.cm)) for (const [lang, nm] of v) { ((CMN[lang] = CMN[lang] || {})[nm] = CMN[lang][nm] || []).push(+id); }
  GRSP = new Map(); for (const [id, s] of Object.entries(SBG.sp)) for (const gi of unpack(s)) { if (!GRSP.has(gi)) GRSP.set(gi, []); GRSP.get(gi).push(+id); }
}
const srt = a => a.sort((x, y) => x.toLowerCase() < y.toLowerCase() ? -1 : x.toLowerCase() > y.toLowerCase() ? 1 : 0);
// a set of butterflies shown in the three lists: species ids
function makeSet(ids) {
  const fam = new Set(), gen = new Map(), sp = new Map();
  for (const i of new Set(ids)) { const r = BYID.get(+i); if (!r) continue; fam.add(r[1].toUpperCase()); if (!gen.has(r[2])) gen.set(r[2], r[1].toUpperCase()); sp.set(r[2] + ' ' + r[3], [r[0], r[1].toUpperCase(), r[2]]); }
  return { ids: [...new Set(ids)], fams: srt([...fam]), gens: srt([...gen.keys()]).map(g => [g, gen.get(g)]), sps: srt([...sp.keys()]).map(k => [k, ...sp.get(k)]) };
}
const ALL = () => makeSet(SB.sp.map(r => r[0]));
const stateIds = st => unpack(SB.st[st]);

// ---------- list boxes and the four-list panel ----------
function listBox(italic) {
  const box = el('div', { class: 'lb' + (italic ? ' it' : ''), tabindex: 0 }), sp = el('div', { style: { position: 'relative', width: '1px' } }); box.append(sp);
  let items = [], sel = -1; const RH = 15;
  const draw = () => { const a = Math.max(0, Math.floor(box.scrollTop / RH) - 2), b = Math.min(items.length, a + Math.ceil((box.clientHeight || 200) / RH) + 5);
    let h = ''; for (let i = a; i < b; i++) h += `<div class="row${i === sel ? ' sel' : ''}" data-i="${i}" style="top:${i * RH}px">${esc(items[i])}</div>`;
    sp.style.height = items.length * RH + 'px'; sp.style.width = '100%'; sp.innerHTML = h; };
  const pick = (i, tell) => { if (i < 0 || i >= items.length) return; sel = i; const t = i * RH; if (t < box.scrollTop) box.scrollTop = t; else if (t + RH > box.scrollTop + box.clientHeight) box.scrollTop = t + RH - box.clientHeight; draw(); if (tell && box.onchange) box.onchange(); };
  box.addEventListener('scroll', draw);
  box.addEventListener('click', e => { const r = e.target.closest('.row'); if (r) pick(+r.dataset.i, true); });
  box.addEventListener('dblclick', e => { if (e.target.closest('.row') && box.ondblclick) box.ondblclick(); });
  box.addEventListener('keydown', e => { const k = { ArrowDown: 1, ArrowUp: -1, PageDown: 10, PageUp: -10 }[e.key]; if (k) { e.preventDefault(); pick(Math.max(0, Math.min(items.length - 1, (sel < 0 ? 0 : sel + k))), true); } });
  box.setItems = a => { items = a.slice(); sel = -1; box.scrollTop = 0; draw(); };
  box.select = v => { const i = items.findIndex(x => String(x).toLowerCase() === String(v).toLowerCase()); if (i >= 0) pick(i, true); return i; };
  Object.defineProperty(box, 'value', { get: () => sel >= 0 ? items[sel] : '' });
  Object.defineProperty(box, 'items', { get: () => items });
  return box;
}
let CTX = 'Western Ghats';          // the region named in the inventory window's title
function panel(host) {
  const x = 521, y = 10, P = { set: null };
  P.img = pos(el('img', { class: 'abs', src: 'img/ui/panel.png', alt: '' }), x, y);
  P.title = pos(el('div', { class: 'pt' }), 531, 22, 480, 17);
  const C = l => pos(el('div', { class: 'pt', style: { color: '#000' } }), l, 70, 160, 18);
  P.cf = C(524); P.cg = C(689); P.cs = C(854);
  P.lf = pos(listBox(false), 525, 107, 160, 198); P.lg = pos(listBox(true), 690, 107, 160, 198); P.ls = pos(listBox(true), 855, 107, 160, 198);
  P.cm = pos(el('div', { class: 'pt', style: { color: '#0000a0', textAlign: 'left' } }), 825, 316, 184, 20);
  const BT = (l, t, w, h, label, f) => { const b = pos(el('div', { class: 'pb', onclick: () => b.classList.contains('on') && f() }, label), l, t, w, h); return b; };
  P.bf = BT(530, 347, 156, 19, '<u>F</u>amily&nbsp; Search', () => detail('F', P.lf.value));
  P.bg = BT(695, 347, 158, 19, '<u>G</u>enus&nbsp; Search', () => detail('G', P.lg.value));
  P.bs = BT(859, 347, 160, 19, '<u>S</u>pecies&nbsp; Search', () => P.ls.sel && detail('S', P.ls.sel[1]));
  P.br = BT(715, 376, 113, 23, '<u>R</u>efresh', () => P.show(P.set, P.title.textContent));
  P.els = [P.img, P.title, P.cf, P.cg, P.cs, P.lf, P.lg, P.ls, P.cm, P.bf, P.bg, P.bs, P.br];
  P.els.forEach(e => host.append(e));
  const flags = () => { P.bf.classList.toggle('on', !!P.lf.value); P.bg.classList.toggle('on', !!P.lg.value); P.bs.classList.toggle('on', !!P.ls.value); P.br.classList.toggle('on', !!(P.lf.value || P.lg.value || P.ls.value)); };
  P.lf.onchange = () => { P.set.gensF = P.set.gens.filter(g => g[1] === P.lf.value).map(g => g[0]); P.lg.setItems(P.set.gensF); P.ls.setItems(P.set.sps.filter(s => s[2] === P.lf.value).map(s => s[0] === 0 ? '' : s[0])); P.ls.sel = null; P.cm.textContent = ''; flags(); };
  P.lg.onchange = () => { P.ls.setItems(P.set.sps.filter(s => s[3] === P.lg.value).map(s => s[0])); P.ls.sel = null; P.cm.textContent = ''; flags(); };
  P.ls.onchange = () => { P.ls.sel = P.set.sps.find(s => s[0] === P.ls.value); const cn = ((SB.cm[P.ls.sel[1]] || []).find(c => c[0] === 'English') || (SB.cm[P.ls.sel[1]] || [])[0] || [])[1]; P.cm.textContent = cn || ''; flags(); };
  P.lf.ondblclick = () => detail('F', P.lf.value);
  P.lg.ondblclick = () => detail('G', P.lg.value);
  P.ls.ondblclick = () => P.ls.sel && detail('S', P.ls.sel[1]);
  P.show = (set, title) => {
    P.set = set; P.title.textContent = title || '';
    P.cf.textContent = set.fams.length; P.cg.textContent = set.gens.length; P.cs.textContent = set.sps.length;
    P.els.forEach(e => e.style.display = '');
    P.lf.setItems(set.fams); P.lg.setItems(set.gens.map(g => g[0])); P.ls.setItems(set.sps.map(s => s[0])); P.ls.sel = null; P.cm.textContent = '';
    P.els.forEach(e => e.style.display = ''); flags();
  };
  P.hide = () => { P.set = null; P.els.forEach(e => e.style.display = 'none'); };
  P.hide();
  return P;
}
function homeExit(host) {
  host.append(pos(el('div', { class: 'hot', onclick: () => go('mods'), title: 'Home' }), 876, 676, 48, 48));
  host.append(pos(el('div', { class: 'hot', onclick: quitApp, title: 'Exit' }), 930, 676, 48, 48));
}
const built = {};
async function prep(id, fn) { busy(true); try { await ensureData(); if (!built[id]) { built[id] = fn(); } return built[id]; } catch (e) { say('The data could not be loaded. Please check the internet connection and try again.'); throw e; } finally { busy(false); } }
$('bTeam').onclick = () => {};

// ---------- Political boundary ----------
const POLLAB = [['gujarat', 'Gujarat', 150, 90, 70, 22], ['maharashtra', 'Maharastra', 260, 190, 90, 22], ['karnataka', 'Karnataka', 290, 427, 80, 22], ['goa', 'Goa', 222, 427, 40, 22], ['kerala', 'Kerala', 275, 595, 70, 22], ['tamilnadu', 'Tamilnadu', 365, 595, 80, 22]];
let POL;
async function openPolitical() {
  const P = await prep('pol', () => { const h = $('pol'), p = panel(h); homeExit(h);
    for (const [k, st, l, t, w, hh] of POLLAB) h.append(pos(el('div', { class: 'hot', title: st, onclick: () => polPick(k, st) }), l, t, w, hh));
    $('polMap').ondblclick = () => polPick('wg', null);
    return p; });
  go('pol'); $('polHi').style.display = 'none'; P.hide(); CTX = 'Western Ghats';
}
function polPick(k, st) {
  const P = built.pol; const hi = $('polHi'); hi.src = `img/ui/pol_${k}.png`; hi.style.display = '';
  CTX = st ? (st === 'Maharastra' ? 'Maharashtra' : st === 'Tamilnadu' ? 'Tamil Nadu' : st) : 'Western Ghats'; CTX_STATE = st;
  P.show(makeSet(st ? stateIds(st) : SB.sp.map(r => r[0])), 'Butterfly Richness of Western Ghats' + (st ? ' in ' + CTX : ''));
}
let CTX_STATE = null;

// ---------- Vegetation ----------
const VEGB = [['DRY DECIDUIOUS', 514, 463], ['HIGH ELEVATION EVERGREEN', 643, 458], ['MID ELEVATION EVERGREEN', 777, 462], ['DRY EVERGREEN', 514, 501], ['HIGH ELEVATION PLANTATION', 643, 497], ['SCRUB', 777, 509], ['LOW ELEVATION PLANTATION', 514, 533], ['LOW ELEVATION EVERGREEN', 643, 534], ['SHOLA', 777, 548], ['HIGH ELEVATION ARABLE', 514, 571], ['MOIST DECIDUIOUS', 643, 579]];
const nice = s => s.toLowerCase().replace('deciduious', 'deciduous').replace(/\b\w/g, c => c.toUpperCase());
async function openVeg() {
  await prep('veg', () => { const h = $('veg'), p = panel(h); homeExit(h);
    for (const [k, l, t] of VEGB) h.append(pos(el('div', { class: 'hot', title: nice(k), onclick: () => p.show(makeSet(unpack(SB.hab[k])), nice(k) + ' regions in Western ghats') }), Math.round(l * 1.0235) - 4, Math.round(t * 1.0235) - 14, 125, 30));
    return p; });
  go('veg'); built.veg.hide(); CTX = 'Western Ghats'; CTX_STATE = null;
}

// ---------- Gridwise ----------
let GRIDSEL = -1;
async function openGrid() {
  const G = await prep('grid', () => { const h = $('grid'), p = panel(h); homeExit(h);
    const box = pos(el('div', { class: 'abs', style: { overflow: 'scroll', background: '#fff' } }), 0, 0, 516, 768); h.append(box);
    const img = el('img', { src: 'img/ui/gridmap.png', alt: '', style: { display: 'block', position: 'relative' } }); box.append(img);
    const mark = el('div', { style: { position: 'absolute', background: '#ff00ff', opacity: '.9', pointerEvents: 'none', display: 'none' } }); box.append(mark);
    // the Longitude / Latitude box
    const cover = pos(el('div', { class: 'abs', style: { background: '#d4d0c8' } }), 527, 415, 215, 84); h.append(cover);
    h.append(pos(el('div', { class: 'abs', style: { font: '12px var(--arial)', color: '#0000a0', textDecoration: 'underline' } }, 'Enter Longitude &amp; Latitude'), 530, 417, 200, 16));
    h.append(pos(el('div', { class: 'abs', style: { font: '12px var(--arial)', color: '#000' } }, 'Longitude:'), 535, 437, 70, 16), pos(el('div', { class: 'abs', style: { font: '12px var(--arial)', color: '#000' } }, 'Latitude:'), 535, 461, 70, 16));

    top.querySelectorAll('.hot').forEach(x => x.remove()); rad(36, 'Political Zone', 'pol'); rad(194, 'Political,habitat and Biotic Zone', 'hab');
    body.innerHTML = '';
    const photoEl = pos(el('img', { class: 'abs', src: 'img/ui/dist_bg.jpg', alt: '' }), 646, 0, 378, 629); body.append(photoEl);
    const box = pos(el('div', { class: 'abs', style: { overflow: 'auto', background: '#fff', border: '1px solid #808080' } }), 12, 8, 630, 590); body.append(box);
    let h = '';
    if (mode === 'pol') {
      const rows = new Map();
      for (const id of D.ids) for (const [s, d, t] of (SB.sd[id] || [])) { const a = rows.get(s) || new Map(); const b = a.get(d) || new Set(); b.add(t); a.set(d, b); rows.set(s, a); }
      h = '<table class="dd" style="width:612px"><colgroup><col width="204"><col width="204"><col width="204"></colgroup><tr><th>State</th><th>District</th><th>Taluk</th></tr>';
      for (const s of [...rows.keys()].sort()) { const ds = rows.get(s); let first = true; const n = [...ds.values()].reduce((a, b) => a + b.size, 0);
        for (const d of [...ds.keys()].sort()) { let fd = true; for (const t of [...ds.get(d)].sort()) { h += '<tr>' + (first ? `<td class="a" rowspan="${n}">${esc(s)}</td>` : '') + (fd ? `<td class="w" rowspan="${ds.get(d).size}">${esc(d)}</td>` : '') + `<td class="a">${esc(t)}</td></tr>`; first = false; fd = false; } } }
      h += '</table>';
    } else {
      const rows = []; for (const id of D.ids) for (const [z, hb] of (SB.shab[id] || [])) rows.push([z, nice(hb), D.kind === 'S' ? '' : SN(id)]);
      const uniq = [...new Map(rows.map(r => [r.join('|'), r])).values()].sort();
      h = '<table class="dd" style="width:612px"><colgroup><col width="204"><col width="204"><col width="204"></colgroup><tr><th>Biotic Zone</th><th>Habitat</th><th>' + (D.kind === 'S' ? '' : 'Species') + '</th></tr>' + uniq.map(r => `<tr><td class="a">${esc(nice(r[0]))}</td><td class="w">${esc(r[1])}</td><td class="a">${esc(r[2])}</td></tr>`).join('') + '</table>';
    }
    box.innerHTML = h;
  };
  draw();
}
// ---- synonyms ----
function tabSyn(B, D) {
  bar(B, 'Synonyms', 2);
  B.append(pos(el('img', { class: 'abs', src: 'img/ui/syn_bg.jpg', alt: '' }), 556, 30, 468, 663));
  const t = pos(el('div', { class: 'tree' }), 18, 30, 530, 348); B.append(t);
  let h = `<div style="padding-left:34px"><span style="background:#0a246a;color:#fff;padding:3px 3px">Synonyms for ' ${esc(D.name)} '</span></div>`;
  const syn = SB.syn[D.key] || [];
  for (const [g, s, fl] of syn) { h += `<div style="padding-left:75px;color:#e01010">${esc(g + ' ' + s)}</div><div style="padding-left:112px;color:#008000">Source for the Synonym</div>`;
    for (const f of fl) { const r = SB.fl[f] || []; h += `<div style="padding-left:150px;color:#1010e0">${esc(r[0] || '')}${r[2] ? ' ; ' + esc(r[2]) : ''}</div>`; } }
  if (!syn.length) h += '<div style="padding-left:75px;color:#555;font-weight:normal">No synonyms</div>';
  t.innerHTML = h;
}
function tabCm(B, D) {
  B.style.background = 'url(img/ui/cm_bg.jpg) 0 0/1024px 693px';
  const cn = D.ids.flatMap(id => (SB.cm[id] || []).map(c => [c[0], c[1]]));
  const rows = [...new Map(cn.map(c => [c.join('|'), c])).values()];
  const w = pos(el('div', { class: 'abs', style: { background: '#d4d0c8', border: '2px outset #fff', boxSizing: 'border-box', padding: '0' } }), 345, 468, 356, 26 + 20 * Math.min(rows.length + 1, 14) + 12);
  w.innerHTML = `<div class="bar" style="top:0;width:100%;height:16px;line-height:16px">Common Name</div><div style="position:absolute;left:3px;top:19px;width:344px;max-height:${20 * 13 + 20}px;overflow:auto;background:#fff;border:1px solid #808080"><table style="border-collapse:collapse;font:bold 15px var(--arial);width:100%"><tr style="background:#000080;color:#fff"><td style="width:50%;padding:0 3px;border:1px solid #808080">LANGUAGE</td><td style="padding:0 3px;border:1px solid #808080">NAME</td></tr>${rows.map(r => `<tr style="font-weight:normal;font-size:14px"><td style="padding:0 3px;border:1px solid #808080">${esc(r[0])}</td><td style="padding:0 3px;border:1px solid #808080">${esc(r[1])}</td></tr>`).join('')}</table></div>`;
  B.append(w);
  if (!rows.length) w.querySelector('table').insertAdjacentHTML('beforeend', '<tr><td colspan="2" style="font-weight:normal;font-size:13px;padding:2px 3px">No common names</td></tr>');
}
function tabSrc(B, D) {
  B.style.background = '#fff';
  const fl = [...new Set(D.ids.flatMap(id => SB.src[id] || []))];
  const hdr = pos(el('div', { class: 'abs', style: { font: 'bold 10px/16px var(--arial)', color: '#000', background: '#d4d0c8', paddingLeft: '4px' } }, 'Checklist; Journal name; Author; Year Of Publication Respectively'), 0, 0, 1024, 16); B.append(hdr);
  const lbl = D.kind === 'S' ? `the species '${D.name}'` : D.kind === 'G' ? `the genus '${D.name}'` : `the family '${D.name.toUpperCase()}'`;
  const box = pos(el('div', { class: 'abs sr', style: { overflow: 'auto', background: '#fff' } }), 0, 17, 1024, 676); B.append(box);
  box.innerHTML = `<div style="background:#000080;color:#fff;margin:2px 22px 4px 22px;display:inline-block;padding:0 4px;font:bold 11px/16px var(--arial)">Source of information for ${esc(lbl)} in entire Western Ghats ( ${fl.length} )</div>` +
    fl.map(f => { const r = SB.fl[f] || []; return `<div style="padding-left:34px;position:relative"><span style="position:absolute;left:12px;top:3px;width:12px;height:15px;border:1px solid #444;background:#fff;box-sizing:border-box"></span>${esc([r[0], r[1], r[2], r[3]].filter(x => x != null).join(' ; '))}</div>`; }).join('');
}
