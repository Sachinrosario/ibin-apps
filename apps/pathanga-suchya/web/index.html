<!-- ======================= Form1 : opening page (html\location.htm) ======================= -->

<script>
"use strict";
const K = window.KIT_DATA;
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, kids = []) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'text') e.textContent = v;
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of [].concat(kids)) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
};
const px = n => n + 'px';
const pos = (e, x, y, w, h) => { Object.assign(e.style, { left: px(x), top: px(y) }); if (w != null) e.style.width = px(w); if (h != null) e.style.height = px(h); return e; };
// Jet sorts text case-insensitively and ignores hyphens ("word sort")
const jetCmp = (a, b) => a.localeCompare(b, 'en', { sensitivity: 'base', ignorePunctuation: true });

/* ---------------- stage scaling ---------------- */
const stage = $('#stage');
function fit() {
  const s = Math.min(innerWidth / 1440, innerHeight / 900);
  stage.style.transform = `scale(${s})`;
  stage.style.left = Math.max(0, (innerWidth - 1440 * s) / 2) + 'px';
  stage.style.top = Math.max(0, (innerHeight - 900 * s) / 2) + 'px';
}
addEventListener('resize', fit); fit();

/* ---------------- window manager ---------------- */
const W = {};               // open windows by id
let zTop = 10;
function openWin(id, { title, icon, x, y, cw, ch, modal = false, minmax = false, onClose } = {}) {
  closeWin(id, true);
  const w = el('div', { class: 'win', id }); pos(w, x, y, cw + 2, ch + 27);
  const tb = el('div', { class: 'tb' }, [icon ? el('img', { src: icon, alt: '' }) : el('span', { style: { width: '8px' } }), title]);
  const x_ = el('div', { class: 'x', title: 'Close', onclick: () => closeWin(id) }, '✕');
  tb.append(x_);
  if (minmax) { tb.append(el('div', { class: 'mm', title: 'Minimise', style: { right: '90px' }, onclick: () => minimiseWin(id, title) }, '—'), el('div', { class: 'mm dis', style: { right: '45px' } }, '☐')); }
  const cl = el('div', { class: 'cl' }); pos(cl, 0, 26, cw, ch);
  w.append(tb, cl);
  w.addEventListener('mousedown', () => focusWin(id), true);
  W[id] = { el: w, cl, onClose, modal };
  $('#wins').append(w); focusWin(id);
  if (modal) { const sh = el('div', { class: 'abs', id: id + '_shield', style: { inset: 0, zIndex: zTop - 1 } }); $('#wins').insertBefore(sh, w); }
  return cl;
}
function focusWin(id) {
  if (!W[id]) return;
  for (const k in W) W[k].el.classList.toggle('inactive', k !== id);
  W[id].el.style.zIndex = ++zTop;
  const sh = document.getElementById(id + '_shield'); if (sh) sh.style.zIndex = zTop - 1;
}
function closeWin(id, silent) {
  document.querySelectorAll(`.minchip[data-for="${id}"]`).forEach(c => c.remove());
  const w = W[id]; if (!w) return;
  w.el.remove(); const sh = document.getElementById(id + '_shield'); if (sh) sh.remove();
  delete W[id];
  if (!silent && w.onClose) w.onClose();
  const rest = Object.keys(W); if (rest.length) focusWin(rest[rest.length - 1]);
}
function msgBox(text, title = 'Project1', after) {
  const cw = Math.max(176, Math.min(420, text.length * 6.5 + 90)), ch = 104;
  const cl = openWin('msg', { title, x: Math.round((1440 - cw) / 2), y: Math.round((900 - ch) / 2) - 20, cw, ch, modal: true, onClose: after });
  W.msg.el.classList.add('msg');
  cl.append(el('div', { class: 'body' }, text), el('div', { class: 'foot' }, el('div', { class: 'btn def', onclick: () => closeWin('msg') }, 'OK')));
}

/* =========================================================================================
   1. Opening screen (Form1): html\location.htm inside a browser control + Help / Next / Exit
   ========================================================================================= */
(function opening() {
  const o = $('#open');
  // "Elastic Trail" script of location.htm: 7 butterflies follow the mouse
  const dots = [];
  for (let i = 0; i < 7; i++) { const d = el('img', { class: 'trail', src: 'img/ui/bullet.gif', alt: '' }); d.dataset.x = 0; d.dataset.y = 12 + i * 22; if (i === 0) d.style.visibility = 'hidden'; o.append(d); dots.push({ e: d, x: 0, y: 30 + i * 33, dx: 0, dy: 0 }); }
  let mx = 0, my = 0;
  o.addEventListener('mousemove', ev => { const r = stage.getBoundingClientRect(), s = r.width / 1440; mx = (ev.clientX - r.left) / s; my = (ev.clientY - r.top) / s; });
  const DELTAT = .01, SEGLEN = 10, SPRK = 10, MASS = 1, GRAV = 50, RES = 10, STOPV = .1, STOPA = .1, DOTSZ = 11, BOUNCE = .75;
  function spring(i, j, s) { const dx = dots[i].x - dots[j].x, dy = dots[i].y - dots[j].y, len = Math.hypot(dx, dy); if (len > SEGLEN) { const sx = SPRK * (len - SEGLEN); s.x += (dx / len) * sx; s.y += (dy / len) * sx; } }
  let started = false;
  o.addEventListener('mousemove', () => started = true, { once: true });
  setInterval(() => {
    if (!started || o.hidden) return;
    dots[0].x = mx; dots[0].y = my; dots[0].e.style.left = px(mx); dots[0].e.style.top = px(my);
    for (let i = 1; i < 7; i++) {
      const s = { x: 0, y: 0 }; spring(i - 1, i, s); if (i < 6) spring(i + 1, i, s);
      const rx = -dots[i].dx * RES, ry = -dots[i].dy * RES;
      const ax = (s.x + rx) / MASS, ay = (s.y + ry) / MASS + GRAV;
      dots[i].dx += DELTAT * ax; dots[i].dy += DELTAT * ay;
      if (Math.abs(dots[i].dx) < STOPV && Math.abs(dots[i].dy) < STOPV && Math.abs(ax) < STOPA && Math.abs(ay) < STOPA) { dots[i].dx = 0; dots[i].dy = 0; }
      dots[i].x += dots[i].dx; dots[i].y += dots[i].dy;
      const H = 900, Wd = 1440;
      if (dots[i].y >= H - DOTSZ - 1) { if (dots[i].dy > 0) dots[i].dy = BOUNCE * -dots[i].dy; dots[i].y = H - DOTSZ - 1; }
      if (dots[i].x >= Wd - DOTSZ) { if (dots[i].dx > 0) dots[i].dx = BOUNCE * -dots[i].dx; dots[i].x = Wd - DOTSZ - 1; }
      if (dots[i].x < 0) { if (dots[i].dx < 0) dots[i].dx = BOUNCE * -dots[i].dx; dots[i].x = 0; }
      dots[i].e.style.left = px(dots[i].x); dots[i].e.style.top = px(dots[i].y);
    }
  }, 20);

  const cl = openWin('thumbs', { title: 'Click on the image to enlarge', icon: 'img/ui/icon_vb.png', x: 323, y: 168, cw: 792, ch: 529 });
  P.photos.forEach((ph, i) => {
    const t = el('div', { class: 'th', title: ph.credit ? 'Photo: ' + ph.credit : '', onclick: () => showEnlarge(P, i) }, [
      el('div', { class: 'pic' }, el('img', { src: ph.src, alt: '', loading: 'lazy' })),
      el('div', { class: 'cap' }, `${name}-${i + 1}`)]);
    v_pos(t, 4 + (i % 7) * 102, 4 + Math.floor(i / 7) * 124);
    cl.append(t);
  });
  function v_pos(e, x, y) { e.style.left = px(x); e.style.top = px(y); }
}
function showEnlarge(P, i) {
  const ph = P.photos[i];
  const cl = openWin('enlarge', { title: `${P.name}-${i + 1}`, icon: 'img/ui/icon_vb.png', x: 14, y: 4, cw: 1410, ch: 858 });
  cl.append(el('div', { class: 'pic' }, el('img', { src: ph.src, width: ph.w, height: ph.h, alt: P.name })));
  if (ph.credit) cl.append(el('div', { class: 'cr' }, 'Photo: ' + ph.credit));
  const go = d => { const j = (i + d + P.photos.length) % P.photos.length; showEnlarge(P, j); };
  cl.append(pos(el('img', { src: 'img/ui/arrow_left.jpg', class: 'abs hand', title: 'Previous', onclick: () => go(-1), alt: '' }), 683, 820, 24, 24));
  cl.append(pos(el('img', { src: 'img/ui/arrow_right.jpg', class: 'abs hand', title: 'Next', onclick: () => go(1), alt: '' }), 710, 820, 24, 24));
}

/* =========================================================================================
   5. Biology of Butterflies (Images / Life Cycle / Host Plants / Seasonality)
   ========================================================================================= */
const BS = { name: null, tab: 'images', idx: 0 };
function showBio(name) {
  if (name) { const q = K.quick.find(x => x.name === name); if (!K.species.find(s => s.name === name) && q && q.species != null) name = K.species.find(s => s.id === q.species).name; }
  const cl = openWin('bio', { title: 'Biology of Butterflies', icon: 'img/ui/icon_monarch.png', x: 323, y: 160, cw: 792, ch: 551, onClose: () => { if (!W.ident) showModule(); } });
  if (!W.ident) closeWin('module', true);
  BS.name = name || null; BS.tab = 'images'; BS.idx = 0;
  renderBio();
}
function bioSpecies() { return K.species.find(s => s.name === BS.name); }
function renderBio() {
  const cl = W.bio.cl; cl.textContent = '';
  const sp = bioSpecies();
  const combo = el('div', { class: 'combo', onclick: () => { const d = $('#bio .drop'); if (d) d.remove(); else openDrop(); } }, [BS.name || '', el('div', { class: 'arr' }, '▼')]);
  cl.append(combo);
  function openDrop() {
    const d = el('div', { class: 'drop' });
    const names = [...new Set(K.species.map(s => s.name))].sort(jetCmp);
    names.forEach(n => d.append(el('div', { class: n === BS.name ? 'sel' : '', onclick: e => { e.stopPropagation(); BS.name = n; BS.tab = 'images'; BS.idx = 0; renderBio(); } }, n)));
    cl.append(d); const s = d.querySelector('.sel'); if (s) d.scrollTop = s.offsetTop - 60;
  }
  const has = { images: !!sp && sp.photos.length > 0, life: !!(sp && sp.life), host: !!(sp && sp.hosts.length), season: !!(sp && sp.season) };
  if (!has[BS.tab]) BS.tab = has.images ? 'images' : (Object.keys(has).find(k => has[k]) || 'images');
  const tabs = el('div', { class: 'tabs' });
  [['images', 'Images'], ['life', 'Life Cycle'], ['host', 'Host Plants'], ['season', 'Seasonality']].forEach(([k, t], i) => {
    const on = sp && BS.tab === k;
    const tb = el('div', { class: `tab${on ? ' on' : ''}${!has[k] ? ' dis' : ''}`, onclick: () => { if (has[k]) { BS.tab = k; BS.idx = 0; renderBio(); } } }, el('span', {}, t));
    pos(tb, i * 194 + (on ? 0 : 0), on ? -2 : 0, 194 + (i === 3 ? 0 : 1)); tabs.append(tb);
  });
  cl.append(tabs);
  const pane = el('div', { class: 'pane' }); cl.append(pane);
  if (!sp) return;
  if (BS.tab === 'images') {
    const ph = sp.photos[BS.idx];
    if (ph) {
      pane.append(pos(el('img', { src: ph.src, class: 'abs', alt: sp.name, title: ph.credit ? 'Photo: ' + ph.credit : '' }), 12, 8, ph.w, ph.h));
    }
    pane.append(navBar(sp.photos.length, `[${BS.idx + 1}/${sp.photos.length} ]`, 130));
  } else if (BS.tab === 'life') {
    pane.append(pos(el('img', { src: sp.life.src, class: 'abs', alt: 'Life cycle of ' + sp.name }), 4, 6, sp.life.w, sp.life.h));
  } else if (BS.tab === 'host') {
    const h = sp.hosts[BS.idx];
    const sc = el('div', { class: 'scroll' });
    if (h.src) sc.append(el('img', { src: h.src, width: h.w, height: h.h, style: { display: 'block' }, alt: `${h.genus} ${h.species}` }));
    else sc.append(el('div', { style: { padding: '20px', font: '13px var(--arial)' } }, 'Picture not available: ' + h.file));
    pane.append(sc);
    pane.append(navBar(sp.hosts.length, `[${BS.idx + 1}/${sp.hosts.length} ]        ${h.genus} ${h.species}`, 280));
  } else if (BS.tab === 'season') {
    pane.append(pos(el('img', { src: sp.season.src, class: 'abs', alt: 'Seasonality of ' + sp.name }), 6, 12, 460, 477));
    pane.append(pos(el('img', { src: 'img/ui/season_scale.png', class: 'abs', alt: 'Scale: Abundant, Very Common, Common, Rare, Not Seen' }), 536, 92, 171, 314));
  }
}
function navBar(n, text, w) {
  const go = j => { BS.idx = Math.max(0, Math.min(n - 1, j)); renderBio(); };
  const first = BS.idx === 0, last = BS.idx >= n - 1;
  const b = (img, dis, f) => el('img', { src: `img/ui/${img}_${dis ? 'b' : 'a'}.png`, alt: '', onclick: () => !dis && f(), style: { opacity: dis ? .55 : 1 } });
  return el('div', { class: 'nav' }, [b('nav_first', first, () => go(0)), b('nav_prev', first, () => go(BS.idx - 1)),
    el('div', { class: 'box', style: { width: px(w) } }, text), b('nav_next', last, () => go(BS.idx + 1)), b('nav_last', last, () => go(n - 1))]);
}

/* =========================================================================================
   6. QUICK FINDING WITH PATCHES AND SPOTS  (data\Butterfly.mdb, tables 0..11)
   ========================================================================================= */
const QS = { slot: null, lines: [], pick: null };
const SLOT_POS = [[247, 57, 211, 105], [454, 59, 214, 102], [652, 58, 231, 104], [245, 158, 216, 94], [453, 159, 215, 93], [651, 158, 235, 94],
  [246, 293, 218, 94], [447, 293, 226, 96], [655, 293, 226, 94], [235, 391, 236, 93], [447, 390, 227, 94], [655, 389, 226, 96]];   // measured
const SW = [['Black', '#000000', 140], ['White', '#FFFFFF', 188], ['Blue', '#00B0F0', 236], ['Green', '#92D050', 284], ['Orange', '#FFC000', 332], ['Yellow', '#FFFF00', 380]];   // 43px buttons at x 919
function showQuick() {
  QS.slot = null; QS.lines = []; QS.pick = null;
  const cl = openWin('quick', { title: 'QUICK FINDING WITH PATCHES AND SPOTS', icon: 'img/ui/icon_vb.png', x: 218, y: 84, cw: 1002, ch: 698, minmax: true });
  renderQuick();
}
function quickMatches() {
  // each line of "Characters Choosen" is one filter; a patch line lists its colours with "/" (either colour),
  // an eye-spot line carries the position of the ring counted from the centre (CNT)
  let list = K.quick;
  for (const L of QS.lines) list = list.filter(q => q.slots[L.slot].some(([c, n]) => L.colors.includes(c) && (L.cnt ? n === L.cnt : true)));
  return list;
}
function renderQuick() {
  const cl = W.quick.cl; cl.textContent = '';
  const T = (t, cx, cy, font, w = 300) => cl.append(pos(el('div', { class: 'abs', style: { font, width: px(w), textAlign: 'center', lineHeight: '20px', whiteSpace: 'nowrap' } }, t), cx - w / 2, cy - 10));
  T('(1 COLOR)', 341, 12, 'bold 13px var(--arial)'); T('(2 PROMINENT COLOR)', 555, 12, 'bold 13px var(--arial)'); T('(3 COLORS FROM CENTRE)', 764, 12, 'bold 13px var(--arial)');
  cl.append(pos(el('div', { class: 'box' }), 7, 28, 882, 213), pos(el('div', { class: 'box' }), 7, 268, 882, 226));
  T('DORSAL', 117, 72, '18px var(--arial)'); T('VENTRAL', 115, 289, '18px var(--arial)');
  cl.append(pos(el('img', { src: 'img/ui/diag_dorsal.png', class: 'abs', alt: '' }), 24, 93, 185, 144), pos(el('img', { src: 'img/ui/diag_ventral.png', class: 'abs', alt: '' }), 16, 309, 195, 156));
  [['SPOT COLOR', 339, 47], ['PATCH COLOR', 553, 47], ['EYE SPOTS COLOR', 746, 47], ['SPOT COLOR', 331, 281], ['PATCH COLOR', 544, 281], ['EYE SPOTS COLOR', 755, 281]]
    .forEach(([t, x, y]) => T(t, x, y, '16px var(--arial)', 220));
  SLOT_POS.forEach(([x, y, w, h], k) => {
    const s = el('div', { class: 'slot' + (QS.slot === k ? ' on' : ''), title: K.slots[k].label, onclick: () => { QS.slot = k; renderQuick(); } },
      el('img', { src: `img/ui/slot_${k}.png`, alt: K.slots[k].label, style: { width: px(w - 6), height: px(h - 6) } }));
    cl.append(pos(s, x, y, w, h));
  });
  T('Choose', 941, 86, '18px var(--arial)', 90); T('Color', 941, 110, '18px var(--arial)', 90);
  const active = QS.slot != null ? QS.lines.find(l => l.slot === QS.slot && !l.cnt) : null;
  const lastEye = QS.slot != null && K.slots[QS.slot].kind === 'EYE SPOTS' ? QS.lines.filter(l => l.slot === QS.slot).slice(-1)[0] : null;
  SW.forEach(([c, hex, y]) => {
    const on = (active && active.colors.includes(c)) || (lastEye && lastEye.colors[0] === c);
    const b = el('div', { class: 'btn', title: c, onclick: () => pickColor(c), style: { padding: 0 } }, el('div', { style: { width: '37px', height: '37px', background: hex, boxSizing: 'border-box', border: on ? '3px solid #0000FF' : 'none' } }));
    cl.append(pos(b, 919, y, 43, 43));
  });
  T('Characters Choosen', 87, 508, 'bold 12px var(--arial)', 140);
  const lines = el('div', { class: 'ql' }); pos(lines, 24, 518, 400, 180);
  QS.lines.forEach(L => lines.append(el('div', {}, `${K.slots[L.slot].label}: ${L.colors.join('/')}`)));
  cl.append(lines);
  const list = QS.lines.length ? quickMatches() : [];
  cl.append(pos(el('div', { class: 'abs', style: { font: 'bold 12px var(--arial)', whiteSpace: 'nowrap' } }, 'Butterflies Matched : ' + (QS.lines.length ? list.length : '')), 464, 501));
  const ml = el('div', { class: 'ql' }); pos(ml, 456, 518, 296, 180);
  [...new Set(list.map(q => q.name))].sort(jetCmp).forEach(n => ml.append(el('div', { class: n === QS.pick ? 'sel' : '', onclick: () => { QS.pick = n; renderQuick(); } }, n)));
  cl.append(ml);
  const qbtn = (t, x, y, w, h, f) => cl.append(pos(el('div', { class: 'btn', style: { font: '16px var(--arial)' }, onclick: f }, t), x, y, w, h));
  qbtn('IMAGES', 769, 573, 80, 40, () => QS.pick ? showThumbs(QS.pick) : msgBox('Please select a species', 'Images'));
  qbtn('CLEAR', 920, 532, 72, 40, () => { QS.slot = null; QS.lines = []; QS.pick = null; renderQuick(); });
  qbtn('BACK', 920, 589, 72, 40, () => closeWin('quick'));
  qbtn('EXIT', 920, 645, 72, 40, () => exitProgram());
}
function pickColor(c) {
  if (QS.slot == null) return msgBox('FIRST CHOOSE PATCH/SPOT/EYE SPOTS');
  const kind = K.slots[QS.slot].kind;
  if (kind === 'SPOT') {            // one colour: a new choice replaces the line
    let L = QS.lines.find(l => l.slot === QS.slot);
    if (!L) QS.lines.push(L = { slot: QS.slot, colors: [] });
    L.colors = [c];
  } else if (kind === 'PATCH') {    // two prominent colours on one line
    let L = QS.lines.find(l => l.slot === QS.slot);
    if (!L) QS.lines.push(L = { slot: QS.slot, colors: [] });
    if (!L.colors.includes(c)) { L.colors.push(c); if (L.colors.length > 2) L.colors.shift(); }
  } else {                          // eye spots: up to three rings, each its own line, counted from the centre
    const n = QS.lines.filter(l => l.slot === QS.slot).length;
    if (n >= 3) return;
    QS.lines.push({ slot: QS.slot, colors: [c], cnt: n + 1 });
  }
  QS.pick = null; renderQuick();
}
