async function dlgDb() {
  const d = openWin('dlg_db'), [fb, fs, fp, fu, fa, fc, fl] = W('dlg_db').fields, U2 = await load('uses'), SYS = await load('systems');
  const all = Object.entries(U2), u = a => [...new Set(a.filter(has))].sort((p, q) => p.localeCompare(q));
  const byKey = new Map(CORE.sp.map(r => [key(r), r[0]]));
  let op = 'OR', crit = [];
  const cbox = text(d, fc[0], fc[1], fc[2], fc[3], '', A12, BK, {white: true});
  const add = (t, v) => { crit.push([t, v]); cbox.textContent = crit.map(([a, b]) => `${a} = ${b}`).join(` ${op} `); };
  const C = (f, items, t) => combo(d, f[0] - 2, f[1] - 2, f[2] + 22, f[3] + 4, items, A12, BK, v => add(t, v), {rows: 12, lh: 15});
  combo(d, fb[0] - 2, fb[1] - 2, fb[2] + 22, fb[3] + 4, ['OR', 'AND'], A12, BK, v => { op = v; }, {value: 'OR', rows: 2, lh: 15, selHi: true});
  C(fs, u(Object.values(SYS).flat()), 'Medicinal'); C(fp, u(all.flatMap(([k, v]) => v.map(x => x[0]))), 'Part');
  C(fu, u(all.flatMap(([k, v]) => v.map(x => x[2]))), 'Use'); C(fa, u(all.flatMap(([k, v]) => v.map(x => x[1]))), 'Action');
  let ids = [];
  const l = list(d, fl[0], fl[1] + 18, fl[2], fl[3] - 34, [], A12, BK, null, {lh: '14px', ondbl: i => { d.close(); setSpecies(ids[i]); }});
  hot(296, 214, 46, 18, d, () => { crit = []; cbox.textContent = ''; l.set([]); });
  hot(374, 214, 52, 18, d, () => {
    const test = ([k, rows], [t, v]) => t === 'Medicinal' ? (SYS[k] || []).includes(v) : rows.some(x => x[{Part: 0, Use: 2, Action: 1}[t]] === v);
    const keys = all.filter(e => crit.length && (op === 'AND' ? crit.every(c => test(e, c)) : crit.some(c => test(e, c)))).map(e => e[0]);
    ids = keys.map(k => byKey.get(k)).filter(Boolean); l.set(ids.map(id => nm(SPI.get(id))));
  });
}
async function dlgWeb() {
  const d = openWin('dlg_web'), f = W('dlg_web').fields, C = await load('webcrit');
  const byKey = new Map(CORE.sp.map(r => [key(r), r[0]]));
  let op = 'OR', sel = [];
  combo(d, f[0][0] - 2, f[0][1] - 2, f[0][2] + 22, f[0][3] + 4, ['OR', 'AND'], A12, BK, v => { op = v; }, {rows: 2, lh: 15, selHi: true});
  ['Parts', 'Action/Use', 'Product/Chemical', 'Reference/Chapter'].forEach((t, i) => combo(d, f[i + 1][0] - 2, f[i + 1][1] - 2, f[i + 1][2] + 22, f[i + 1][3] + 4, C.types[t] || [], A12, BK, v => { sel[i] = v; }, {rows: 12, lh: 15, selHi: true}));
  const g = el('div', 'position:absolute;left:41px;top:287px;width:610px;height:196px;overflow:auto;', d, 'lst');
  const run = () => {
    const sets = sel.filter(Boolean).map(t => new Set(C.hits[t] || []));
    if (!sets.length) return;
    let ks = op === 'AND' ? [...sets[0]].filter(k => sets.every(s => s.has(k))) : [...new Set(sets.flatMap(s => [...s]))];
    const ids = ks.map(k => byKey.get(k)).filter(Boolean);
    g.innerHTML = '';
    ids.forEach((id, j) => { const r = SPI.get(id); [r[1], r[2], has(r[3]) ? r[3] : '', has(r[4]) ? r[4] : ''].forEach((v, c) => { const e = el('div', `left:${[0, 101, 202, 303][c]}px;top:${j * 18}px;width:101px;height:18px;background:#fff;font:${A12};cursor:default;`, g, 'tc'); e.textContent = v; e.ondblclick = () => { d.close(); setSpecies(id); }; }); });
  };
  hot(470, 210, 54, 18, d, () => { sel = []; g.innerHTML = ''; });
  hot(560, 210, 64, 18, d, run);
}
