<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phyllanthus &amp; Rattans Kit 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,650;1,6..72,500;1,6..72,600&family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a field key you hold in your hand. A slim top bar with search on every screen;
   the identification screen puts the question on top and the shrinking set of candidate
   photographs underneath, so the reader watches the species drop out as they answer. */
:root{
  --bg:#F1F4EE; --surface:#FFFFFF; --sunk:#E7ECE3; --ink:#13201A; --muted:#56655B; --rule:#D3DBCF;
  --leaf:#2A7A4B; --leaf-ink:#1F5E39; --leaf-soft:#DDEEE2;
  --cane:#A86B12; --cane-ink:#7F500B; --cane-soft:#F6E7CC;
  --map-land:#E3EADF; --map-line:#B9C6B5; --focus:#0E5BD8;
  --A:#2F8F4E; --C:#2C62B8; --G:#C68A12; --T:#C2412D; --N:#A3ACA5;
  --f-name:"Newsreader", Georgia, "Times New Roman", serif;
  --f-ui:"Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --shadow:0 1px 2px rgba(19,32,26,.06),0 4px 16px rgba(19,32,26,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1310; --surface:#151D18; --sunk:#1C2620; --ink:#E5EDE7; --muted:#9AAA9F; --rule:#2A372F;
  --leaf:#6FCB91; --leaf-ink:#8EDDA9; --leaf-soft:#1A3324; --cane:#E4AE55; --cane-ink:#F0C47A; --cane-soft:#3A2B14;
  --map-land:#1C2620; --map-line:#33433A; --focus:#7FB0FF;
  --A:#5CC37C; --C:#6E9BEA; --G:#E6B54A; --T:#EE7560; --N:#66716A; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1310; --surface:#151D18; --sunk:#1C2620; --ink:#E5EDE7; --muted:#9AAA9F; --rule:#2A372F;
  --leaf:#6FCB91; --leaf-ink:#8EDDA9; --leaf-soft:#1A3324; --cane:#E4AE55; --cane-ink:#F0C47A; --cane-soft:#3A2B14;
  --map-land:#1C2620; --map-line:#33433A; --focus:#7FB0FF;
  --A:#5CC37C; --C:#6E9BEA; --G:#E6B54A; --T:#EE7560; --N:#66716A; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.bn{font-family:var(--f-name);font-style:italic;font-weight:500}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left;min-width:0}
.logo img{width:34px;height:34px;border-radius:9px;flex:none}
.logo b{display:block;font-weight:700;font-size:15px;line-height:1.1;white-space:nowrap}
.logo small{display:block;font-size:12px;color:var(--muted);white-space:nowrap}
.nav{display:flex;gap:2px;margin-left:8px}
.nav button{background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--muted)}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button.on{color:var(--ink);background:var(--sunk)}
.search{position:relative;margin-left:auto;flex:1;max-width:340px;min-width:0}
.search input{width:100%;border:1px solid var(--rule);background:var(--bg);border-radius:10px;padding:8px 12px 8px 34px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:6px;max-height:60vh;overflow:auto;z-index:25}
.results button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:6px;cursor:pointer}
.results button:hover,.results button.sel{background:var(--sunk)}
.results img{width:40px;height:40px;border-radius:6px;object-fit:cover;flex:none;background:var(--sunk)}
.results small{display:block;color:var(--muted);font-size:13px}
.results .none{padding:10px;color:var(--muted)}
.menu-btn{display:none;background:none;border:1px solid var(--rule);border-radius:8px;padding:6px 10px;cursor:pointer}

main{padding-block:28px 64px;min-height:70vh}

/* buttons, chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:13px}
.tag-phy{color:var(--leaf-ink);background:var(--leaf-soft);border-color:transparent}
.tag-rat{color:var(--cane-ink);background:var(--cane-soft);border-color:transparent}
.term{border-bottom:1px dotted currentColor;cursor:help}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:36px;align-items:center}
.hero h1{font-family:var(--f-name);font-weight:500;font-size:clamp(38px,6vw,68px);line-height:1.02;letter-spacing:-.01em}
.hero h1 i{font-weight:500}
.hero h1 .amp{color:var(--muted);font-style:normal}
.hero p{font-size:18px;color:var(--muted);max-width:52ch;margin:14px 0 18px}
.credit{display:flex;flex-direction:column;gap:2px;font-size:14px;margin:0 0 22px;padding-left:12px;border-left:3px solid var(--leaf)}
.credit b{font-weight:600}
.mosaic{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(4,72px);gap:8px}
.mosaic button{border:0;padding:0;border-radius:10px;overflow:hidden;cursor:pointer;background:var(--sunk);position:relative}
.mosaic img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.mosaic button:hover img{transform:scale(1.05)}
.mosaic button span{position:absolute;left:8px;bottom:6px;color:#fff;font-family:var(--f-name);font-style:italic;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.m1{grid-column:1/4;grid-row:1/3}.m2{grid-column:4/7;grid-row:1/2}.m3{grid-column:4/5;grid-row:2/3}.m4{grid-column:5/7;grid-row:2/4}.m5{grid-column:1/3;grid-row:3/5}.m6{grid-column:3/5;grid-row:3/5}.m7{grid-column:5/7;grid-row:4/5}
.doors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:44px}
.door{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:20px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.door:hover{border-color:var(--muted)}
.door .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--sunk)}
.door .ic svg{width:22px;height:22px}
.door h2{font-size:21px}
.door p{margin:0;color:var(--muted);font-size:15px}
.door .go{margin-top:auto;font-weight:600;font-size:14px}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:40px;padding-top:24px;border-top:1px solid var(--rule)}
.stats div b{display:block;font-family:var(--f-name);font-size:34px;font-weight:500;line-height:1}
.stats div span{font-size:13px;color:var(--muted)}

/* group picker */
.groups{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:22px}
.gcard{border:1px solid var(--rule);background:var(--surface);border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column}
.gcard:hover{border-color:var(--muted)}
.gcard img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--sunk)}
.gcard div{padding:14px 16px 16px}
.gcard h3{font-size:19px}
.gcard p{margin:4px 0 0;color:var(--muted);font-size:14px}

/* key explorer */
.kx-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;justify-content:space-between}
.kx-head h1{font-family:var(--f-name);font-weight:500;font-size:clamp(28px,4vw,40px)}
.meter{display:flex;align-items:baseline;gap:8px}
.meter b{font-family:var(--f-name);font-size:44px;font-weight:500;line-height:1}
.bar{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:var(--accent,var(--leaf));border-radius:6px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.kx{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
.rail{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:12px;position:sticky;top:76px}
.rail h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 6px 8px;font-weight:600}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:8px 10px;cursor:pointer}
.ch:hover{background:var(--sunk)}
.ch.on{background:var(--ink);color:var(--bg)}
.ch .why{font-size:12px;color:var(--muted)}
.ch.on .why{color:inherit;opacity:.8}
.ch.flat{opacity:.5}
.best{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink,var(--leaf-ink));background:var(--accent-soft,var(--leaf-soft));border-radius:999px;padding:2px 8px;white-space:nowrap}
.ch.on .best{background:var(--bg);color:var(--ink)}
.answered{display:flex;flex-wrap:wrap;gap:6px;padding:4px 6px 8px}
.answered .chip{cursor:pointer}
.answered .chip b{font-weight:600}
.answered .chip:hover{border-color:var(--muted)}
.railfoot{display:flex;gap:8px;padding:10px 6px 4px;border-top:1px solid var(--rule);margin-top:8px}
.railfoot .btn{flex:1;padding:7px 10px;font-size:14px}
.q{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:18px}
.q-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.q h2{font-size:22px;font-weight:650}
.q .hint{color:var(--muted);font-size:14px;margin:4px 0 0}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:16px}
.opt{border:1px solid var(--rule);background:var(--bg);border-radius:12px;padding:0;overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column}
.opt:hover{border-color:var(--ink);transform:translateY(-1px)}
.opt img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--sunk)}
.opt div{padding:9px 11px 11px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.opt b{font-weight:600}
.opt small{color:var(--muted);font-size:13px;white-space:nowrap}
.opt.skip{justify-content:center;align-items:center;border-style:dashed;color:var(--muted);min-height:120px}
.done{display:flex;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px;flex-wrap:wrap}
.done img{width:120px;height:120px;border-radius:12px;object-fit:cover}
.done h2{font-family:var(--f-name);font-weight:500;font-size:30px}
.cands-h{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 12px;gap:12px;flex-wrap:wrap}
.cands-h h3{font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:14px}
.sp{background:var(--surface);border:1px solid var(--rule);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;transition:opacity .35s,filter .35s,transform .35s}
.sp:hover{border-color:var(--muted);transform:translateY(-2px)}
.sp img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--sunk)}
.sp .noimg{width:100%;aspect-ratio:1;display:grid;place-items:center;background:var(--sunk);color:var(--muted);font-size:13px;padding:10px;text-align:center}
.sp div{padding:10px 12px 12px}
.sp .bn{font-size:16px;line-height:1.25;display:block}
.sp small{color:var(--muted);font-size:13px}
.sp.out{opacity:.38;filter:grayscale(1)}
.sp.out:hover{opacity:.7}
details.ruled{margin-top:18px}
details.ruled summary{cursor:pointer;font-weight:600;color:var(--muted);padding:6px 0}
details.ruled .grid{margin-top:10px}

/* species page */
.sphero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
.gal-main{border-radius:16px;overflow:hidden;background:var(--sunk);aspect-ratio:4/3;position:relative;cursor:zoom-in;border:0;padding:0;width:100%;display:block}
.gal-main img{width:100%;height:100%;object-fit:cover;display:block}
.gal-main span{position:absolute;left:12px;bottom:10px;background:rgba(13,19,16,.72);color:#fff;font-size:13px;padding:3px 10px;border-radius:999px}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:4px}
.thumbs button{flex:none;width:72px;height:72px;border-radius:9px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:var(--sunk)}
.thumbs button.on{border-color:var(--ink)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.sphead .bn{font-size:clamp(32px,4.4vw,48px);line-height:1.05;display:block;margin:8px 0 4px}
.sphead .auth{color:var(--muted);font-size:15px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}
.fact{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:10px 12px}
.fact span{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fact b{font-weight:600}
.keychars{display:flex;flex-wrap:wrap;gap:6px}
.namebox{margin-top:12px;padding:10px 12px;border-left:3px solid var(--cane);background:var(--surface);border-radius:0 10px 10px 0;display:flex;flex-direction:column;gap:2px}
.namebox .bn{font-size:17px}
.namebox a{color:inherit}
.keychars .chip b{font-weight:600}
.sp-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin:34px 0 22px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.prose{max-width:72ch;font-size:17px}
.prose p{margin:0 0 12px}
.prose em,.prose i{font-family:var(--f-name)}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px}
dl.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:10px 18px;margin:0}
dl.kv dt{font-weight:600;color:var(--muted);font-size:14px}
dl.kv dd{margin:0}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:16px}
.card h3{font-size:15px;margin-bottom:10px}

/* map */
.mapbox{position:relative;background:var(--surface);border:1px solid var(--rule);border-radius:16px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto;max-height:72vh;touch-action:none;cursor:grab;background:var(--surface)}
.mapbox svg:active{cursor:grabbing}
.mapctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:34px;height:34px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);cursor:pointer;font-weight:700}
.maptip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:6px 10px;border-radius:8px;max-width:260px;transform:translate(-50%,calc(-100% - 12px));white-space:normal}
.mapnote{font-size:12px;color:var(--muted);padding:8px 12px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;align-items:center}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:6px}
.maplayout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;margin-top:18px;align-items:start}
.sidepanel{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:14px;max-height:640px;overflow:auto}
.sidepanel select{width:100%;padding:8px;border-radius:8px;border:1px solid var(--rule);background:var(--bg)}
.tablebox{overflow:auto;max-height:420px;border:1px solid var(--rule);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 12px;border-bottom:1px solid var(--rule);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--surface);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.mono{font-family:var(--f-mono);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}

/* DNA */
.strip{width:100%;height:30px;display:block;border-radius:6px}
.seqrow{margin-bottom:14px}
.seqrow .lab{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:4px}
pre.aln{font-family:var(--f-mono);font-size:12px;line-height:1.5;margin:0;padding:12px;white-space:pre}
pre.aln .hit{background:var(--cane-soft)}
.b-A{color:var(--A)}.b-C{color:var(--C)}.b-G{color:var(--G)}.b-T{color:var(--T)}

/* compare */
.cmp{overflow-x:auto;border:1px solid var(--rule);border-radius:16px;background:var(--surface)}
.cmp table td,.cmp table th{white-space:normal;vertical-align:top;min-width:180px}
.cmp table th:first-child,.cmp table td:first-child{min-width:150px;color:var(--muted);font-weight:600;font-size:13px;text-transform:none;letter-spacing:0}
.cmp img{width:100%;max-width:220px;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.cmp .diff{background:var(--cane-soft);font-weight:600}
.picker{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.picker select{padding:8px;border-radius:8px;border:1px solid var(--rule);background:var(--surface)}

/* browse */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0}

/* glossary */
.gloss{columns:2;column-gap:28px}
.gloss div{break-inside:avoid;padding:10px 0;border-bottom:1px solid var(--rule)}
.gloss b{font-weight:650}
.gloss small{color:var(--muted);margin-left:6px}
.gloss p{margin:2px 0 0;color:var(--muted)}
.pop{position:fixed;z-index:40;max-width:300px;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.pop b{display:block;margin-bottom:2px}

/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:rgba(8,12,10,.9);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb figure{margin:0;display:flex;flex-direction:column;gap:10px;max-width:min(1200px,100%)}

.lb .nv{position:absolute;top:50%;transform:translateY(-50%);background:rgba(229,237,231,.15);color:#fff;border:0;width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:22px}
.lb .pv{left:calc(14px + env(safe-area-inset-left,0px))}.lb .nx{right:calc(14px + env(safe-area-inset-right,0px))}

footer{border-top:1px solid var(--rule);padding-block:24px 40px;color:var(--muted);font-size:13px}

@media (max-width:1000px){
  .kx{grid-template-columns:minmax(0,1fr)}

  .nav.open{display:flex;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:var(--surface);border-bottom:1px solid var(--rule);padding:8px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));margin:0}
  .hero,.sphero,.two{grid-template-columns:minmax(0,1fr)}

      <button type="button" data-go="identify">Identify</button>
      <button type="button" data-go="map">Map</button>
      <button type="button" data-go="browse">Species</button>

      <button type="button" data-go="glossary">Glossary</button>
    </nav>
    <div class="search" id="searchbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search names, common names, synonyms" autocomplete="off" aria-label="Search species">
      <div class="results" id="results" hidden></div>
    </div>
    <button class="menu-btn" id="menubtn" type="button" aria-expanded="false" aria-controls="nav">Menu</button>
  </div>
</header>
<main class="wrap" id="app"><p class="muted">Loading the kit…</p></main>
<footer><div class="wrap">
  <span>Version 2.0.0 · Data from the 2010 Indian Barcode of Life kit (DBT; ATREE, UAS Bangalore, BSI Kolkata). Map boundaries: DataMeet, CC BY 4.0.</span>
  <span><button type="button" data-go="about">About this kit</button></span>
</div></footer>
<div class="lb" id="lb" hidden><button class="x" type="button" id="lbx">Close</button><button class="nv pv" type="button" id="lbp" aria-label="Previous image">‹</button><button class="nv nx" type="button" id="lbn" aria-label="Next image">›</button><figure><img id="lbimg" alt=""><figcaption id="lbcap"></figcaption></figure></div>
<div class="pop" id="pop" hidden></div>

<script src="data/kit.js"></script>
<script src="data/map.js"></script>
<script>
"use strict";
/* ============ data ============ */
let K=null, MAP=null;
const S={}; // species by id
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const low=v=>String(v??'').trim().toLowerCase();
const GROUPS={
  herb:{name:'Phyllanthus herbs',short:'Herb',fam:'phy'},
  shrub:{name:'Phyllanthus shrubs',short:'Shrub',fam:'phy'},
  tree:{name:'Phyllanthus trees',short:'Tree',fam:'phy'},
  rattans:{name:'Rattans',short:'Rattan',fam:'rat'}
};
const FAMILY={Phyllanthus:'Phyllanthaceae',Calamus:'Arecaceae',Daemonorops:'Arecaceae',Plectocomia:'Arecaceae',Zalacca:'Arecaceae'};

/* Glossary written for Version 2 (draft for expert review). Keys are lower-case values or labels. */
const GLOSS={
 'cataphyll':['Cataphyll','A small, scale-like leaf, found where the leafy branchlets of Phyllanthus herbs join the main stem.'],
 'persistent calyx lobes':['Persistent calyx lobes','Sepals that stay on around the fruit; counted here as 5 or 6.'],
 'tubercled':['Tubercled','Covered with small wart-like bumps.'],
 'smooth':['Smooth','Without bumps, ridges or hairs.'],
 'serrate':['Serrate','Edge with small, forward-pointing teeth like a saw.'],
 'rounded':['Rounded','Evenly curved, without a point or angle.'],
 'cuneate':['Cuneate','Wedge-shaped, narrowing evenly to the base.'],
 'oblique':['Oblique','Unequal on the two sides of the midrib.'],
 'sub-cordate':['Sub-cordate','Slightly heart-shaped, with a shallow notch at the base.'],
 'apiculate':['Apiculate','Ending in a short, sharp, abrupt point.'],
 'acute':['Acute','Tapering to a point at an angle of less than 90°.'],
 'obtuse':['Obtuse','Blunt, with an angle of more than 90°.'],
 'elliptic':['Elliptic','Oval, widest in the middle and narrowing equally to both ends.'],
 'oblong':['Oblong','Longer than wide, with nearly parallel sides.'],
 'linear':['Linear','Long and narrow, with parallel sides.'],
 'obovate':['Obovate','Egg-shaped, with the widest part above the middle.'],
 'ovate':['Ovate','Egg-shaped, with the widest part below the middle.'],
 'sub-orbicular':['Sub-orbicular','Almost circular.'],
 'oblanceolate':['Oblanceolate','Lance-shaped but widest towards the tip.'],
 'falcate':['Falcate','Curved like a sickle.'],
 'baccate':['Baccate','Berry-like: fleshy and not splitting open.'],
 'capsular':['Capsular','A dry fruit that splits open to release its seeds.'],
 'stipular spine':['Stipular spine','A spine formed from a stipule, the small outgrowth at the base of a leaf.'],
 'deciduous':['Deciduous','Falling off early.'],
 'persistent':['Persistent','Staying attached.'],
 'glomerulate':['Glomerulate','Flowers packed in dense, rounded clusters.'],
 'rotate':['Rotate','Wheel-shaped: petals or sepals spread out flat.'],
 'campanulate':['Campanulate','Bell-shaped.'],
 'branchlet pattern':['Branchlet pattern','How the leafy branchlets are arranged along the stem.'],
 'fascicled':['Fascicled','Several arising together from one point, in a bundle.'],
 'alternate':['Alternate','One at each node, on alternating sides.'],
 'coriaceous':['Coriaceous','Thick and leathery.'],
 'membranous':['Membranous','Thin, soft and somewhat translucent.'],
 'glossy':['Glossy','Shiny on the surface.'],
 'glabrous':['Glabrous','Without hairs.'],
 'hispidulous':['Hispidulous','Minutely bristly, with tiny stiff hairs.'],
 'paler':['Paler beneath','Lower surface lighter in colour than the upper surface.'],
 'non-paler':['Not paler beneath','Both surfaces of similar colour.'],
 'cluster':['Clustering','Many stems growing together from one base.'],
 'single stemmed':['Single-stemmed','Growing as a solitary stem.'],
 'acaulescent':['Acaulescent','Without a visible above-ground stem.'],
 'suckers':['Suckers','New shoots arising from the base of the plant.'],
 'stolon':['Stolon','A creeping stem running along or under the ground that gives rise to new shoots.'],
 'flabellate':['Flabellate','Fan-shaped.'],
 'bifid':['Bifid','Split into two lobes at the tip.'],
 'digitate':['Digitate','Divided into finger-like segments from one point.'],
 'seedling leaf shape':['Seedling leaf (eophyll)','The first true leaf of a young rattan, often a different shape from adult leaves.'],
 'presence of knee':['Knee','A swelling on the leaf sheath just below the base of the leaf stalk.'],
 'presence of ocrea':['Ocrea','An extension of the leaf sheath beyond the base of the leaf stalk, often papery or spiny.'],
 'flagellum':['Flagellum','A long, whip-like climbing organ armed with hooked spines, arising from the leaf sheath.'],
 'cirrate':['Cirrate','The leaf ends in a cirrus: a whip-like extension of the leaf axis bearing hooks.'],
 'ecirrate':['Ecirrate','The leaf has no cirrus at its tip.'],
 'arrangement of sheath spines':['Sheath spines','How spines are spread on the leaf sheath: densely, sparingly, as a rim, or absent.'],
 'rim like structure':['Rim-like structure','Spines joined at their bases into ridges or rims on the sheath.'],
 'presence of petiole':['Petiole','The leaf stalk between the sheath and the first leaflets.'],
 'grouped':['Grouped leaflets','Leaflets arranged in clusters along the leaf axis.'],
 'regular':['Regular leaflets','Leaflets evenly spaced along the leaf axis.'],
 'leaflets vein':['Leaflet veins','Number of prominent parallel veins in each leaflet.'],
 'glaucous beneath':['Glaucous beneath','Lower surface covered with a whitish, waxy bloom.'],
 'fruit stalk':['Fruit stalk','Whether the fruit sits directly on the axis (sessile) or on a short stalk (stalked).'],
 'sessile':['Sessile','Attached directly, without a stalk.'],
 'stalked':['Stalked','Borne on a short stalk.'],
 'fruit surface':['Fruit surface','Rattan fruits are covered in overlapping scales; channeled scales have a groove down the middle.'],
 'channeled':['Channeled','Scales with a groove down the middle.'],
 'not-channeled':['Not channeled','Scales without a central groove.'],
 'length of the spines at the mouth of sheath':['Spines at the sheath mouth','Length of the spines at the top of the leaf sheath, where the leaf stalk begins.'],
 'root':['Shoot origin','In the original kit this is labelled "Root": where new shoots come from (suckers, stolons or older flagella).'],
 'older flagellum':['Older flagellum','New shoots arising from an old flagellum.']
};
function gloss(word,label){const g=GLOSS[low(word)];return g?`<span class="term" tabindex="0" data-term="${esc(low(word))}">${esc(label??word)}</span>`:esc(label??word);}

/* ============ helpers ============ */
function photo(s){const p=s.images.find(i=>i.cat==='P')||s.images[0];return p?p.src:'';}
function groupOf(s){for(const k of Object.keys(K.keys)) if(K.keys[k].records.some(r=>r.spid===s.spid)) return k; return s.genus==='Phyllanthus'?null:'rattans';}
function famClass(s){return s.genus==='Phyllanthus'?'phy':'rat';}
function recOf(s){const g=groupOf(s);return g?K.keys[g].records.find(r=>r.spid===s.spid):null;}
function common(s){
  const out={};let last=null;
  s.common.forEach(c=>{const m=c.match(/^\s*([A-Za-z]+)\s*-\s*(.*)$/);if(m){last=m[1];(out[last]=out[last]||[]).push(m[2].trim());}else if(last){out[last].push(c.trim());}else{(out['Other']=out['Other']||[]).push(c.trim());}});
  return out;
}
function firstCommon(s){const c=common(s);const e=c.English||c.Hindi||c.Kannada||Object.values(c)[0];return e?e.join(', ').split(',')[0].trim():'';}
function partName(s,i){const t=i.title;const r=t.startsWith(s.kitName)?(t.slice(s.kitName.length).replace(/^[\s_]+/,'')||'Specimen'):t;return /^\d+$/.test(r)?'Herbarium sheet '+r:r;}
function spCard(s,extra){
  const p=photo(s);
  return `<button type="button" class="sp ${extra||''}" data-sp="${s.spid}">${p?`<img src="${p}" alt="" loading="lazy">`:`<span class="noimg">No photograph in the original kit</span>`}<div><span class="bn">${esc(s.name)}</span><small>${s.kitName!==s.name?`was <i>${esc(s.kitName)}</i>`:esc(firstCommon(s)||FAMILY[s.genus]||'')}</small></div></button>`;
}
const canDownload=()=>/github\.io$|^localhost$|^127\.0\.0\.1$|^tauri\.localhost$/.test(location.hostname)||location.protocol==='file:'||location.protocol==='tauri:';

/* ============ router ============ */
let view={name:'home'};
// each screen is a browser history entry, so the Back and Forward buttons move between screens of the kit
const remember=(push)=>{try{history[push?'pushState':'replaceState']({...view},'');}catch(e){}};
function go(v,push=true){ view=v; remember(push); closeSearch(); $('#nav').classList.remove('open'); render(); window.scrollTo({top:0}); }
addEventListener('popstate',e=>{view=(e.state&&e.state.name)?e.state:{name:'home'}; closeSearch(); $('#nav').classList.remove('open'); $('#lb').hidden=true; render(); window.scrollTo({top:0});});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go]'); if(t){e.preventDefault();go({name:t.dataset.go});return;}
  const sp=e.target.closest('[data-sp]'); if(sp&&!e.target.closest('[data-noop]')){go({name:'species',id:+sp.dataset.sp});return;}
});
function setNav(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===view.name||(b.dataset.go==='identify'&&view.name==='key')||(b.dataset.go==='browse'&&view.name==='species')));}
function render(){
  setNav();
  const v=view.name;
  if(v==='home') return home();
  if(v==='identify') return identify();
  if(v==='key') return keyView(view.key);
  if(v==='species') return species(view.id,view.tab);
  if(v==='map') return mapView();
  if(v==='browse') return browse();
  if(v==='compare') return compare();
  if(v==='glossary') return glossary();
  if(v==='about') return about();
}
$('#menubtn').onclick=()=>{const n=$('#nav');n.classList.toggle('open');$('#menubtn').setAttribute('aria-expanded',n.classList.contains('open'));};

/* ============ search ============ */
let searchIndex=[];
function buildIndex(){
  searchIndex=K.species.map(s=>({s,text:low([s.name,s.kitName,s.genus,s.species,...s.common,...s.synonyms,FAMILY[s.genus]].join(' | '))}));
}
let selIdx=-1;
function doSearch(q){
  const box=$('#results'); q=low(q);
  if(q.length<2){box.hidden=true;return;}
  const parts=q.split(/\s+/);
  const hits=searchIndex.filter(x=>parts.every(p=>x.text.includes(p))).slice(0,12);
  selIdx=-1;
  box.innerHTML=hits.length?hits.map(({s})=>{
    const why=[s.kitName!==s.name?'2010 kit name: '+s.kitName:'',...s.common,...s.synonyms].filter(Boolean).find(t=>parts.every(p=>low(t).includes(p)));
    return `<button type="button" data-sp="${s.spid}">${photo(s)?`<img src="${photo(s)}" alt="">`:`<img alt="">`}<span><span class="bn">${esc(s.name)}</span><small>${esc(why?why.slice(0,80):(firstCommon(s)||FAMILY[s.genus]))}</small></span></button>`;}).join(''):`<div class="none">No species match "${esc(q)}".</div>`;
  box.hidden=false;
}
function closeSearch(){$('#results').hidden=true;$('#q').value='';}
$('#q').addEventListener('input',e=>doSearch(e.target.value));
$('#q').addEventListener('keydown',e=>{
  const items=[...$('#results').querySelectorAll('button')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!items.length)return;selIdx=(selIdx+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items.forEach((b,i)=>b.classList.toggle('sel',i===selIdx));}
  if(e.key==='Enter'&&items.length){(items[selIdx]||items[0]).click();}
  if(e.key==='Escape'){closeSearch();}
});
document.addEventListener('click',e=>{if(!e.target.closest('#searchbox'))$('#results').hidden=true;});

/* ============ glossary popover ============ */
const pop=$('#pop');
function showTerm(el){const g=GLOSS[el.dataset.term];if(!g)return;pop.innerHTML=`<b>${esc(g[0])}</b>${esc(g[1])}`;pop.hidden=false;const r=el.getBoundingClientRect();const w=Math.min(300,window.innerWidth-24);pop.style.maxWidth=w+'px';let x=Math.min(Math.max(12,r.left),window.innerWidth-w-12);let y=r.bottom+8;if(y+120>window.innerHeight)y=r.top-pop.offsetHeight-8;pop.style.left=x+'px';pop.style.top=y+'px';}
document.addEventListener('mouseover',e=>{const t=e.target.closest('.term');if(t)showTerm(t);});
document.addEventListener('mouseout',e=>{if(e.target.closest('.term'))pop.hidden=true;});
document.addEventListener('focusin',e=>{const t=e.target.closest('.term');if(t)showTerm(t);});
document.addEventListener('focusout',e=>{if(e.target.closest('.term'))pop.hidden=true;});
document.addEventListener('click',e=>{const t=e.target.closest('.term');if(t){e.stopPropagation();showTerm(t);}else pop.hidden=true;},true);

/* ============ lightbox ============ */
let LB={list:[],i:0};
function openLB(list,i){LB={list,i};showLB();$('#lb').hidden=false;$('#lbx').focus();}
function showLB(){const it=LB.list[LB.i];$('#lbimg').src=it.src;$('#lbimg').alt=it.cap;$('#lbcap').textContent=`${it.cap}  ·  ${LB.i+1} of ${LB.list.length}`;$('#lbp').hidden=$('#lbn').hidden=LB.list.length<2;}
$('#lbx').onclick=()=>$('#lb').hidden=true;
$('#lbp').onclick=()=>{LB.i=(LB.i-1+LB.list.length)%LB.list.length;showLB();};
$('#lbn').onclick=()=>{LB.i=(LB.i+1)%LB.list.length;showLB();};
$('#lb').onclick=e=>{if(e.target.id==='lb')$('#lb').hidden=true;};
document.addEventListener('keydown',e=>{if($('#lb').hidden)return;if(e.key==='Escape')$('#lb').hidden=true;if(e.key==='ArrowLeft')$('#lbp').click();if(e.key==='ArrowRight')$('#lbn').click();});

/* ============ HOME ============ */
const ICON={
 key:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M7 12h10M10 18h4"/></svg>',
 map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>',
 grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>'
};
function home(){
  const pick=n=>K.species.find(s=>s.kitName===n);
  const tiles=['Phyllanthus emblica','Calamus hookerianus','Phyllanthus amarus','Calamus thwaitesii','Phyllanthus reticulatus','Calamus gamblei','Phyllanthus indofischeri'].map(pick).filter(Boolean);
  const nPhy=K.species.filter(s=>s.genus==='Phyllanthus').length, nRat=K.species.length-nPhy;
  const nLoc=K.species.reduce((a,s)=>a+s.localities.length,0), nImg=K.species.reduce((a,s)=>a+s.images.length,0);
  const nDNA=K.species.filter(s=>s.sequences.length).length;
  app.innerHTML=`
  <section class="hero">
    <div>
      <div class="eyebrow">Indian Barcode of Life · Field identification kit</div>
      <h1><i>Phyllanthus</i> <span class="amp">&amp;</span> Rattans</h1>
      <p>Name a plant from what you can see in the field: leaf, fruit, spines, sheath. Then explore its description, distribution across India and DNA barcode.</p>
      <div class="credit"><div><span class="muted">Proprietary right holder</span> <b>Dr. K.N. Ganeshaiah</b></div><div><span class="muted">Updated in 2026 by</span> <b>Dr. Sachin A. Rosario</b></div></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" type="button" data-go="identify">Start identifying</button><button class="btn" type="button" data-go="map">Open the map</button></div>
    </div>
    <div class="mosaic">${tiles.map((s,i)=>`<button type="button" class="m${i+1}" data-sp="${s.spid}"><img src="${photo(s)}" alt="${esc(s.name)}"><span>${esc(s.name)}</span></button>`).join('')}</div>
  </section>
  <section class="doors">
    <button class="door" type="button" data-go="identify"><span class="ic">${ICON.key}</span><h2>Identify a plant</h2><p>Answer a few questions about what you see. The kit suggests the most useful question each time and shows which species remain.</p><span class="go">Herbs, shrubs, trees and rattans →</span></button>
    <button class="door" type="button" data-go="map"><span class="ic">${ICON.map}</span><h2>Explore the map</h2><p>Every recorded locality across India on one map. Filter by group or species and open any record.</p><span class="go">${nLoc.toLocaleString('en-IN')} localities →</span></button>
    <button class="door" type="button" data-go="browse"><span class="ic">${ICON.grid}</span><h2>Browse species</h2><p>Photographs, herbarium sheets, descriptions, common names in Indian languages, uses and DNA barcodes.</p><span class="go">${K.species.length} species →</span></button>
  </section>
  <section class="stats">
    <div><b class="num">${nPhy}</b><span><i>Phyllanthus</i> species</span></div>
    <div><b class="num">${nRat}</b><span>rattan entries</span></div>
    <div><b class="num">${nImg}</b><span>photographs &amp; herbarium sheets</span></div>
    <div><b class="num">${nLoc.toLocaleString('en-IN')}</b><span>locality records</span></div>
    <div><b class="num">${nDNA}</b><span>species with DNA sequences</span></div>
  </section>`;
}

/* ============ IDENTIFY: choose group ============ */
function identify(){
  const pics={herb:'Phyllanthus amarus',shrub:'Phyllanthus reticulatus',tree:'Phyllanthus emblica',rattans:'Calamus gamblei'};
  app.innerHTML=`<div class="eyebrow">Identify</div><h1 style="font-family:var(--f-name);font-weight:500;font-size:clamp(30px,4vw,44px)">What are you looking at?</h1>
  <p class="muted" style="max-width:60ch">Each group has its own key. Pick the one that matches your plant.</p>
  <div class="groups">${Object.entries(GROUPS).map(([k,g])=>{const s=K.species.find(x=>x.kitName===pics[k]);const n=K.keys[k].records.length;const c=K.keys[k].chars.length;
    return `<button type="button" class="gcard" data-key="${k}"><img src="${photo(s)}" alt=""><div><span class="chip ${g.fam==='phy'?'tag-phy':'tag-rat'}">${g.fam==='phy'?'Phyllanthus':'Palms'}</span><h3 style="margin-top:8px">${esc(g.name)}</h3><p>${n} species · ${c} characters</p></div></button>`;}).join('')}</div>`;

/* ============ KEY EXPLORER ============
   Same rule as the 2010 program: each answer keeps species whose value equals the chosen value
   (ignoring case). "Can't say" skips a character. The best next character is the one whose answer
   leaves the fewest species on average. */
const KS={};
function candidates(K_,steps){return K_.records.filter(r=>steps.every(s=>s.value===null||low(r[s.field])===low(s.value)));}
function charStats(K_,left,field){
  const m=new Map();left.forEach(r=>{const v=r[field];if(!v||v==='-')return;const k=low(v);if(!m.has(k))m.set(k,{v,n:0});m.get(k).n++;});
  const known=[...m.values()].reduce((a,x)=>a+x.n,0);
  const exp=known?[...m.values()].reduce((a,x)=>a+x.n*x.n,0)/known:left.length;
  return {vals:[...m.values()],exp,split:m.size>1};
}
function keyView(k){
  const KK=K.keys[k]; const st=KS[k]||(KS[k]={steps:[],open:null});
  const G=GROUPS[k]; const isPhy=G.fam==='phy';
  document.documentElement.style.setProperty('--accent',isPhy?'var(--leaf)':'var(--cane)');
  document.documentElement.style.setProperty('--accent-ink',isPhy?'var(--leaf-ink)':'var(--cane-ink)');
  document.documentElement.style.setProperty('--accent-soft',isPhy?'var(--leaf-soft)':'var(--cane-soft)');
  const left=candidates(KK,st.steps); const total=KK.records.length;
  const done=new Set(st.steps.map(s=>s.field));
  const open=KK.chars.filter(c=>!done.has(c.field)).map(c=>({c,...charStats(KK,left,c.field)}));
  const useful=open.filter(o=>o.split).sort((a,b)=>a.exp-b.exp);
  const best=useful[0]?.c.field;
  if(!st.open||done.has(st.open)) st.open=left.length>1?best:null;
  const cur=open.find(o=>o.c.field===st.open);
  const ruled=KK.records.filter(r=>!left.includes(r));

  let question='';
  if(left.length===1){
    const s=S[left[0].spid];
    question=`<div class="done"><img src="${photo(s)}" alt=""><div style="flex:1;min-width:200px"><div class="eyebrow">Identified</div><h2 class="bn">${esc(s.name)}</h2><p class="muted" style="margin:4px 0 12px">${st.steps.filter(x=>x.value!==null).length} characters matched. Check the description and photographs to confirm.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn primary" data-sp="${s.spid}">Open species page</button><button type="button" class="btn" id="kreset">Identify another</button></div></div></div>`;
  } else if(left.length===0){
    question=`<div class="q"><h2>No species match these answers</h2><p class="hint">One answer may be wrong, or the plant may not be in this kit. Go back one step or remove an answer on the left.</p><div style="margin-top:14px"><button type="button" class="btn primary" id="kundo2">Go back one step</button></div></div>`;
  } else if(cur){
    const pics=cur.c.pictures;
    question=`<div class="q"><div class="q-top"><div><div class="eyebrow">${cur.c.field===best?'Best next question':'Question'}</div><h2>${gloss(low(cur.c.label),cur.c.label)}</h2><p class="hint">${cur.split?'Pick what your plant shows. The number tells you how many species would remain.':'All remaining species are the same for this character, so it will not narrow the list.'}</p></div></div>
    <div class="opts">${cur.vals.sort((a,b)=>a.v.localeCompare(b.v)).map(o=>`<button type="button" class="opt" data-v="${esc(o.v)}">${pics[low(o.v)]?`<img src="${pics[low(o.v)]}" alt="" loading="lazy">`:''}<div><b>${gloss(o.v)}</b><small class="num">${o.n} left</small></div></button>`).join('')}
    <button type="button" class="opt skip" data-skip="1"><b>Can't say</b><small>Skip this character</small></button></div></div>`;
  } else {
    question=`<div class="q"><h2>No character can separate the remaining species</h2><p class="hint">Compare them side by side to decide.</p><div style="margin-top:12px"><button type="button" class="btn primary" id="kcmp">Compare these ${left.length}</button></div></div>`;
  }

  app.innerHTML=`
  <div class="kx-head"><div><div class="eyebrow"><button type="button" class="btn ghost" data-go="identify" style="padding:2px 8px;font-size:12px">← All groups</button></div><h1>${esc(G.name)}</h1></div>
    <div class="meter"><b class="num">${left.length}</b><span class="muted">of ${total} species remain</span></div></div>
  <div class="bar"><i style="width:${total?Math.max(4,100*(total-left.length)/(total-1||1)):0}%"></i></div>
  <div class="kx">
    <aside class="rail" aria-label="Characters">
      ${st.steps.length?`<h3>Your answers</h3><div class="answered">${st.steps.map((s,i)=>{const c=KK.chars.find(x=>x.field===s.field);return `<button type="button" class="chip" data-rm="${i}" title="Remove this answer"><span class="muted">${esc(c.label)}:</span> <b>${s.value===null?"Can't say":esc(s.value)}</b> ×</button>`;}).join('')}</div>`:''}
      <h3>Characters to check</h3>
      ${open.sort((a,b)=>(b.split-a.split)||(a.exp-b.exp)).map(o=>`<button type="button" class="ch ${o.c.field===st.open?'on':''} ${o.split?'':'flat'}" data-ch="${o.c.field}"><span>${esc(o.c.label)}<br><span class="why">${o.split?`${o.vals.length} options`:'no difference left'}</span></span>${o.c.field===best?'<span class="best">Best next</span>':''}</button>`).join('')||'<p class="muted" style="padding:0 6px">All characters answered.</p>'}
      <div class="railfoot"><button type="button" class="btn" id="kundo" ${st.steps.length?'':'disabled'}>Undo</button><button type="button" class="btn" id="kclear" ${st.steps.length?'':'disabled'}>Start over</button></div>
    </aside>
    <section>
      ${question}
      <div class="cands-h"><h3>${left.length===1?'Your plant':`Possible species · ${left.length}`}</h3>${left.length>1&&left.length<=3?`<button type="button" class="btn" id="kcmp2">Compare these ${left.length}</button>`:''}</div>
      <div class="grid">${left.map(r=>spCard(S[r.spid])).join('')}</div>
      ${ruled.length?`<details class="ruled"><summary>Ruled out · ${ruled.length}</summary><div class="grid">${ruled.map(r=>spCard(S[r.spid],'out')).join('')}</div></details>`:''}
    </section>
  </div>`;
  app.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{st.open=b.dataset.ch;keyView(k);app.querySelector('.q')?.scrollIntoView({behavior:'smooth',block:'nearest'});});
  app.querySelectorAll('.opt').forEach(b=>b.onclick=e=>{if(e.target.closest('.term'))return;st.steps.push({field:st.open,value:b.dataset.skip?null:b.dataset.v});st.open=null;keyView(k);});
  app.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{st.steps.splice(+b.dataset.rm,1);st.open=null;keyView(k);});
  const undo=()=>{st.steps.pop();st.open=null;keyView(k);};
  $('#kundo')&&($('#kundo').onclick=undo); $('#kundo2')&&($('#kundo2').onclick=undo);
  $('#kclear')&&($('#kclear').onclick=()=>{st.steps=[];st.open=null;keyView(k);});
  $('#kreset')&&($('#kreset').onclick=()=>{st.steps=[];st.open=null;keyView(k);});
  const cmp=()=>{CMP=left.slice(0,3).map(r=>r.spid);go({name:'compare'});};
  $('#kcmp')&&($('#kcmp').onclick=cmp); $('#kcmp2')&&($('#kcmp2').onclick=cmp);
}

function genbank(s){

  return `<div class="card" style="margin-bottom:6px"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline"><h3 style="margin:0">GenBank (NCBI) records</h3><span class="muted" style="font-size:13px">Checked ${esc(n.checked)}</span></div>
  <p class="muted" style="font-size:14px;margin:6px 0 12px">${n.total?`<b class="num" style="color:var(--ink)">${n.total.toLocaleString('en-IN')}</b> nucleotide records`:'No nucleotide records'} for ${n.terms.map(t=>`<i>${esc(t)}</i>`).join(' or ')}. NCBI files this species as <i>${esc(n.ncbiName||'—')}</i>${n.taxid?` (taxonomy ID ${esc(n.taxid)})`:''}.${n.note?' '+esc(n.note):''}</p>
  ${n.total?`<div class="tablebox" style="max-width:460px"><table><thead><tr><th>Barcode marker</th><th>Records</th><th></th></tr></thead><tbody>${cell('rbcL','rbcL','rbcL[All Fields]')}${cell('matK','matK','matK[All Fields]')}${cell('ITS','ITS (nuclear)','"internal transcribed spacer"[All Fields]')}${cell('psbA','psbA-trnH','psbA[All Fields] AND trnH[All Fields]')}</tbody></table></div>
  <p style="margin:10px 0 0"><a class="btn" href="https://www.ncbi.nlm.nih.gov/nuccore/?term=${term}" target="_blank" rel="noopener" style="padding:6px 12px;font-size:14px">All ${n.total.toLocaleString('en-IN')} records on NCBI</a></p>`:''}</div>`;
}
function colorBases(t){return esc(t).replace(/(\s)([ACGTN?.]{8,})/g,(m,sp,seq)=>sp+seq.replace(/[ACGT]/g,b=>`<span class="b-${b}">${b}</span>`));}
function drawSeq(cv){
  const q=cv.dataset.seq,w=cv.clientWidth||600,h=30,dpr=window.devicePixelRatio||1;cv.width=w*dpr;cv.height=h*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement),col={A:cs.getPropertyValue('--A'),C:cs.getPropertyValue('--C'),G:cs.getPropertyValue('--G'),T:cs.getPropertyValue('--T')},n=cs.getPropertyValue('--N');
  const bw=w/q.length;for(let i=0;i<q.length;i++){g.fillStyle=col[q[i]]||n;g.fillRect(i*bw,0,Math.ceil(bw),h);}
}

/* ============ MAP ============ */
const LON0=67,LON1=98,LAT0=6,LAT1=37.5,KX=Math.cos(22*Math.PI/180);
const W=(LON1-LON0)*KX*30, H=(LAT1-LAT0)*30;
const px=(lon,lat)=>[(lon-LON0)*KX*30,(LAT1-lat)*30];
let LAND='';
function buildLand(){
  const ring=r=>r.map((c,i)=>{const [x,y]=px(c[0],c[1]);return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);}).join('')+'Z';
  const path=g=>(g.type==='Polygon'?[g.coordinates]:g.coordinates).map(p=>p.map(ring).join('')).join('');
  const india=MAP.features.find(f=>f.properties.kind==='india');
  const states=MAP.features.filter(f=>f.properties.kind==='state');
  LAND=`<path d="${path(india.geometry)}" fill="var(--map-land)" stroke="none"/>`+
       `<g fill="none" stroke="var(--map-line)" stroke-width="0.7" vector-effect="non-scaling-stroke">${states.map(f=>`<path d="${path(f.geometry)}"><title>${esc(f.properties.name)}</title></path>`).join('')}</g>`+
       `<path d="${path(india.geometry)}" fill="none" stroke="var(--muted)" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
}
function drawMap(box,pts,opt={}){
  let vb=[0,0,W,H];
  if(opt.fit&&pts.length){
    const xs=pts.map(p=>px(p.lon,p.lat));const minx=Math.min(...xs.map(p=>p[0])),maxx=Math.max(...xs.map(p=>p[0])),miny=Math.min(...xs.map(p=>p[1])),maxy=Math.max(...xs.map(p=>p[1]));
    let w=Math.max(maxx-minx,160),h=Math.max(maxy-miny,160);const cx=(minx+maxx)/2,cy=(miny+maxy)/2;w*=1.35;h*=1.35;
    const ar=W/H; if(w/h>ar)h=w/ar;else w=h*ar; vb=[cx-w/2,cy-h/2,w,h];
    if(w>W){vb=[0,0,W,H];}
  }
  const r0=()=>Math.max(1.6,vb[2]/170);
  box.innerHTML=`<svg viewBox="${vb.join(' ')}" role="img" aria-label="Map of India with ${pts.length} locality points">${LAND}<g id="pts"></g></svg>
   <div class="mapctl"><button type="button" data-z="in" aria-label="Zoom in">+</button><button type="button" data-z="out" aria-label="Zoom out">−</button><button type="button" data-z="all" aria-label="Show all of India">⤢</button></div>
   <div class="maptip" hidden></div>
   <div class="mapnote"><span>${pts.length} point${pts.length===1?'':'s'}${opt.legend||''}</span><span>Drag to move · scroll or +/− to zoom</span></div>`;
  const svg=box.querySelector('svg'), g=box.querySelector('#pts'), tip=box.querySelector('.maptip');
  const paint=()=>{const r=r0();g.innerHTML=pts.map((p,i)=>{const [x,y]=px(p.lon,p.lat);const c=p.s.genus==='Phyllanthus'?'var(--leaf)':'var(--cane)';return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" fill="${c}" fill-opacity=".8" stroke="var(--surface)" stroke-width="${(r/3).toFixed(2)}" data-pi="${i}"/>`;}).join('');};
  const setVB=()=>{svg.setAttribute('viewBox',vb.join(' '));paint();};
  paint();
  const zoom=(f,cx,cy)=>{const nw=Math.min(W*1.2,Math.max(30,vb[2]*f)),nh=nw*vb[3]/vb[2];cx??=vb[0]+vb[2]/2;cy??=vb[1]+vb[3]/2;vb=[cx-(cx-vb[0])*nw/vb[2],cy-(cy-vb[1])*nh/vb[3],nw,nh];setVB();};
  box.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{const z=b.dataset.z;if(z==='in')zoom(.6);else if(z==='out')zoom(1.6);else{vb=[0,0,W,H];setVB();}});
  const toSvg=e=>{const r=svg.getBoundingClientRect();return [vb[0]+(e.clientX-r.left)/r.width*vb[2],vb[1]+(e.clientY-r.top)/r.height*vb[3]];};
  svg.addEventListener('wheel',e=>{e.preventDefault();const [x,y]=toSvg(e);zoom(e.deltaY<0?.8:1.25,x,y);},{passive:false});
  let drag=null;
  svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vb:[...vb],moved:false,pt:e.target.closest('circle')};svg.setPointerCapture(e.pointerId);});
  svg.addEventListener('pointermove',e=>{
    if(drag){const r=svg.getBoundingClientRect();const dx=(e.clientX-drag.x)/r.width*vb[2],dy=(e.clientY-drag.y)/r.height*vb[3];if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>4)drag.moved=true;vb=[drag.vb[0]-dx,drag.vb[1]-dy,vb[2],vb[3]];svg.setAttribute('viewBox',vb.join(' '));tip.hidden=true;return;}
    const c=e.target.closest('circle');if(!c){tip.hidden=true;return;}
    const p=pts[+c.dataset.pi];const br=box.getBoundingClientRect();tip.innerHTML=`<span class="bn">${esc(p.s.name)}</span><br>${esc(p.l.location)}, ${esc(p.l.district)}`;tip.style.left=(e.clientX-br.left)+'px';tip.style.top=(e.clientY-br.top)+'px';tip.hidden=false;
  });
  svg.addEventListener('pointerup',e=>{const d=drag;drag=null;if(!d||d.moved)return;const c=d.pt;if(c&&opt.onPick)opt.onPick(pts[+c.dataset.pi]);}); // the map holds the pointer while pressed, so the dot is the one pressed at pointerdown
  svg.addEventListener('pointerleave',()=>{tip.hidden=true;});
}
let MF={grp:'all',sp:''};
function mapView(){
  const all=K.species.flatMap(s=>s.localities.map(l=>({lat:+l.lat,lon:+l.long,s,l})));
  const pts=all.filter(p=>(MF.grp==='all'||(MF.grp==='phy')===(p.s.genus==='Phyllanthus'))&&(!MF.sp||p.s.spid===+MF.sp));
  const withLoc=K.species.filter(s=>s.localities.length).sort((a,b)=>a.name.localeCompare(b.name));
  const counts={};pts.forEach(p=>counts[p.s.spid]=(counts[p.s.spid]||0)+1);
  app.innerHTML=`<div class="eyebrow">Distribution</div><h1 style="font-family:var(--f-name);font-weight:500;font-size:clamp(30px,4vw,44px)">Where they grow</h1>
  <div class="filters"><div class="seg" role="group" aria-label="Group">${[['all','All'],['phy','Phyllanthus'],['rat','Rattans']].map(([k,l])=>`<button type="button" data-g="${k}" class="${MF.grp===k?'on':''}">${l}</button>`).join('')}</div>
  <div class="legend"><span><i class="dot" style="background:var(--leaf)"></i><i>Phyllanthus</i></span><span><i class="dot" style="background:var(--cane)"></i>Rattans</span></div></div>
  <div class="maplayout"><div class="mapbox" id="bigmap"></div>
  <aside class="sidepanel"><label class="eyebrow" for="mapsp">Show one species</label>
    <select id="mapsp" style="margin:6px 0 12px"><option value="">All species</option>${withLoc.filter(s=>MF.grp==='all'||(MF.grp==='phy')===(s.genus==='Phyllanthus')).map(s=>`<option value="${s.spid}" ${+MF.sp===s.spid?'selected':''}>${esc(s.name)} (${s.localities.length})</option>`).join('')}</select>
    ${exportButtons('map')}
    <div class="eyebrow" style="margin:14px 0 6px">Species on the map · ${Object.keys(counts).length}</div>
    ${Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([id,n])=>`<button type="button" class="ch" data-sp="${id}"><span class="bn">${esc(S[id].name)}</span><span class="why num">${n}</span></button>`).join('')}
    <p class="muted" style="font-size:12px;margin-top:10px">${K.species.length-withLoc.length} species have no locality records in the original kit.</p>
  </aside></div>`;
  app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{MF.grp=b.dataset.g;MF.sp='';mapView();});
  $('#mapsp').onchange=e=>{MF.sp=e.target.value;mapView();};
  drawMap($('#bigmap'),pts,{fit:!!MF.sp,onPick:p=>go({name:'species',id:p.s.spid,tab:'dist'})});
  wireExport('map',()=>pts);
}
function exportButtons(id){
  return canDownload()?`<div class="eyebrow" style="margin-bottom:6px">Export for GIS</div><div style="display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="btn" data-ex="${id}:geojson" style="padding:6px 10px;font-size:13px">GeoJSON</button><button type="button" class="btn" data-ex="${id}:kml" style="padding:6px 10px;font-size:13px">KML</button><button type="button" class="btn" data-ex="${id}:csv" style="padding:6px 10px;font-size:13px">CSV</button></div>`
  :`<p class="muted" style="font-size:13px;margin:0">GIS export (GeoJSON, KML, CSV for QGIS or ArcGIS) is available in the installed app and the published web version.</p>`;
}
function wireExport(id,getPts){
  app.querySelectorAll(`[data-ex^="${id}:"]`).forEach(b=>b.onclick=()=>{
    const fmt=b.dataset.ex.split(':')[1], pts=getPts(), stamp='phyllanthus-rattans-localities';
    let txt,type;
    if(fmt==='geojson'){txt=JSON.stringify({type:'FeatureCollection',features:pts.map(p=>({type:'Feature',properties:{species:p.s.name,kit_name_2010:p.s.kitName,spid:p.s.spid,location:p.l.location,district:p.l.district},geometry:{type:'Point',coordinates:[p.lon,p.lat]}}))},null,1);type='application/geo+json';}
    if(fmt==='kml'){txt=`<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${stamp}</name>${pts.map(p=>`<Placemark><name>${esc(p.s.name)}</name><description>${esc(p.l.location+', '+p.l.district)}</description><Point><coordinates>${p.lon},${p.lat}</coordinates></Point></Placemark>`).join('')}</Document></kml>`;type='application/vnd.google-earth.kml+xml';}
    if(fmt==='csv'){const q=v=>`"${String(v).replace(/"/g,'""')}"`;txt='species,kit_name_2010,spid,location,district,latitude,longitude\n'+pts.map(p=>[q(p.s.name),q(p.s.kitName),p.s.spid,q(p.l.location),q(p.l.district),p.lat,p.lon].join(',')).join('\n');type='text/csv';}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=`${stamp}.${fmt}`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  });
}

/* ============ BROWSE ============ */
let BF={grp:'all',sort:'az'};
function browse(){
  let list=K.species.filter(s=>BF.grp==='all'||(BF.grp==='phy')===(s.genus==='Phyllanthus'));
  list=[...list].sort(BF.sort==='az'?(a,b)=>a.name.localeCompare(b.name):(a,b)=>b.localities.length-a.localities.length||a.name.localeCompare(b.name));
  app.innerHTML=`<div class="eyebrow">Species</div><h1 style="font-family:var(--f-name);font-weight:500;font-size:clamp(30px,4vw,44px)">All ${K.species.length} species</h1>
  <div class="filters"><div class="seg" role="group" aria-label="Group">${[['all','All'],['phy','Phyllanthus'],['rat','Rattans']].map(([k,l])=>`<button type="button" data-g="${k}" class="${BF.grp===k?'on':''}">${l}</button>`).join('')}</div>
  <div class="seg" role="group" aria-label="Sort">${[['az','A–Z'],['loc','Most recorded']].map(([k,l])=>`<button type="button" data-s="${k}" class="${BF.sort===k?'on':''}">${l}</button>`).join('')}</div><span class="muted">${list.length} shown</span></div>
  <div class="grid">${list.map(s=>spCard(s)).join('')}</div>`;
  app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{BF.grp=b.dataset.g;browse();});
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{BF.sort=b.dataset.s;browse();});
}

/* ============ COMPARE ============ */
let CMP=[];
function rankSimilar(id,peers){const g=groupOf(S[id]);if(!g)return peers;const KK=K.keys[g];const r0=KK.records.find(r=>r.spid===id);
  return peers.map(p=>{const r=KK.records.find(x=>x.spid===p);const same=KK.chars.filter(c=>low(r[c.field])===low(r0[c.field])).length;return [p,same];}).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);}
function compare(){
  if(!CMP.length){const a=K.species.find(s=>s.kitName==='Phyllanthus amarus');CMP=[a.spid,...rankSimilar(a.spid,K.keys.herb.records.map(r=>r.spid).filter(x=>x!==a.spid)).slice(0,2)];}
  const sp=CMP.map(id=>S[id]);
  const groups=[...new Set(sp.map(groupOf))];
  const chars=groups.flatMap(g=>g?K.keys[g].chars:[]).filter((c,i,a)=>a.findIndex(x=>x.field===c.field&&x.label===c.label)===i);
  const val=(s,c)=>{const r=recOf(s);return r&&r[c.field]!==undefined?r[c.field]:'—';};
  const sorted=[...K.species].sort((a,b)=>a.name.localeCompare(b.name));
  const row=(label,cells,diff)=>`<tr><td>${label}</td>${cells.map(c=>`<td class="${diff?'diff':''}">${c}</td>`).join('')}</tr>`;
  app.innerHTML=`<div class="eyebrow">Compare</div><h1 style="font-family:var(--f-name);font-weight:500;font-size:clamp(30px,4vw,44px)">Side by side</h1>
  <p class="muted" style="max-width:62ch">Characters that differ are highlighted. These are the ones to check on your plant.</p>
  <div class="picker">${[0,1,2].map(i=>`<select data-ci="${i}" aria-label="Species ${i+1}"><option value="">${i?'Add a species':'Choose a species'}</option>${sorted.map(s=>`<option value="${s.spid}" ${CMP[i]===s.spid?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`).join('')}</div>
  <div class="cmp"><table><thead><tr><th></th>${sp.map(s=>`<th><button type="button" data-sp="${s.spid}" style="background:none;border:0;padding:0;cursor:pointer;text-align:left">${photo(s)?`<img src="${photo(s)}" alt="">`:''}<span class="bn" style="font-size:18px;display:block;margin-top:8px;color:var(--ink);text-transform:none;letter-spacing:0">${esc(s.name)}</span></button></th>`).join('')}</tr></thead><tbody>
  ${chars.map(c=>{const v=sp.map(s=>val(s,c));const d=new Set(v.map(low)).size>1;return row(esc(c.label),v.map(x=>gloss(x)),d);}).join('')}
  ${row('Flowering',sp.map(s=>esc(s.flowering||'—')),false)}
  ${row('Habitat',sp.map(s=>esc(s.habitat||'—')),false)}
  ${row('Localities',sp.map(s=>s.localities.length),false)}
  ${row('DNA sequences',sp.map(s=>s.sequences.length||'—'),false)}
  </tbody></table></div>`;
  app.querySelectorAll('[data-ci]').forEach(sel=>sel.onchange=()=>{const v=[...app.querySelectorAll('[data-ci]')].map(x=>+x.value).filter(Boolean);CMP=[...new Set(v)];compare();});
}

  const items=Object.values(GLOSS).filter((g,i,a)=>a.findIndex(x=>x[0]===g[0])===i).sort((a,b)=>a[0].localeCompare(b[0]));
  app.innerHTML=`<div class="eyebrow">Glossary</div><h1 style="font-family:var(--f-name);font-weight:500;font-size:clamp(30px,4vw,44px)">Terms used in the keys</h1>
  <p class="muted" style="max-width:64ch">Every underlined word in the kit opens its meaning. These ${items.length} definitions were written for Version 2 and are awaiting expert review.</p>
  <div class="gloss" style="margin-top:18px">${items.map(([t,d])=>`<div><b>${esc(t)}</b><p>${esc(d)}</p></div>`).join('')}</div>`;
}

/* ============ start ============ */
Promise.all([
  window.KIT_DATA?Promise.resolve(window.KIT_DATA):fetch('data/kit.json').then(r=>{if(!r.ok)throw new Error('kit '+r.status);return r.json();}),
  window.MAP_DATA?Promise.resolve(window.MAP_DATA):fetch('data/india.geojson').then(r=>{if(!r.ok)throw new Error('map '+r.status);return r.json();})

 .catch(e=>{app.innerHTML=`<p>The kit could not be loaded (${esc(e.message)}). Reload the page to try again.</p>`;});
