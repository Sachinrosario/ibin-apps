<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Andaman Mapping 2</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a6b5a">
<style>
:root{--g:#0a6b5a;--g2:#0d8a73;--gd:#074c40;--ink:#1b2a25;--mut:#5b6b65;--bg:#f5f3ec;--card:#fff;--line:#dcd8cb;--acc:#b3541e;--soft:#e6f2ee;--warn:#fff4dd;--warnl:#e8c97a}
@media (prefers-color-scheme:dark){:root{--g:#37b79c;--g2:#2a9f86;--gd:#9be0cf;--ink:#e8eeeb;--mut:#a3b3ad;--bg:#10171a;--card:#182125;--line:#2b3a3f;--acc:#f0a070;--soft:#173a33;--warn:#3a3118;--warnl:#7a6a2c}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
a{color:var(--g)}
img{max-width:100%}
.top{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 16px;padding-left:max(16px,env(safe-area-inset-left));flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;margin-right:auto}
.brand img{width:38px;height:38px;border-radius:9px}
.brand b{display:block;font:700 19px/1.1 Georgia,"Spectral",serif}
.brand small{display:block;font-size:12px;opacity:.85}
.top nav{display:flex;gap:2px;flex-wrap:wrap}
.top nav a{color:#fff;text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:600;font-size:15px}
.top nav a.on,.top nav a:hover{background:rgba(255,255,255,.18)}
main{max-width:1180px;margin:0 auto;padding:16px 16px 40px}
h1{font:700 26px/1.2 Georgia,"Spectral",serif;margin:8px 0 4px;color:var(--gd)}
h2{font:700 20px/1.25 Georgia,"Spectral",serif;margin:26px 0 8px;color:var(--gd)}
.lead{color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.note{background:var(--warn);border:1px solid var(--warnl);border-radius:10px;padding:10px 14px;margin:12px 0;font-size:15px}
.note.ok{background:var(--soft);border-color:var(--g2)}
.btn{display:inline-block;background:var(--g);color:#fff;border:0;border-radius:9px;padding:9px 14px;font:600 15px/1.2 inherit;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--g2)}
.btn.alt{background:transparent;color:var(--g);border:1.5px solid var(--g)}
.btn.sm{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font:600 14px/1.2 inherit;cursor:pointer}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.srch{display:flex;gap:8px;margin:10px 0}
.srch input{flex:1;font:inherit;font-size:18px;padding:12px 14px;border:2px solid var(--g);border-radius:12px;background:var(--card);color:var(--ink);min-width:0}
select,.fi{font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);max-width:100%}
.res{list-style:none;margin:10px 0;padding:0;display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.res a{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;text-decoration:none;color:var(--ink);height:100%}
.res a:hover{border-color:var(--g)}
.res img{width:64px;height:64px;object-fit:cover;border-radius:8px;background:var(--soft);flex:none}
.res .t{font-style:italic;font-weight:700;color:var(--gd)}
.res .s{font-size:13.5px;color:var(--mut)}
.badge{display:inline-block;font:600 12px/1 inherit;padding:3px 7px;border-radius:6px;background:var(--soft);color:var(--gd);margin-right:4px}
.badge.w{background:var(--warn);color:var(--ink);border:1px solid var(--warnl)}
.hero{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:18px;align-items:start}
.hero figure{margin:0}
.hero img{width:100%;border-radius:12px;display:block;background:var(--soft)}
.hero figcaption{font-size:13px;color:var(--mut);margin-top:4px}
.sci{font:italic 700 28px/1.2 Georgia,"Spectral",serif;color:var(--gd);margin:4px 0}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:8px 0}
.kv dt{color:var(--mut)}.kv dd{margin:0}
table.t{border-collapse:collapse;width:100%;font-size:15px}
table.t th{background:var(--soft);color:var(--gd);text-align:left;padding:6px 10px;position:sticky;top:0}
table.t td{padding:5px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tw{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.map{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#a9d6ea;touch-action:none}
.map canvas{display:block;width:100%;height:100%;cursor:grab}
.map .ctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.map .ctl button{width:36px;height:36px;border-radius:8px;border:1px solid #888;background:rgba(255,255,255,.92);font:700 18px/1 inherit;cursor:pointer;color:#111}
.leg{font-size:12.5px;background:rgba(255,255,255,.92);color:#111;border:1px solid #999;border-radius:8px;padding:5px 8px;position:absolute;left:8px;bottom:8px;max-width:60%}
.leg i{display:inline-block;width:13px;height:11px;margin-right:4px;border:1px solid #555;vertical-align:-1px}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.mapcol .map{height:min(74vh,720px)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile b{display:block;font:700 26px/1.1 Georgia,serif;color:var(--gd)}
.tile span{font-size:13.5px;color:var(--mut)}
.list{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.list a{display:block;padding:6px 12px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-style:italic}
.list a:hover{background:var(--soft)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
footer{border-top:1px solid var(--line);padding:16px;text-align:center;color:var(--mut);font-size:14px}
.sim{display:flex;gap:8px;flex-wrap:wrap}
.sim a{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 10px;text-decoration:none;font-style:italic;color:var(--gd)}
.cn{columns:2 240px;column-gap:24px}
.cn p{margin:0 0 8px;break-inside:avoid}
.old{color:var(--mut);font-weight:400}
.sci .old{font-size:.68em}
.cols>*,.hero>*{min-width:0}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}.cols{grid-template-columns:minmax(0,1fr)}.mapcol .map{height:56vh}.sci{font-size:23px}.res{grid-template-columns:1fr}.brand small{display:none}h1{font-size:23px}}
@media print{.top,footer,.srch,.ctl{display:none}}
</style></head>
<body>
<header class="top">
  <a class="brand" href="#/"><img src="img/ui/icon.png" alt=""><span><b>Andaman Mapping</b><small>Plants of the Andaman Islands · Version 2</small></span></a>
  <nav id="nav"><a href="#/" data-r="search">Search</a><a href="#/map" data-r="map">Map</a><a href="#/changes" data-r="changes">What's changed</a><a href="#/about" data-r="about">About</a></nav>
</header>
<main id="app"><p class="lead">Loading…</p></main>
<footer>
  Proprietary right holder: Dr. K.N. Ganeshaiah · Updated in 2026 by Dr. Sachin A. Rosario · IBIN Apps<br>
  <b>Pictures:</b> this app shows one picture per plant so that it stays small and works offline.
</footer>
<script src="data/media-base.js"></script>
<script src="data/core.js"></script>
<script src="data/detail.js"></script>
<script src="data/images.js"></script>
<script src="data/map.js"></script>
<script src="data/names.js"></script>
<script>
"use strict";
const C = AM_CORE, D = AM_DETAIL, IM = AM_IMAGES, M = AM_MAP, NM = AM_NAMES;
const MB = window.MEDIA_BASE || '';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const plural = (n, a, b) => n.toLocaleString() + ' ' + (n === 1 ? a : b);
const clean = v => (v == null || String(v).toLowerCase() === 'none' || v === '-') ? '' : String(v);
const HAB = {tree:'Tree', herb:'Herb', shrub:'Shrub', epiphyte:'Epiphyte', regeneration:'Regeneration'};
const HAB_KEYS = ['tree','herb','shrub','epiphyte','regeneration'];

/* ---------- species ---------- */
// All original images and fliers: the installed programs fetch each picture by themselves from the public Pictures and Fliers
// pack on the IBIN Apps releases page the first time it is shown, and keep it on the computer
// (Windows: served at pack/; Mac and Ubuntu: ibinpack://). The web page has no access to the pack.
const PKBASE = location.protocol === 'tauri:' ? 'ibinpack://localhost/' : location.hostname === 'tauri.localhost' ? 'http://ibinpack.localhost/' : 'pack/';
const pkUrl = rel => PKBASE + rel.split('/').map(encodeURIComponent).join('/');
const pkDesktop = PKBASE !== 'pack/' || /^127\.0\.0\.1$/.test(location.hostname);
function pkLight(src) { let b = document.getElementById('pklb'); if (!b) { b = document.createElement('div'); b.id = 'pklb'; b.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:9999;cursor:zoom-out'; b.innerHTML = '<img alt="" style="max-width:96vw;max-height:94vh">'; b.onclick = () => b.style.display = 'none'; document.body.appendChild(b); } b.firstChild.src = src; b.style.display = 'flex'; }
function pkGallery(box, rows, flierName) {
  if (!pkDesktop) { box.innerHTML = '<div class="note">All the original images and the complete flier show in the installed program (Windows, Mac or Ubuntu, from the IBIN Apps page), which fetches them by itself. They can also be downloaded as the Pictures and Fliers pack from the IBIN Apps releases page.</div>'; return; }
  const names = { F: 'Field photographs', H: 'Herbarium images', L: 'Line diagrams', P: 'Paintings' };
  const fig = rel => `<figure style="display:inline-block;margin:4px;width:170px;vertical-align:top"><img loading="lazy" src="${esc(pkUrl(rel))}" alt="" onerror="this.closest('figure').style.display='none'" onclick="pkLight(this.src)" style="width:170px;height:130px;object-fit:cover;border-radius:6px;background:#eee;cursor:zoom-in"><figcaption class="lead" style="font-size:12px;word-break:break-word">${esc(rel.split('/').pop().replace(/\.[^.]+$/, ''))}</figcaption></figure>`;
  let h = '';
  for (const k of Object.keys(names)) { const rs = rows.filter(r => r[0] === k); if (rs.length) h += `<h3>${names[k]} (${rs.length})</h3><div>` + rs.map(r => fig('Images/' + r[2])).join('') + '</div>'; }
  if (flierName) h += `<h3>Flier</h3><div id="pkFl"></div>`;
  box.innerHTML = h || '<div class="card">No pictures.</div>';
  if (flierName) { const add = k => { if (k > 60) return; const i = new Image();
    i.onload = () => { const f = document.createElement('figure'); f.style.cssText = 'margin:6px 0;max-width:520px'; i.style.cssText = 'width:100%;border-radius:8px;cursor:zoom-in'; i.onclick = () => pkLight(i.src); f.appendChild(i); const c = document.createElement('figcaption'); c.className = 'lead'; c.textContent = 'Slide ' + k; f.appendChild(c); const g = document.getElementById('pkFl'); if (g) { g.appendChild(f); add(k + 1); } };
    i.onerror = () => {}; i.src = pkUrl('Fliers/' + flierName + '/Slide' + k + '.JPG'); }; add(1); }
}

const SP = C.sp.map(r => {
  const id = r[0], n = NM.n[id] || null, name15 = r[2];
  const s = {id, genus: r[1], name15, fam: C.fams[r[3]], hab: r[4].map(i => C.habits[i]), mask: r[5], fl: r[6], rep: r[7], code: n ? n[0] : 0};
  s.cur = n && n[0] === 2 ? n[1] : name15;
  s.auth = n && n[0] !== 3 ? n[2] : ''; s.key = n && n[3] ? n[3] : ''; s.gfam = n && n[0] !== 3 ? n[4] : ''; s.sug = n && n[0] === 3 ? n[1] : ''; s.why = n && n[0] === 3 ? n[2] : '';
  s.changed = s.cur !== name15;
  const dd = D.d[id] || [[], [], [], []];
  s.cm = dd[0]; s.syn = dd[1];
  s.fCur = fold(s.cur); s.f15 = fold(name15); s.fGen = fold(s.genus); s.fFam = fold(s.fam);
  s.fCm = fold(s.cm.map(c => c[1]).join(' | ')); s.fSyn = fold(s.syn.map(x => x[0]).join(' | '));
  s.hay = [s.fCur, s.f15, s.fGen, s.fFam, s.hab.join(' '), s.fCm, s.fSyn].join(' | ');
  return s;
});
const byId = new Map(SP.map(s => [s.id, s]));
const GEN = new Map(), FAM = new Map();
SP.forEach(s => { (GEN.get(s.genus) || GEN.set(s.genus, []).get(s.genus)).push(s); (FAM.get(s.fam) || FAM.set(s.fam, []).get(s.fam)).push(s); });
SP.sort((a, b) => a.cur.localeCompare(b.cur));
// Rule for every updated name: the current accepted name first, the 2015 name kept beside it in brackets
const nameTxt = s => s.changed ? `${s.cur} (${s.name15})` : s.cur;
const nameHtml = s => s.changed ? `<i>${esc(s.cur)}</i> <span class="old">(<i>${esc(s.name15)}</i>)</span>` : `<i>${esc(s.cur)}</i>`;
const picOf = s => {
  if (s.rep) return {src: MB + 'img/s/' + s.id + '.webp', cap: 'Representative picture', own: true};
  const r = (GEN.get(s.genus) || []).find(x => x.rep) || (FAM.get(s.fam) || []).find(x => x.rep);
  return r ? {src: MB + 'img/s/' + r.id + '.webp', cap: 'No picture of this species. Shown: ' + nameTxt(r) + ' (' + (r.genus === s.genus ? 'same genus' : 'same family') + ')', own: false} : null;
};
const NOPIC = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><rect width="200" height="200" fill="#dfeee8"/><path d="M100 160V80M100 120c-34-6-48-30-48-54 28 3 48 22 48 54zm0-10c28-3 46-20 48-44-26 3-46 18-48 44z" fill="#7fb08a" stroke="#3f7a52" stroke-width="3"/></svg>');
const thumbSrc = s => s.rep ? MB + 'img/s/' + s.id + '.webp' : NOPIC;

/* ---------- search ---------- */
const st = {q: '', hab: '', fam: '', pic: false, shown: 40};
function search() {
  const toks = fold(st.q).split(/\s+/).filter(Boolean);
  let out = [];
  for (const s of SP) {
    if (st.hab && !s.hab.includes(st.hab)) continue;
    if (st.fam && s.fam !== st.fam) continue;
    if (st.pic && !s.rep) continue;
    let score = 0, ok = true;
    for (const t of toks) {
      if (!s.hay.includes(t)) { ok = false; break; }
      score += s.fCur.startsWith(t) || s.f15.startsWith(t) ? 3 : s.fCur.includes(t) || s.f15.includes(t) ? 2 : s.fGen.includes(t) ? 1 : 0;
    }
    if (ok) out.push([score, s]);
  }
  if (toks.length) out.sort((a, b) => b[0] - a[0] || a[1].cur.localeCompare(b[1].cur));
  return {list: out.map(x => x[1]), toks};
}
function why(s, toks) {
  if (!toks.length) return '';
  const t = toks[0];
  if (s.fCur.includes(t) || s.f15.includes(t) || s.fGen.includes(t) || s.fFam.includes(t)) return '';
  const c = s.cm.find(c => fold(c[1]).includes(t)); if (c) return `<span class="badge">${esc(D.langs[c[0]])}</span>${esc(c[1])}`;
  const y = s.syn.find(x => fold(x[0]).includes(t)); if (y) return `<span class="badge">Synonym</span><i>${esc(y[0])}</i>`;
  return '';
}
const resultItem = (s, toks) => `<li><a href="#/s/${s.id}"><img loading="lazy" src="${thumbSrc(s)}" alt=""><div><div class="t">${nameHtml(s)}</div>
  <div class="s">${esc(s.fam)}${s.hab.length ? ' · ' + s.hab.map(h => HAB[h]).join(', ') : ''}</div>
  <div class="s">${why(s, toks)}</div></div></a></li>`;

function viewSearch(app) {
  const fams = [...new Set(SP.map(s => s.fam))].sort();
  app.innerHTML = `<h1>Plants of the Andaman Islands</h1><p class="lead">${plural(SP.length, 'plant', 'plants')} · search by scientific name, family, local name in any language, synonym or habit.</p>
  <div class="srch"><input id="q" type="search" placeholder="Try: Terminalia, bhindi, Papilionaceae, Pithecellobium…" value="${esc(st.q)}" autocomplete="off" autofocus></div>
  <div class="row" id="chips">${['', ...HAB_KEYS].map(h => `<button class="chip ${st.hab === h ? 'on' : ''}" data-h="${h}">${h ? HAB[h] : 'All habits'}</button>`).join('')}
    <select id="fam" aria-label="Family"><option value="">All families</option>${fams.map(f => `<option ${st.fam === f ? 'selected' : ''}>${esc(f)}</option>`).join('')}</select>
    <label class="row" style="gap:5px"><input type="checkbox" id="pic" ${st.pic ? 'checked' : ''}> With picture</label></div>
  <div id="cnt" class="lead" style="margin-top:12px"></div><ul class="res" id="res"></ul><div id="more" style="text-align:center"></div>`;
  const draw = () => {
    const {list, toks} = search();
    $('#cnt').textContent = plural(list.length, 'plant matches', 'plants match');
    $('#res').innerHTML = list.slice(0, st.shown).map(s => resultItem(s, toks)).join('');
    $('#more').innerHTML = list.length > st.shown ? `<button class="btn alt" id="mb">Show more (${list.length - st.shown} left)</button>` : '';
    if ($('#mb')) $('#mb').onclick = () => { st.shown += 60; draw(); };
  };
  let tm; $('#q').oninput = e => { clearTimeout(tm); tm = setTimeout(() => { st.q = e.target.value; st.shown = 40; draw(); }, 120); };
  $('#chips').onclick = e => { const b = e.target.closest('[data-h]'); if (!b) return; st.hab = b.dataset.h; st.shown = 40; [...$('#chips').querySelectorAll('.chip')].forEach(c => c.classList.toggle('on', c.dataset.h === st.hab)); draw(); };
  $('#fam').onchange = e => { st.fam = e.target.value; st.shown = 40; draw(); };
  $('#pic').onchange = e => { st.pic = e.target.checked; st.shown = 40; draw(); };
  draw();
}

/* ---------- map engine ---------- */
const KX = Math.cos(10 * Math.PI / 180), BND = {x0: 92.15, x1: 94.05, y0: 6.7, y1: 13.75};
const RAMP = ['#fff0a8','#fed976','#feb24c','#fd8d3c','#f03b20','#bd0026','#800026'];
const _ctr = [];
function ctr(i) { if (_ctr[i]) return _ctr[i]; const g = M.grid[i], ring = g.t === 'Polygon' ? g.c[0] : g.c[0][0]; let x = 0, y = 0; ring.forEach(p => { x += p[0]; y += p[1]; }); return (_ctr[i] = [x / ring.length, y / ring.length]); }
const gridBox = i => { const g = M.grid[i], ring = g.t === 'Polygon' ? g.c[0] : g.c[0][0]; const xs = ring.map(p => p[0]), ys = ring.map(p => p[1]); return [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)]; };
const AREAS = [...new Set(C.grids.map(g => g[2]).filter(Boolean))].sort();

class MapView {
  constructor(el, o = {}) {
    this.el = el; this.o = o; this.cv = document.createElement('canvas'); el.appendChild(this.cv);
    this.view = {...BND}; this.val = null; this.sel = new Set(); this.layers = {grid: true, places: true, roads: !!o.roads, rivers: !!o.rivers}; this.max = 0; this.hi = new Set();
    el.insertAdjacentHTML('beforeend', '<div class="ctl"><button data-z="in" aria-label="Zoom in">+</button><button data-z="out" aria-label="Zoom out">&minus;</button><button data-z="all" aria-label="Show everything" style="font-size:13px">&#8634;</button></div><div class="leg" hidden></div>');
    this.leg = el.querySelector('.leg');
    el.querySelector('.ctl').onclick = e => { const b = e.target.closest('[data-z]'); if (!b) return; const z = b.dataset.z; if (z === 'all') this.fit(); else this.zoom(z === 'in' ? .5 : 2); };
    this.ptrs = new Map(); this.bind(); this.ro = new ResizeObserver(() => this.resize()); this.ro.observe(el); this.resize();
  }
  resize() { const r = this.el.getBoundingClientRect(), d = devicePixelRatio || 1; this.w = Math.max(50, r.width); this.h = Math.max(50, r.height); this.cv.width = this.w * d; this.cv.height = this.h * d; this.d = d; if (!this._fitted) { this.fit(true); this._fitted = true; } this.draw(); }
  scale(v = this.view) { return Math.min(this.w / ((v.x1 - v.x0) * KX), this.h / (v.y1 - v.y0)); }
  px(x, y) { const s = this.scale(), v = this.view; return [(x - v.x0) * KX * s, this.h - (y - v.y0) * s]; }
  wd(px, py) { const s = this.scale(), v = this.view; return [px / (KX * s) + v.x0, (this.h - py) / s + v.y0]; }
  fit(quiet, box = [BND.x0, BND.x1, BND.y0, BND.y1]) {

/* ---------- GIS export ---------- */
function gridProps(i, n) { const g = C.grids[i]; const [lon, lat] = ctr(i); return {grid: g[0], code: g[1], area: g[2], division: g[3], lon: +lon.toFixed(5), lat: +lat.toFixed(5), count: n}; }

    rows.map(([i, p]) => `<Placemark><name>${esc(p.grid)}</name><styleUrl>#g</styleUrl><description>${esc(p.area)} ${esc(p.division)} · ${p.count}</description>${geom(M.grid[i])}</Placemark>`).join('') + '</Document></kml>');

      if ($('#clr')) $('#clr').onclick = () => { mp.sel.clear(); mv.sel = mp.sel; side(); mv.draw(); };
      if ($('#csv')) $('#csv').onclick = () => download('andaman_plants_in_selected_grids.csv', 'text/csv', 'scientific_name,name_2015,family,habit,records_in_selected_grids\n' + list.map(s => [s.cur, s.name15, s.fam, s.hab.join('; '), ids.get(s.id)].map(csvq).join(',')).join('\n'));
      document.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => exportGrids(b.dataset.ex, [...mp.sel].map(i => [i, (g2s.get(i) || []).length]), 'andaman_selected_grids', 'species_recorded'));
    }
    $('#hb') && ($('#hb').onclick = e => { const b = e.target.closest('[data-h]'); if (!b) return; mp.hab = b.dataset.h; side(); });
    mv.draw();
  }
  app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { mp.mode = b.dataset.m; side(); });
  $('#area').onchange = e => { const a = e.target.value; mv.fitSet(a ? C.grids.map((g, i) => g[2] === a ? i : -1).filter(i => i >= 0) : []); };
  [['lG', 'grid'], ['lP', 'places'], ['lR', 'roads'], ['lV', 'rivers']].forEach(([id, k]) => { $('#' + id).onchange = e => { mv.layers[k] = e.target.checked; mv.draw(); }; });
  side();
}

/* ---------- what's changed ---------- */
let chTab = 'new';
function viewChanges(app) {
  document.title = "What's changed · Andaman Mapping 2";
  const nw = SP.filter(s => s.code === 2), ok = SP.filter(s => s.code === 1), ck = SP.filter(s => s.code === 3), gn = SP.filter(s => !s.code);
  const lists = {new: nw, check: ck, genus: gn};
  app.innerHTML = `<h1>What's changed since 2015</h1><p class="lead">Every plant name was checked against the <b>${esc(NM.source)}</b> on ${esc(NM.date)}. Where a name changed, the current accepted name comes first and the 2015 name is kept beside it in brackets, for example <i>Senegalia andamanica</i> (<i>Acacia andamanica</i>). Old names still work in search.</p>
  <div class="tiles"><div class="tile"><b>${ok.length}</b><span>names confirmed as they were</span></div><div class="tile"><b>${nw.length}</b><span>names updated</span></div><div class="tile"><b>${ck.length}</b><span>left unchanged for a taxonomist to check</span></div><div class="tile"><b>${gn.length}</b><span>genus-level entries (“… spp”), not matched</span></div></div>
  <div class="card"><b>What is new in Version 2</b><ul><li>Search first: one box finds plants by scientific name, family, local name in any language, synonym or habit.</li><li>Works on phones, tablets and computers, and offline.</li><li>One page per plant: picture, names, local names by language, synonyms, flier, where it grows, other species of the genus.</li><li>A map you can drag and pinch, with area shortcuts and species-count maps by habit.</li><li>GIS export of a plant's grids or of selected grids (GeoJSON, KML, CSV) for QGIS and ArcGIS, and a CSV list of plants.</li></ul>
  Everything from Version 1 is still here: the same ${plural(SP.length, 'plant', 'plants')}, ${plural(C.grids.length, 'grid', 'grids')}, local names, synonyms and distribution records.</div>
  <div class="tabs"><button class="chip" data-t="new">Updated names (${nw.length})</button><button class="chip" data-t="check">To check (${ck.length})</button><button class="chip" data-t="genus">Genus-level (${gn.length})</button></div>
  <div class="row"><input class="fi" id="cf" placeholder="Filter this list…" style="flex:1;min-width:200px"><button class="btn alt sm" id="cdl">Download all as CSV</button></div><div class="tw" style="margin-top:10px;max-height:640px"><table class="t" id="ct"></table></div>
  <p class="lead" style="margin-top:12px">Names were matched automatically. Where the match was uncertain (a spelling variant, no species match, or an accepted name that is not a species) the 2015 name is kept and listed under “To check”.</p>`;
  const draw = () => {
    document.querySelectorAll('[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === chTab));
    const f = fold($('#cf').value), l = lists[chTab].filter(s => !f || (s.fCur + ' ' + s.f15 + ' ' + s.fFam).includes(f));
    $('#ct').innerHTML = chTab === 'new' ? `<tr><th>2015 name</th><th>Current accepted name</th><th>Family</th></tr>` + l.map(s => `<tr><td><a href="#/s/${s.id}"><i>${esc(s.name15)}</i></a></td><td><i>${esc(s.cur)}</i></td><td>${esc(s.fam)}</td></tr>`).join('')
      : chTab === 'check' ? `<tr><th>Name (kept)</th><th>Family</th><th>Why it needs a check</th></tr>` + l.map(s => `<tr><td><a href="#/s/${s.id}"><i>${esc(s.name15)}</i></a></td><td>${esc(s.fam)}</td><td>${esc(s.why)}${s.sug ? ' · GBIF suggests <i>' + esc(s.sug) + '</i>' : ''}</td></tr>`).join('')
      : `<tr><th>Entry</th><th>Family</th></tr>` + l.map(s => `<tr><td><a href="#/s/${s.id}"><i>${esc(s.name15)}</i></a></td><td>${esc(s.fam)}</td></tr>`).join('');
  };
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { chTab = b.dataset.t; draw(); }); $('#cf').oninput = draw; draw();
  $('#cdl').onclick = () => download('andaman_name_changes.csv', 'text/csv', 'status,name_2015,current_name,family,note\n' + SP.map(s => [['', 'confirmed', 'updated', 'to_check'][s.code] || 'genus_level', s.name15, s.cur, s.fam, s.why || (s.sug ? 'GBIF suggests ' + s.sug : '')].map(csvq).join(',')).join('\n'));
}

  <p>This is Version 2 of its 2026 rebuild by IBIN Apps: the original data with current plant names, a search-first design that works on phones, and GIS export. Version 1 (the original screens) is still available on the <a href="../">IBIN Apps page</a>.</p></div>
  <div class="note ok">This app keeps one picture per plant inside, so that it stays small and works offline. The installed program (Windows, Mac or Ubuntu) also shows all the original images and fliers, which it fetches from the IBIN Apps pictures pack when you ask for them on a plant page.</div>

  <h2>How to use</h2><div class="card"><ul><li><b>Search</b>: type any part of a name. Local names are searched in every language.</li><li><b>Map</b>: tap grids to list the plants recorded there; use <i>Species count per grid</i> for a thematic map.</li><li><b>GIS</b>: on a plant page or the map page, download grids as GeoJSON, KML or CSV and open them in QGIS, ArcGIS or Google Earth.</li></ul></div>`;

/* ---------- router ---------- */
function route() {
  mapsToClean.splice(0).forEach(m => m.destroy());
  const h = location.hash.replace(/^#\/?/, ''), [r, a] = h.split('/'), app = $('#app');
  document.querySelectorAll('#nav a').forEach(x => x.classList.toggle('on', x.dataset.r === (r === 's' ? 'search' : r || 'search')));
  scrollTo(0, 0); document.title = 'Andaman Mapping 2';
  if (r === 's') viewSpecies(app, a); else if (r === 'map') viewMap(app); else if (r === 'changes') viewChanges(app); else if (r === 'about') viewAbout(app); else viewSearch(app);
}
addEventListener('hashchange', route); route();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
