[package]
name = "andaman-mapping-2"
version = "2.0.0"
description = "Andaman Mapping 2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
ureq = { version = "2", default-features = false, features = ["tls"] }
serde_json = "1"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
