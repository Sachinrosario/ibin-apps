<!doctype html>
<html lang="en">
<head>

<style>
/* Sasya Bharathi (India) 2004-05 - Version 1, faithful web rebuild.
   The screens are the original program's own screens (captured from the 2005 program running under Windows),
   with its lists, counts, maps and tables filled from the original Access database (med1.mdb, image.mdb). */
@font-face{font-family:"PS Arial";src:local("Arial"),local("ArialMT"),url(fonts/arimo-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:"PS Arial";src:local("Arial Bold"),local("Arial-BoldMT"),url(fonts/arimo-latin-700-normal.woff2) format("woff2");font-weight:700}
:root{--arial:"PS Arial",Arial,sans-serif;--sans:"Microsoft Sans Serif","MS Sans Serif","PS Arial",sans-serif}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:var(--sans)}
#stage{position:absolute;width:1366px;height:768px;transform-origin:0 0;overflow:hidden;user-select:none;-webkit-user-select:none;background:#dccca9}
#stage img{-webkit-user-drag:none}
.scr{position:absolute;inset:0;display:none;background-repeat:no-repeat}
.scr.on{display:block}
.abs{position:absolute}
.hot{position:absolute;cursor:pointer}
.hot:active{background:rgba(0,0,0,.08);border-radius:14px}
/* list boxes: drawn by the page itself (a browser <select> becomes a drop-down on phones and tablets) */
.lb{position:absolute;border:1px solid #808080;border-right-color:#fff;border-bottom-color:#fff;box-shadow:inset 1px 1px 0 #404040;background:#fff;
  font:13px/15px var(--arial);color:#000;padding:0;margin:0;outline:none;box-sizing:border-box;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;cursor:default}
.lb .row{position:absolute;left:0;right:0;height:15px;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:clip}
.lb .row.sel{background:#000080;color:#fff}
.cnt{position:absolute;background:#ddcca9;font:11px var(--arial);text-align:center;color:#000}
.cnt u{display:block;margin-top:4px}
.ttl{position:absolute;font:12px var(--arial);text-align:center;color:#000}
.cb{position:absolute;font:12px var(--sans);text-align:left}
#busy{position:absolute;inset:0;display:none;z-index:900;cursor:wait}
#busy div{position:absolute;left:583px;top:360px;width:200px;padding:10px;background:#ffffe1;border:1px solid #000;font:12px var(--arial);text-align:center}
/* detail window */
#det .body{position:absolute;left:0;top:96px;width:1366px;height:672px;overflow:hidden}
.tab{position:absolute;top:40px;height:50px;cursor:pointer;background-size:100% 100%}
.dtitle{position:absolute;left:300px;top:8px;width:660px;text-align:center;font:bold 14px var(--arial);color:#8b0000}
.hval{position:absolute;width:354px;height:34px;background:url(img/ui/hbox.png);font:20px var(--arial);color:#7d0000;text-align:center;line-height:22px}
table.fg{border-collapse:collapse;font:11px var(--arial);color:#804040;table-layout:fixed}
table.fg th{background:#804040;color:#fff;font:bold 11px var(--arial);text-align:left;height:32px;padding:0 3px;border:1px solid #808080}
table.fg td{border:1px solid #808080;padding:0 3px;height:32px;vertical-align:middle;overflow:hidden;cursor:pointer}
table.fg td.a{background:#cdb7b1}table.fg td.b{background:#dfd0cc}
table.fg td.sel{outline:2px solid #000080;outline-offset:-2px}
.tree{position:absolute;background:#fff;overflow:auto;font:12px var(--arial)}
.tree .n{white-space:nowrap;display:flex;align-items:center;gap:4px;height:24px}
.tree .hl{background:#0a246a;color:#fff;padding:2px 3px}
.pm{width:9px;height:9px;border:1px solid #808080;font:9px/9px var(--arial);text-align:center;cursor:pointer;background:#fff;color:#000;flex:none}
#cmt{border-collapse:collapse;font:bold 14px var(--arial)}
#cmt th{background:#008080;color:#fff;text-align:left;padding:1px 4px;border:1px solid #808080;font:bold 14px var(--arial)}
#cmt td{border:1px solid #808080;padding:1px 4px;background:#fff;height:18px}
#cmt td.nm{color:#804040;cursor:pointer}
#cmt td.nm.sel{background:#0a246a;color:#fff}
.dlg{position:absolute;inset:0;background:rgba(0,0,0,.25);z-index:500;display:none}
.dlg .w{position:absolute;left:133px;top:84px;width:1100px;height:600px;background:#dccca9;border:2px outset #fff;box-shadow:2px 2px 6px #000}
.dlg .tb{height:20px;background:linear-gradient(90deg,#0a246a,#a6caf0);color:#fff;font:bold 12px var(--arial);line-height:20px;padding-left:6px}
.btn{position:absolute;background:#d4d0c8;border:2px outset #fff;font:12px var(--arial);text-align:center;line-height:20px;cursor:pointer}
#quit{position:fixed;inset:0;z-index:100000;background:#000;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;font:20px var(--arial)}
</style>
</head>
<body>

  <!-- opening screen (Form3) -->

    <div class="abs" style="left:4px;top:4px;width:814px;height:760px;overflow:hidden;background:#ddcca9">
      <img id="thmImg" class="abs" style="left:0.5px;top:-45px;width:814px;height:876px" alt=""></div>
    <img class="abs" id="thr0" style="left:830px;top:68px" alt=""><img class="abs" id="thr1" style="left:830px;top:103px" alt=""><img class="abs" id="thr2" style="left:830px;top:135px" alt="">
    <div class="hot" style="left:828px;top:62px;width:180px;height:24px" onclick="thematic(0)"></div>
    <div class="hot" style="left:828px;top:97px;width:180px;height:24px" onclick="thematic(1)"></div>
    <div class="hot" style="left:828px;top:129px;width:180px;height:24px" onclick="thematic(2)"></div>
    <div class="hot" style="left:1008px;top:8px;width:66px;height:34px" onclick="go('mods')" title="Home"></div>
    <div class="hot" style="left:1078px;top:8px;width:66px;height:34px" onclick="quitApp()" title="Exit"></div>
  </div>
  <!-- Images -->
  <div class="scr" id="img" style="background-image:url(img/ui/images.jpg)">
    <div class="hot" style="left:1220px;top:9px;width:68px;height:34px" onclick="go('mods')" title="Home"></div>
    <div class="hot" style="left:1292px;top:9px;width:68px;height:34px" onclick="quitApp()" title="Exit"></div>
  </div>
  <!-- Textform search -->
  <div class="scr" id="txt" style="background-image:url(img/ui/textform.png)"></div>
  <!-- the 'Digitized Inventory' window -->
  <div class="scr" id="det" style="background:#c0c0c0 url(img/ui/dhdr.png) no-repeat">
    <div class="dtitle" id="dTitle"></div>
    <div class="hot" style="left:1264px;top:4px;width:48px;height:32px" onclick="detBack()" title="Back"></div>
    <div class="hot" style="left:1313px;top:4px;width:50px;height:32px" onclick="quitApp()" title="Exit"></div>
    <div id="dTabs"></div>
    <div class="body" id="dBody"></div>
  </div>
  <div class="dlg" id="stl"><div class="w"><div class="tb">List of Correct &amp; Synonym Names</div><div id="stlIn"></div></div></div>
  <div id="busy"><div>Please wait&hellip;</div></div>
</div>
<div id="quit"><div>Sasya Bharathi is closed. You can close this window.</div><div class="btn" style="position:static;padding:4px 16px" onclick="location.reload()">Open it again</div></div>
<script>
'use strict';
const VERSION = '1.0.2';
const REMOTE = 'https://sachinrosario.github.io/ibin-apps/sasya-bharathi/';
const SW = 1366, SH = 768, stage = document.getElementById('stage');
const $ = id => document.getElementById(id);
function fit() {
  const s = Math.min(innerWidth / SW, innerHeight / SH);
  stage.style.transform = `scale(${s})`;
  stage.style.left = Math.max(0, (innerWidth - SW * s) / 2) + 'px';
  stage.style.top = Math.max(0, (innerHeight - SH * s) / 2) + 'px';
}
addEventListener('resize', fit); fit();
$('ver').textContent = 'Version ' + VERSION;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'})[c]);
const el = (tag, attrs, html) => { const e = document.createElement(tag); if (attrs) for (const k in attrs) { if (k === 'style') Object.assign(e.style, attrs.style); else if (k.startsWith('on')) e[k] = attrs[k]; else e.setAttribute(k, attrs[k]); } if (html != null) e.innerHTML = html; return e; };
const pos = (e, l, t, w, h) => { e.style.left = l + 'px'; e.style.top = t + 'px'; if (w != null) e.style.width = w + 'px'; if (h != null) e.style.height = h + 'px'; return e; };
const none = v => (v == null || v === '' || v === '0' || /^none$/i.test(v)) ? '' : v;
function busy(on) { $('busy').style.display = on ? 'block' : 'none'; }
let CUR = 'open';
function go(id) { document.querySelectorAll('.scr').forEach(s => s.classList.toggle('on', s.id === id)); CUR = id; }
function quitApp() { try { window.close(); } catch (e) {} setTimeout(() => { $('quit').style.display = 'flex'; }, 250); }

// ---------- data loading: a file in this folder first, the IBIN Apps web copy when it is not there (small installers) ----------
const loaded = {};
// on the IBIN web site, a version that shares Version 1's records and pictures reads them from there directly
const SHARED = /^(data\/[dg]\/|img\/photos\/)/, WEBCOPY = /github\.io$/.test(location.hostname) && !new URL('.', location.href).href.startsWith(REMOTE);
const first = rel => (WEBCOPY && SHARED.test(rel) ? REMOTE : '') + rel;
function loadJs(rel) {
  if (loaded[rel]) return loaded[rel];
  return loaded[rel] = new Promise((ok, bad) => {
    const s = document.createElement('script'); s.src = first(rel);
    s.onload = () => ok();
    s.onerror = () => { s.remove(); const r = document.createElement('script'); r.src = REMOTE + rel; r.onload = () => ok(); r.onerror = () => { delete loaded[rel]; bad(new Error(rel)); }; document.head.appendChild(r); };
    document.head.appendChild(s);
  });
}
window.SB = window.SB || {};
const SHARD = {};
SB.got = (k, i, o) => { SHARD[k + i] = o; };
async function shard(k, i) { if (!SHARD[k + i]) await loadJs(`data/${k}/${i}.js`); return SHARD[k + i]; }
const crc32 = (() => { const T = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; T[n] = c >>> 0; } return s => { let c = 0xFFFFFFFF; for (const b of new TextEncoder().encode(s)) c = T[(c ^ b) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }; })();
function photo(img, file) { img.onerror = () => { img.onerror = null; img.src = REMOTE + 'img/photos/' + encodeURIComponent(file); }; img.src = first('img/photos/') + encodeURIComponent(file); }

// ---------- indexes ----------
let BYID, BYCOMB, INDIA, STATUS = ['valid', 'probably valid', 'synonym', 'probably synonym', 'undecided'];
function unpack(s) { const o = []; let p = 0; if (s) for (const d of s.split('.')) { p += parseInt(d, 16); o.push(p); } return o; }
function initData() {
  BYID = new Map(); BYCOMB = new Map();
  for (const r of SB.sp) { BYID.set(r[0], r); const k = r[7].toLowerCase(); if (!BYCOMB.has(k)) BYCOMB.set(k, []); BYCOMB.get(k).push(r); }
  const st = [0, 0, 0, 0, 0]; for (const r of SB.sp) st[r[6]]++;
  INDIA = makeSet(SB.sp.map(r => [r[1].toUpperCase(), r[2], r[7]]), st);
}
// a set of plants shown in the four lists: [family, genus, species] rows
function makeSet(rows, bracket) {
  const fam = new Map(), gen = new Map(), sp = new Map();
  for (const [f, g, c] of rows) { const fk = f.toLowerCase(), gk = g.toLowerCase(), ck = c.toLowerCase();
    if (!fam.has(fk)) fam.set(fk, f); if (!gen.has(gk)) gen.set(gk, [g, fk]); if (!sp.has(ck)) sp.set(ck, [c, fk, gk]); }
  const srt = a => a.sort((x, y) => x.toLowerCase() < y.toLowerCase() ? -1 : x.toLowerCase() > y.toLowerCase() ? 1 : 0);
  return { fams: srt([...fam.values()]), gens: [...gen.values()].sort((a, b) => a[0].toLowerCase() < b[0].toLowerCase() ? -1 : 1), sps: [...sp.values()].sort((a, b) => a[0].toLowerCase() < b[0].toLowerCase() ? -1 : 1), bracket };
}
function stateSet(states) {
  const ids = new Set(); for (const s of states) for (const i of unpack(SB.states[s.toLowerCase()])) ids.add(i);
  return makeSet([...ids].map(i => [SB.cfg[i][0], SB.cfg[i][1], SB.combs[i]]));
}
function speciesRow(comb) { const rs = BYCOMB.get(comb.toLowerCase()) || []; return rs.find(r => !r[4] && !r[5]) || rs[0]; }
function sspRows(comb) { return (BYCOMB.get(comb.toLowerCase()) || []).filter(r => r[4] || r[5]); }

// ---------- the four-list panel (Plant Richness ...) ----------
function opts(box, items) { box.setItems(items); }
// a list box like the program's: click selects (and tells the program), double-click opens, arrow keys move; only the visible rows are drawn
function listBox() {
  const box = el('div', { class: 'lb', tabindex: 0 }), sp = el('div', { style: { position: 'relative', width: '1px' } }); box.append(sp);
  let items = [], sel = -1; const RH = 15;
  const draw = () => { const a = Math.max(0, Math.floor(box.scrollTop / RH) - 2), b = Math.min(items.length, a + Math.ceil(box.clientHeight / RH) + 5);
    let h = ''; for (let i = a; i < b; i++) h += `<div class="row${i === sel ? ' sel' : ''}" data-i="${i}" style="top:${i * RH}px">${esc(LABEL(items[i]))}</div>`;
    sp.style.height = items.length * RH + 'px'; sp.style.width = '100%'; sp.innerHTML = h; };
  const pick = (i, tell) => { if (i < 0 || i >= items.length) return; sel = i; const t = i * RH; if (t < box.scrollTop) box.scrollTop = t; else if (t + RH > box.scrollTop + box.clientHeight) box.scrollTop = t + RH - box.clientHeight; draw(); if (tell && box.onchange) box.onchange(); };
  box.addEventListener('scroll', draw);
  box.addEventListener('click', e => { const r = e.target.closest('.row'); if (r) pick(+r.dataset.i, true); });
  box.addEventListener('keydown', e => { const k = { ArrowDown: 1, ArrowUp: -1, PageDown: 10, PageUp: -10 }[e.key]; if (k) { e.preventDefault(); pick(Math.max(0, Math.min(items.length - 1, (sel < 0 ? 0 : sel + k))), true); } else if (e.key === 'Enter' && box.ondblclick) box.ondblclick(); });
  box.setItems = a => { items = a.slice(); sel = -1; box.scrollTop = 0; draw(); };
  box.select = v => { const i = items.findIndex(x => String(x).toLowerCase() === String(v).toLowerCase()); if (i >= 0) pick(i, true); return i; };
  Object.defineProperty(box, 'value', { get: () => sel >= 0 ? items[sel] : '' });
  Object.defineProperty(box, 'items', { get: () => items });
  return box;
}
const LABEL = t => t;
function panel(host, x, y, withImage) {
  const P = { host, set: null };
  if (withImage) { P.img = pos(el('img', { class: 'abs', src: 'img/ui/panel.png', alt: '' }), x, y); host.append(P.img); }
  const L = (l, t, w, h) => { const s = pos(listBox(), x + l, y + t, w, h); host.append(s); return s; };
  P.title = pos(el('div', { class: 'ttl' }), x + 20, y + 13, 500); host.append(P.title);
  const C = (l, w) => { const d = pos(el('div', { class: 'cnt' }), x + l, y + 62, w, 26); host.append(d); return d; };
  P.cf = C(24, 132); P.cg = C(184, 132); P.cs = pos(C(351, 150), x + 351, y + 58, 150, 34); P.cv = C(535, 150);
  P.lf = L(9, 101, 154, 213); P.lg = L(168, 101, 158, 213); P.ls = L(331, 101, 183, 213); P.lv = L(518, 101, 184, 213);
  P.btns = [];
  const B = (l, t, w, f) => { const b = pos(el('div', { class: 'hot', onclick: () => P.set && f() }), x + l, y + t, w, 28); host.append(b); P.btns.push(b); };
  B(14, 332, 142, () => { const f = P.lf.value; if (!f) return alert('Select the Family'); detail('F', f); });
  B(175, 332, 140, () => { const g = P.lg.value; if (!g) return alert('Select the Genus'); detail('G', g); });
  B(340, 332, 154, () => { const c = P.ls.value; if (!c) return alert('Select the Species'); const r = speciesRow(c); if (r) detail('S', r[0]); });
  B(510, 332, 196, () => { const v = P.lv.value; if (!v) return alert('Select the Sub species or variety'); const r = SB.sp.find(r => r[8].toLowerCase() === v.toLowerCase()); if (r) detail('S', r[0]); });
  B(46, 368, 74, () => P.show(P.set, P.title.textContent));
  B(142, 368, 340, () => statusLists(SB.st));
  P.lf.onchange = () => { const fk = P.lf.value.toLowerCase(); opts(P.lg, P.set.gens.filter(g => g[1] === fk).map(g => g[0])); opts(P.ls, P.set.sps.filter(s => s[1] === fk).map(s => s[0])); opts(P.lv, []); P.cv.innerHTML = ''; };
  P.lg.onchange = () => { const gk = P.lg.value.toLowerCase(); opts(P.ls, P.set.sps.filter(s => s[2] === gk).map(s => s[0])); opts(P.lv, []); P.cv.innerHTML = ''; };
  P.ls.onchange = () => { const v = sspRows(P.ls.value).map(r => r[8]); opts(P.lv, v); P.cv.innerHTML = v.length ? `<u>${v.length}</u>` : ''; };
  P.lf.ondblclick = () => P.lf.value && detail('F', P.lf.value);
  P.lg.ondblclick = () => P.lg.value && detail('G', P.lg.value);
  P.ls.ondblclick = () => { const r = P.ls.value && speciesRow(P.ls.value); if (r) detail('S', r[0]); };
  P.show = (set, title) => {
    P.set = set; P.title.textContent = title || '';
    P.cf.innerHTML = `<u>${set.fams.length}</u>`; P.cg.innerHTML = `<u>${set.gens.length}</u>`;
    P.cs.innerHTML = `<u style="margin-top:0">${set.sps.length}</u>` + (set.bracket ? `<div style="margin-top:5px;font-size:10px">**(${set.bracket.join(',')})</div>` : '');
    P.cv.innerHTML = ''; opts(P.lf, set.fams); opts(P.lg, set.gens.map(g => g[0])); opts(P.ls, set.sps.map(s => s[0])); opts(P.lv, []);
    P.els().forEach(e => e.style.display = '');
  };
  P.els = () => [P.img, P.title, P.cf, P.cg, P.cs, P.cv, P.lf, P.lg, P.ls, P.lv, ...P.btns].filter(Boolean);
  P.hide = () => { P.set = null; P.els().forEach(e => e.style.display = 'none'); };
  return P;
}
function homeExit(host, x) {
  host.append(pos(el('div', { class: 'hot', onclick: () => go('mods'), title: 'Home' }), x, 8, 66, 34));
  host.append(pos(el('div', { class: 'hot', onclick: quitApp, title: 'Exit' }), x + 70, 8, 66, 34));
}

// ---------- Political boundary ----------
const polXY = (x, y) => [67.9 + (x - 8) / 21.25, 37.25 - (y - 34) / 23.79]; // fitted to the program's own map picture
function inRing(px, py, ring) { let c = false; for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) { const [xi, yi] = ring[i], [xj, yj] = ring[j]; if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) c = !c; } return c; }
function stateAt(lon, lat) {
  // state outlines first (no gaps between districts), then the districts, then the nearest state within about 10 km
  for (const [st, rings] of Object.entries(SB.so)) { if (st !== 'SouthindiaStates' && rings.some(r => inRing(lon, lat, r))) return st; }
  for (const [st, ds] of Object.entries(SB.poly)) { if (st === 'SouthindiaStates') continue; for (const [, rings] of ds) for (const r of rings) if (inRing(lon, lat, r)) return st; }
  let best = null, bd = 0.1;
  for (const [st, rings] of Object.entries(SB.so)) { if (st === 'SouthindiaStates') continue; for (const r of rings) for (const [x, y] of r) { const d = Math.hypot(x - lon, y - lat); if (d < bd) { bd = d; best = st; } } }
  return best;
  return null;
}
let POL;
function openPolitical() {
  go('pol');
  if (!POL) { const h = $('pol'); POL = panel(h, 656, 40, true); homeExit(h, 846);

      busy(true); setTimeout(() => { POL.show(stateSet([st]), 'Plant Richness of ' + st); busy(false); }, 10); };
  }
  POL.show(INDIA, 'Plant Richness of Entire India');
}

function zoneAt(x, y) { const row = BIOZ[Math.round(y / 2)]; if (!row) return 0; let cx = Math.round(x / 2); for (let i = 0; i < row.length; i += 2) { if (cx < row[i + 1]) return row[i]; cx -= row[i + 1]; } return 0; }
let BIO;
function bioZone(z) { busy(true); setTimeout(() => { const [n, st] = ZONES[z]; BIO.show(stateSet(st), 'Plant Richness of the biotic zone ' + (z === 20 ? 'western ghats' : n)); busy(false); }, 10); }
function openBiotic() {
  go('bio');
  if (!BIO) { const h = $('bio'); BIO = panel(h, 656, 40, true); homeExit(h, 846);
    const lg = el('div', { class: 'abs', style: { left: '662px', top: '503px', width: '494px', height: '93px', border: '1px solid #c0c0c0', font: '11px var(--arial)', background: '#ddcca9' } });
    lg.innerHTML = '<div style="position:absolute;left:7px;top:-1px;color:#00f;font-size:12px">Click on the label to view the list of species of that biotic zone in Entire India.</div>';
    const col = [8, 104, 243, 368], wd = [92, 135, 120, 120];
    for (let z = 1; z <= 20; z++) { const c = Math.floor((z - 1) / 5), r = (z - 1) % 5; const d = pos(el('div', { class: 'hot', style: { font: '11px var(--arial)', whiteSpace: 'nowrap', borderRadius: 0 } }, z + '. ' + ZONES[z][0].replace('western ghats', 'Western Ghats')), col[c], 14 + r * 16, wd[c], 15); d.onclick = () => bioZone(z); lg.append(d); }
    h.append(lg);
    $('bioMap').onclick = e => { const r = $('bioMap').getBoundingClientRect(), s = r.width / 648; const z = zoneAt((e.clientX - r.left) / s + 4, (e.clientY - r.top) / s + 4); if (z) bioZone(z); };
  }
  BIO.hide();
}

      const g = SB.grid.find(g => u >= g[1] && u < g[3] && v >= g[2] && v < g[4]); if (!g || !g[5]) return;
      const q = $('grdSel'); q.style.display = 'block'; pos(q, 26 + (g[1] - 1740) * 0.074419 + 1, 20 + (g[2] - 165) * 0.0660 + 1, (g[3] - g[1]) * 0.074419 - 1, (g[4] - g[2]) * 0.0660 - 1);

}
