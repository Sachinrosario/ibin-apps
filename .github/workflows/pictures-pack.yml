# Pictures and Fliers pack of a mapping program (Andaman Mapping, Western Ghats Mapping), built from the original 2015 installer
# and published on this repository's Releases page (<app>-pictures-<version>) as uncompressed zip parts plus index.json.
# The programs fetch each picture from these zips when it is first shown (HTTP Range), so the installers stay small.
# Input ids: the Google Drive file ids of the original setup.exe followed by its setup-1a.bin, setup-1b.bin ... in order.
name: Pictures pack
on:
  workflow_dispatch:
    inputs:
      app: {description: "andaman-mapping or western-ghats-mapping", required: true}
      ids: {description: "Drive ids: setup.exe, then the .bin parts in order (space separated)", required: true}
      version: {description: "Pack version", default: "1.0.0"}
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Tools and disk
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q innoextract zip mdbtools >/dev/null
          pip install -q gdown pillow
          sudo mkdir -p /mnt/w && sudo chown $USER /mnt/w && df -h /mnt | tail -1
      - name: Download and unpack the original installer
        working-directory: /mnt/w
        run: |
          set -e
          mkdir -p dl && cd dl
          k=0; for id in ${{ inputs.ids }}; do
            if [ $k -eq 0 ]; then n=setup.exe; else n=setup-1$(printf "\\x$(printf %x $((96 + k)))").bin; fi
            gdown -q "$id" -O "$n"; k=$((k + 1))
          done
          ls -l
          cd .. && mkdir un && cd un && innoextract -s ../dl/setup.exe | tail -2
          rm -rf ../dl
          echo "images $(find app/Images -type f | wc -l)  fliers $(find app/Fliers -type f | wc -l)"
      - name: Western Ghats - name the flier folders by species and number the slides
        if: inputs.app == 'western-ghats-mapping'
        working-directory: /mnt/w/un/app
        run: |
          M=$(ls *.mdb *.MDB 2>/dev/null | head -1)
          mdb-export "$M" speciesmaster > /mnt/w/sm.csv
          python3 - <<'PY'
          import csv, os, re, difflib, shutil
          sp = {int(r['SpeciesId']): r['SpeciesName'] for r in csv.DictReader(open('/mnt/w/sm.csv', encoding='utf-8', errors='replace'))}
          low = {n.lower().strip(): (i, n) for i, n in sp.items()}; names = list(low); done = set()
          os.makedirs('/mnt/w/Fliers', exist_ok=True)
          for d in sorted(os.listdir('Fliers')):
              k = d.lower().strip(); hit = low.get(k)
              if not hit:
                  m = difflib.get_close_matches(k, names, 1, 0.82)
                  if m: hit = low[m[0]]
              if not hit: continue
              files = [f for f in os.listdir(f'Fliers/{d}') if f.lower().endswith(('.jpg', '.jpeg'))]
              num = lambda f: (int(re.findall(r'(\d+)\.[^.]+$', f)[0]) if re.findall(r'(\d+)\.[^.]+$', f) else 0, f)
              files.sort(key=num)
              tgt = f'/mnt/w/Fliers/{hit[1]}'
              if tgt in done: tgt += ' (2)'
              done.add(tgt); os.makedirs(tgt, exist_ok=True)
              for j, f in enumerate(files, 1): shutil.move(f'Fliers/{d}/{f}', f'{tgt}/Slide{j}.JPG')
          PY
          rm -rf Fliers && mv /mnt/w/Fliers Fliers
      - name: Make the zips (uncompressed, under 1.9 GB each) and the index
        working-directory: /mnt/w/un/app
        run: |
          set -e
          V=${{ inputs.version }}; B=$([ "${{ inputs.app }}" = andaman-mapping ] && echo AndamanMapping || echo WesternGhatMapping)
          mkdir -p /mnt/w/out
          python3 - "$B" "$V" <<'PY'
          import os, sys, subprocess
          B, V = sys.argv[1:3]
          sp = sorted(os.listdir('Images'))
          size = lambda d: sum(os.path.getsize(os.path.join(r, f)) for r, _, fs in os.walk(os.path.join('Images', d)) for f in fs)
          sz = [(d, size(d)) for d in sp]; tot = sum(s for _, s in sz); P = max(1, -(-tot // 1_500_000_000)); parts = [[] for _ in range(P)]; acc = 0
          for d, s in sz: parts[min(P - 1, int(acc * P / tot))].append(d); acc += s
          for i, ps in enumerate(parts, 1):
              subprocess.check_call(['zip', '-0', '-q', '-r', f'/mnt/w/out/{B}_Pictures_{V}_part{i}.zip'] + [os.path.join('Images', d) for d in ps])
          subprocess.check_call(['zip', '-0', '-q', '-r', f'/mnt/w/out/{B}_Fliers_{V}.zip', 'Fliers'])
          PY
          cd /mnt/w/out && python3 $GITHUB_WORKSPACE/.github/tools/pack_index.py index.json $(ls ${B}_Pictures_*_part*.zip | sort -V) ${B}_Fliers_${V}.zip
          ls -l
      - name: Publish
        working-directory: /mnt/w/out
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          T=${{ inputs.app }}-pictures-${{ inputs.version }}
          N=$([ "${{ inputs.app }}" = andaman-mapping ] && echo "Andaman Mapping" || echo "Western Ghats Mapping")
          gh release view $T >/dev/null 2>&1 || gh release create $T --title "$N – Pictures and Fliers pack ${{ inputs.version }}" --notes "All original images and fliers of $N (2015). The programs fetch each picture from these files the first time it is shown, so nothing has to be installed. To use the pictures without internet: extract all the zip files into a folder called pack next to the program (Windows), or next to Open Kit.html in the offline folder."
          for f in *; do gh release upload $T "$f" --clobber; done
