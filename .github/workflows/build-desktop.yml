# Build & Release
# Builds every download for an app and publishes them on this repository's Releases page.
# Starts by itself when apps/<app>/release.json changes (raise "version" there to release),
# or by hand from Actions -> "Build & Release" -> Run workflow.
name: Build & Release

on:
  push:
    branches: [main]
    paths: ["apps/*/release.json"]
  workflow_dispatch:
    inputs:
      app:
        description: "App folder under apps/"
        required: true
        default: "phyllanthus-rattans-kit"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.info.outputs.app }}
      version: ${{ steps.info.outputs.version }}
      base: ${{ steps.info.outputs.base }}
      tag: ${{ steps.info.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: info
        name: Work out app and version
        run: |
          APP="${{ inputs.app }}"
          if [ -z "$APP" ]; then APP=$(git diff --name-only HEAD~1 HEAD | grep -m1 '^apps/.*/release.json' | cut -d/ -f2); fi
          [ -z "$APP" ] && APP=phyllanthus-rattans-kit
          VER=$(jq -r .version apps/$APP/release.json); BASE=$(jq -r .fileBase apps/$APP/release.json)
          echo "app=$APP" >> $GITHUB_OUTPUT; echo "version=$VER" >> $GITHUB_OUTPUT
          echo "base=$BASE" >> $GITHUB_OUTPUT; echo "tag=$APP-v$VER" >> $GITHUB_OUTPUT
      - name: Create the release page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          A=apps/${{ steps.info.outputs.app }}
          gh release view "${{ steps.info.outputs.tag }}" >/dev/null 2>&1 || \
          gh release create "${{ steps.info.outputs.tag }}" --target "$GITHUB_SHA" \
            --title "$(jq -r .title $A/release.json)" --notes-file $A/RELEASE_NOTES.md

  windows:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Windows build tools
        run: sudo apt-get update && sudo apt-get install -y binutils-mingw-w64-x86-64 nsis
      - name: Build exe and Setup
        working-directory: apps/${{ needs.prepare.outputs.app }}/windows
        run: |
          cp -r ../web web
          x86_64-w64-mingw32-windres --preprocessor=cat -O coff -i app.rc -o rsrc_windows_amd64.syso
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H windowsgui" -o ${{ needs.prepare.outputs.base }}.exe .
          makensis -V2 installer.nsi
          ls -la *.exe
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: apps/${{ needs.prepare.outputs.app }}/windows
        run: gh release upload "${{ needs.prepare.outputs.tag }}" ${{ needs.prepare.outputs.base }}.exe ${{ needs.prepare.outputs.base }}_${{ needs.prepare.outputs.version }}_Setup.exe --clobber

  ubuntu:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Ubuntu build libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build .deb
        working-directory: apps/${{ needs.prepare.outputs.app }}
        run: |
          npm install
          npx tauri build --bundles deb
          cp src-tauri/target/release/bundle/deb/*.deb ${{ needs.prepare.outputs.base }}_${{ needs.prepare.outputs.version }}_amd64.deb
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: apps/${{ needs.prepare.outputs.app }}
        run: gh release upload "${{ needs.prepare.outputs.tag }}" ${{ needs.prepare.outputs.base }}_${{ needs.prepare.outputs.version }}_amd64.deb --clobber

  mac:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build .dmg (Intel and Apple silicon)
        working-directory: apps/${{ needs.prepare.outputs.app }}
        run: |
          npm install
          npx tauri build --target universal-apple-darwin --bundles dmg
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg ${{ needs.prepare.outputs.base }}_${{ needs.prepare.outputs.version }}_universal.dmg
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: apps/${{ needs.prepare.outputs.app }}
        run: gh release upload "${{ needs.prepare.outputs.tag }}" ${{ needs.prepare.outputs.base }}_${{ needs.prepare.outputs.version }}_universal.dmg --clobber

  offline-zip:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make offline zip and attach it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          A=${{ needs.prepare.outputs.app }}; B=${{ needs.prepare.outputs.base }}; V=${{ needs.prepare.outputs.version }}
          mkdir -p "pack/$B" && cp -r apps/$A/web/* "pack/$B/"
          mv "pack/$B/index.html" "pack/$B/Open Kit.html"
          printf 'Extract this zip, open the folder, then double-click "Open Kit.html". Keep it together with the data and img folders.\r\n' > "pack/$B/READ ME FIRST.txt"
          (cd pack && zip -qr "../${B}_${V}_offline.zip" "$B")
          gh release upload "${{ needs.prepare.outputs.tag }}" "${B}_${V}_offline.zip" --clobber
