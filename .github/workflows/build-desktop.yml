# Build & Release
# Builds every download for an app and publishes them on this repository's Releases page.
# Starts by itself when apps/<app>/release.json changes (raise "version" there to release) - every app
# changed in the push is released, each in its own run - or by hand from Actions -> "Build & Release" -> Run workflow.
name: Build & Release

on:
  push:
    branches: [main]
    paths: ["apps/*/release.json"]
  workflow_dispatch:
    inputs:
      app:
        description: "App folder under apps/"
        required: true
        default: "pathanga-suchya-4"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.which.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - id: which
        name: Work out which apps to release
        env:
          APP: ${{ inputs.app }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$APP" ]; then
            LIST="$APP"
          else
            # every release.json changed by the whole push, not only by its last commit
            if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then BEFORE=$(git rev-parse HEAD~1); fi
            LIST=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -E '^apps/[^/]+/release\.json$' | cut -d/ -f2 | sort -u)
          fi
          JSON=$(for a in $LIST; do [ -f "apps/$a/release.json" ] && echo "$a"; done | jq -R . | jq -sc .)
          echo "Apps to release: $JSON"
          echo "apps=$JSON" >> $GITHUB_OUTPUT

  release:
    needs: prepare
    if: needs.prepare.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - id: info
        name: Version and file names
        run: |
          A=apps/${{ matrix.app }}
          VER=$(jq -r .version $A/release.json)
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "base=$(jq -r .fileBase $A/release.json)" >> $GITHUB_OUTPUT
          echo "tag=${{ matrix.app }}-v$VER" >> $GITHUB_OUTPUT
      - name: Create the release page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          A=apps/${{ matrix.app }}
          if gh release view "${{ steps.info.outputs.tag }}" >/dev/null 2>&1; then
            gh release edit "${{ steps.info.outputs.tag }}" --title "$(jq -r .title $A/release.json)" --notes-file $A/RELEASE_NOTES.md
          else
            gh release create "${{ steps.info.outputs.tag }}" --target "$GITHUB_SHA" \
              --title "$(jq -r .title $A/release.json)" --notes-file $A/RELEASE_NOTES.md
          fi

  windows:
    needs: [prepare, release]
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: info
        name: Version and file names
        run: |
          A=apps/${{ matrix.app }}
          VER=$(jq -r .version $A/release.json)
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "base=$(jq -r .fileBase $A/release.json)" >> $GITHUB_OUTPUT
          echo "tag=${{ matrix.app }}-v$VER" >> $GITHUB_OUTPUT
      - name: Shared pictures
        run: bash .github/share-images.sh
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Windows build tools
        run: sudo apt-get update && sudo apt-get install -y binutils-mingw-w64-x86-64 nsis
      - name: Build exe and Setup
        working-directory: apps/${{ matrix.app }}/windows
        run: |
          cp -r ../web web
          V=${{ steps.info.outputs.version }}; C=$(echo $V | tr . ,)
          sed -i "s/1,0,0,0/$C,0/g; s/\"1\.0\.0\"/\"$V\"/g; s/1\.0\.0 Original/$V/g" app.rc
          x86_64-w64-mingw32-windres --preprocessor=cat -O coff -i app.rc -o rsrc_windows_amd64.syso
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H windowsgui" -o ${{ steps.info.outputs.base }}.exe .
          makensis -V2 -DVERSION=${{ steps.info.outputs.version }} installer.nsi
          ls -la *.exe
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: apps/${{ matrix.app }}/windows
        run: gh release upload "${{ steps.info.outputs.tag }}" ${{ steps.info.outputs.base }}.exe ${{ steps.info.outputs.base }}_${{ steps.info.outputs.version }}_Setup.exe --clobber

  ubuntu:
    needs: [prepare, release]
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - id: info
        name: Version and file names
        run: |
          A=apps/${{ matrix.app }}
          VER=$(jq -r .version $A/release.json)
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "base=$(jq -r .fileBase $A/release.json)" >> $GITHUB_OUTPUT
          echo "tag=${{ matrix.app }}-v$VER" >> $GITHUB_OUTPUT
      - name: Shared pictures
        run: bash .github/share-images.sh
      - name: Ubuntu build libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Set version number
        working-directory: apps/${{ matrix.app }}
        run: node -e "const f='src-tauri/tauri.conf.json',c=require('./'+f);c.version='${{ steps.info.outputs.version }}';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
      - name: Build .deb
        working-directory: apps/${{ matrix.app }}
        run: |
          npm install
          npx tauri build --bundles deb
          cp src-tauri/target/release/bundle/deb/*.deb ${{ steps.info.outputs.base }}_${{ steps.info.outputs.version }}_amd64.deb
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: apps/${{ matrix.app }}
        run: gh release upload "${{ steps.info.outputs.tag }}" ${{ steps.info.outputs.base }}_${{ steps.info.outputs.version }}_amd64.deb --clobber

  mac:
    needs: [prepare, release]
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - id: info
        name: Version and file names
        run: |
          A=apps/${{ matrix.app }}
          VER=$(jq -r .version $A/release.json)
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "base=$(jq -r .fileBase $A/release.json)" >> $GITHUB_OUTPUT
          echo "tag=${{ matrix.app }}-v$VER" >> $GITHUB_OUTPUT
      - name: Shared pictures
        run: bash .github/share-images.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Set version number
        working-directory: apps/${{ matrix.app }}
        run: node -e "const f='src-tauri/tauri.conf.json',c=require('./'+f);c.version='${{ steps.info.outputs.version }}';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
      - name: Build .dmg (Intel and Apple silicon)
        working-directory: apps/${{ matrix.app }}
        run: |
          npm install
          npx tauri build --target universal-apple-darwin --bundles dmg
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg ${{ steps.info.outputs.base }}_${{ steps.info.outputs.version }}_universal.dmg
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: apps/${{ matrix.app }}
        run: gh release upload "${{ steps.info.outputs.tag }}" ${{ steps.info.outputs.base }}_${{ steps.info.outputs.version }}_universal.dmg --clobber

  offline-zip:
    needs: [prepare, release]
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: info
        name: Version and file names
        run: |
          A=apps/${{ matrix.app }}
          VER=$(jq -r .version $A/release.json)
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "base=$(jq -r .fileBase $A/release.json)" >> $GITHUB_OUTPUT
          echo "tag=${{ matrix.app }}-v$VER" >> $GITHUB_OUTPUT
      - name: Shared pictures
        run: bash .github/share-images.sh
      - name: Make offline zip and attach it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          A=${{ matrix.app }}; B=${{ steps.info.outputs.base }}; V=${{ steps.info.outputs.version }}
          mkdir -p "pack/$B" && cp -r apps/$A/web/* "pack/$B/"
          mv "pack/$B/index.html" "pack/$B/Open Kit.html"
          printf 'Extract this zip, open the folder, then double-click "Open Kit.html". Keep it together with the data and img folders.\r\n' > "pack/$B/READ ME FIRST.txt"
          (cd pack && zip -qr "../${B}_${V}_offline.zip" "$B")
          gh release upload "${{ steps.info.outputs.tag }}" "${B}_${V}_offline.zip" --clobber
