# Clicks through the published web pages (the copies people open from the IBIN Apps page), on a computer and a phone screen.
# Each app uses the test named in its release.json ("test"), or the basic opening-screen test.
name: Test the live web version
on:
  workflow_dispatch:
    inputs:
      apps: {description: "app folders, space separated", required: true}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright@1.48.2 pngjs@7.0.0 && npx playwright install --with-deps chromium
      - name: Test
        run: |
          rc=0
          for a in ${{ inputs.apps }}; do
            t=$(jq -r '.test // "tests/smoke.test.js"' apps/$a/release.json 2>/dev/null || echo tests/smoke.test.js)
            for m in desktop phone; do node $t $a $m live || rc=1; done
          done
          exit $rc
