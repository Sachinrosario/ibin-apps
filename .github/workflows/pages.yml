# Publishes the web versions of all apps at https://sachinrosario.github.io/ibin-apps/
# Runs by itself whenever something changes on the main branch.
name: Web version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect web files
        run: |
          SKIP_MEDIA_SHARE=1 bash .github/share-images.sh
          mkdir -p site
          cp index.html catalog.json site/ && mkdir -p site/apps && cp apps/*.png site/apps/
          for d in apps/*/; do n=$(basename "$d"); mkdir -p "site/$n"; cp -r "$d/web/." "site/$n/"; done
          # apps that share another app's numbered pictures and recitations read them straight from that app's folder
          for f in apps/*/web/img/SHARED_MEDIA_FROM; do
            [ -f "$f" ] || continue
            n=$(basename "$(dirname "$(dirname "$(dirname "$f")")")"); src=$(tr -d '[:space:]' < "$f")
            echo "window.MEDIA_BASE = '../$src/';" > "site/$n/data/media-base.js"
          done
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
