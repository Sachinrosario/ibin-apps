<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcoSoft Apps</title>
<style>
:root{--bg:#F4F6F1;--card:#fff;--ink:#1C2B22;--muted:#5B6B60;--rule:#D5DDD2;--leaf:#2F6B45}
@media (prefers-color-scheme:dark){:root{--bg:#111813;--card:#18211B;--ink:#E4ECE5;--muted:#9CAB9F;--rule:#2C3A30;--leaf:#7FC797;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:40px 16px}
h1{font-family:Georgia,serif;margin:0 0 6px}
p{color:var(--muted);margin:0 0 24px}
.app{display:flex;gap:18px;align-items:center;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px;flex-wrap:wrap}
.app img{width:72px;height:72px;border-radius:14px}
.app div{flex:1;min-width:220px}
.app h2{margin:0;font-family:Georgia,serif;font-size:20px}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.links a{color:var(--leaf);font-weight:600}
</style>
<main>
  <h1>EcoSoft Apps</h1>
  <p>Ecoinformatics software rebuilt to run in the browser and on Windows, Mac and Ubuntu.</p>
  <section class="app">
    <img src="phyllanthus-rattans-kit/img/sp/34/fruit.webp" alt="">
    <div>
      <h2>Phyllanthus &amp; Rattans Identification Kit</h2>
      <span>Version 1.0.0 · Original (Indian Barcode of Life, 2010)</span>
      <div class="links">
        <a href="phyllanthus-rattans-kit/">Use it online</a>
        <a href="https://github.com/Sachinrosario/ecosoft-releases/releases">Download for Windows, Mac, Ubuntu</a>
      </div>
    </div>
  </section>
</main>
</html>
